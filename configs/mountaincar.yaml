# ============================================================
# Developmental AI Framework — MountainCar-v0 Configuration
# ============================================================
# Fresh-environment transfer test. The skill bank is LOADED, not wiped —
# CartPole + Acrobot skills are available for warm-start / transfer.
# MountainCar is sparse-reward (-1/step until the flag) and famously hard
# for vanilla PPO; it is a strong demonstrator for ICM curiosity-driven
# exploration, which is the whole point of this framework.
# ============================================================

# --- Environment ---
environment:
  name: "MountainCar-v0"             # Gymnasium environment ID
  success_reward_threshold: -150   # reward > this counts as success (reached flag in <150 steps)
  mastery_reward_floor: -200       # MountainCar random/worst-case return (timeout at 200 steps)
  mastery_reward_target: -100      # "excellent" return (~reach flag in <100 steps; solved ~= -110)
  max_episode_steps: 200             # Max steps per episode (MountainCar-v0 default)
  render_mode: null                  # Set to "human" for visual debugging
  pixel_obs: false                   # Use pixel observations (CNN encoder)
  image_size: 64                     # Pixel observation resolution (square)
  grayscale: false                   # Convert pixels to grayscale

# --- RSSM World Model (DreamerV3-style) ---
world_model:
  # Latent state dimensions
  stochastic_size: 32                # Number of categorical distributions
  stochastic_classes: 32             # Classes per categorical distribution
  deterministic_size: 512            # GRU hidden state size
  # Network sizes
  encoder_hidden: 256                # Encoder MLP hidden layer size
  decoder_hidden: 256                # Decoder MLP hidden layer size
  # Training
  learning_rate: 0.0003              # Adam optimizer LR
  batch_size: 32                     # Sequences per training batch
  sequence_length: 15                # Steps per sequence (shorter = more diverse batches)
  train_iters: 8                     # Gradient steps per episode (more = better dynamics)
  # Replay buffer
  buffer_capacity: 100000            # Max transitions stored
  # Imagination for planning
  imagination_horizon: 15            # How many steps to imagine forward

# --- Parallel Environments (vectorized lockstep collection) ---
parallel_envs:
  enabled: false                     # Master switch for vectorized collection
  num_envs: 4                        # Number of env copies stepped in lockstep

# --- Prioritized Experience Replay (PER) ---
prioritized_replay:
  enabled: true                      # Use error-weighted sampling
  alpha: 0.6                         # Priority exponent (0 = uniform, 1 = full)
  beta: 0.4                          # Importance-sampling correction strength
  epsilon: 0.01                      # Added to every priority so none hit zero

# --- Asynchronous Experience Replay ---
async_replay:
  enabled: true                      # Prefetch batches on a background thread

# --- ICM Curiosity Engine ---
curiosity:
  # Architecture
  feature_dim: 256                   # Shared feature encoding dimension
  hidden_dim: 256                    # Forward/inverse model hidden size
  # Loss weighting
  forward_loss_weight: 0.8           # How much to weight forward model loss
  inverse_loss_weight: 0.2           # How much to weight inverse model loss
  # Reward scaling
  curiosity_reward_scale: 1.0        # Multiplier for intrinsic reward
  curiosity_reward_clip: 5.0         # Max intrinsic reward per step
  # Training
  learning_rate: 0.0001
  # Novelty tracking
  novelty_window: 1000               # Window for tracking novelty decay

# --- Knowledge Graph ---
knowledge_graph:
  # Neo4j connection (requires running Neo4j instance)
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "password"
  # PyKEEN embedding settings
  embedding_dim: 64                  # KG entity/relation embedding size
  embedding_model: "TransE"          # Options: TransE, RotatE, ComplEx, DistMult
  embedding_epochs: 100              # Training epochs for KG embeddings
  # Fact extraction
  min_confidence: 0.7                # Minimum confidence to store a fact
  max_facts_per_step: 10             # Limit fact extraction per timestep
  # Fallback: use in-memory graph if Neo4j unavailable
  use_in_memory_fallback: true
  force_in_memory: false             # Set true to skip Neo4j even if available

# --- Symbolic Conditioning (Path A: make the symbolic layer load-bearing) ---
# When enabled, the graph-level knowledge vector (GNN over the KG) is fed to the
# policy as a DETACHED input feature through a learned KnowledgeConditioner gate
# trained by the policy loss, so the symbolic layer shapes behavior instead of only
# feeding a self-referential fact extractor. Set enabled=false for the obs-only
# ablation baseline (knowledge_dim collapses to 0 → policy sees raw observations).
symbolic:
  enabled: true                      # false = obs-only baseline (knowledge_dim=0)

# --- Skill Bank ---
skill_bank:
  storage_dir: "./skill_bank_data"   # Where to save learned skills locally
  # Mastery detection
  mastery_threshold: 0.8             # Success rate to consider skill "mastered"
  mastery_window: 50                 # Episodes to evaluate mastery over
  min_episodes_before_save: 20       # Minimum episodes before checking mastery
  # Skill retrieval
  max_skills_loaded: 5               # Max prior skills loaded for new goals
  similarity_threshold: 0.5          # Min similarity for skill retrieval

# --- Policy (Stable-Baselines3) ---
policy:
  algorithm: "PPO"                   # Options: PPO, SAC, A2C
  learning_rate: 0.0003
  n_steps: 2048                      # Steps per policy update
  batch_size: 64
  n_epochs: 10                       # PPO epochs per update
  gamma: 0.99                        # Discount factor
  gae_lambda: 0.95                   # GAE lambda
  clip_range: 0.2                    # PPO clipping
  # Reward mixing
  extrinsic_reward_weight: 0.3       # Weight for environment reward
  intrinsic_reward_weight: 0.7       # Weight for curiosity reward (sum = 1.0)
  reward_decay_rate: 0.000005        # Per-TIMESTEP curiosity->task anneal. 0.7->0.1
                                     # (floor) over ~120k steps, leaving headroom at
                                     # high-task for the policy to converge. Natural
                                     # drift, not a fixed ratio.

# --- LLM Integration (local via Ollama — no API key needed) ---
llm:
  enabled: true                        # Set false to disable all LLM features
  model: "llama3.1:8b"                 # Local model for perception/reasoning
  env_description: ""                  # Override with task-specific description
  perception_interval: 50              # Episodes between LLM fact extraction
  goal_interval: 25                    # Episodes between LLM goal generation
  reasoning_interval: 100              # Episodes between LLM knowledge analysis
  async_mode: true                     # Run Ollama calls off the training loop
  # Path B slice: LLM goal-progress potential-based reward shaping. The LLM scores
  # trajectory progress p in [0,1] (async, every `interval` episodes); consumed as
  # F = weight * (Phi_now - Phi_prev) on the last transition once per episode.
  # Difference-form telescopes (can't be farmed, preserves optimal policy) and the
  # weight anneals toward min_weight on the curiosity clock — natural drift.
  reward_shaping:
    enabled: true                      # false = no LLM shaping (pure curiosity+task)
    weight: 0.2                        # w0: initial shaping weight (annealed down)
    min_weight: 0.0                    # floor the weight anneals toward
    decay: 0.000005                    # per-TIMESTEP anneal (same clock as curiosity)
    clip: 1.0                          # clamp |F| per episode for stability
    interval: 25                       # episodes between LLM progress-scoring calls

# --- Skill Composition ---
skill_composition:
  enabled: true
  min_mastery: 0.7                     # Minimum mastery to consider for composition
  max_compositions_per_cycle: 3        # Max new compositions per mastery event

# --- Dream Training (DreamerV3-style imagination-based policy learning) ---
dream_training:
  enabled: false                         # On-policy PPO stays in control; world model still trains
  warmup_episodes: 50                    # Episodes before switching to dream policy
  imagination_horizon: 15                # Steps to imagine forward per trajectory
  batch_size: 16                         # Trajectories per dream training batch
  n_dream_batches: 1                     # Dream batches per world model update
  dream_curiosity: false                 # Add ICM curiosity to imagined rewards
  hidden_dim: 400                        # Dream actor/critic hidden layer size
  actor_lr: 0.00003                      # Dream actor learning rate
  critic_lr: 0.00003                     # Dream critic learning rate
  gamma: 0.997                           # Discount factor for imagined returns
  lambda_: 0.95                          # Lambda for lambda-return computation
  entropy_scale: 0.0003                  # Entropy bonus for exploration
  target_ema: 0.98                       # EMA decay for slow target critic

# --- Developmental Stage Controller (closed-loop curiosity->task handoff) ---
developmental_stages:
  window: 30                  # Episodes of history for slope / skill-rate
  patience: 5                 # Consecutive confirming checks before a transition (hysteresis)
  min_episodes: 50            # Guard: no forward transition before this many episodes
  flat_slope_threshold: 0.001 # |WM-error slope| below this counts as "plateaued"
  skill_rate_threshold: 0.02  # New-skills-per-episode below this counts as "flat"
  spike_factor: 2.5           # Re-entry: WM error > spike_factor x baseline => back to EXPLORE
  reentry_bump: 0.2           # On re-entry, nudge intrinsic UP by this much (capped at initial)
  trust_level: 0.0            # Stage-2 gate: WM-error level deemed "trustworthy" (<=0 disables IMAGINE)
  force_exploit_timestep: 120000  # Hard backstop: force EXPLORE->EXPLOIT if no plateau by here.
                                  # MountainCar is sparse — keep curiosity-heavy EXPLORE long so the
                                  # agent has time to first discover the flag before tipping to task.

# --- Hugging Face Hub (Skill Sharing) ---
hub:
  enabled: false                       # Set true to auto-push mastered skills
  repo_id: ""                          # e.g. "username/my-developmental-skills"
  private: true                        # Keep repo private by default
  push_on_mastery: false               # Auto-push each newly mastered skill
  token: null                          # HF token (uses cached huggingface-cli login if null)

# --- Distributed Training (Ray) ---
distributed:
  enabled: false                       # Set true to use Ray multi-worker
  num_workers: 4                       # Parallel environment workers
  num_cpus_per_worker: 1
  num_gpus_per_worker: 0               # Fractional GPU sharing: 0.25 = 4 workers per GPU
  shared_skill_bank: true              # Workers share discovered skills
  ray_address: null                    # null = local, "auto" = existing cluster

# --- Developmental Loop ---
loop:
  total_timesteps: 1000000           # Total training timesteps (CLI --timesteps overrides)
  checkpoint_interval: 10000         # Steps between checkpoints
  eval_interval: 5000                # Steps between evaluations
  eval_episodes: 10                  # Episodes per evaluation
  # Curriculum (auto-escalating difficulty)
  curriculum_enabled: true
  difficulty_increase_threshold: 0.8 # Performance level to increase difficulty
  difficulty_check_interval: 50      # Episodes between difficulty checks
  # Logging
  log_dir: "./logs"
  tensorboard: true
  verbose: 1                         # 0=silent, 1=info, 2=debug
