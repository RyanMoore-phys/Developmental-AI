environment:
  name: MineRLTreechop-v0
  max_episode_steps: null
  success_reward_threshold: 0.9
  mastery_reward_floor: 0.0
  mastery_reward_target: 8.0
  render_mode: null
  pixel_obs: true
  image_size: 128
  # RENDER 3x THE AGENT'S OBS (ported from lifelong 2026-08-01). The agent
  # still SEES 128px (block-mean downsampled -> obs_dim unchanged), but the
  # game renders NATIVELY at 384 and llava gets THAT frame via render().
  # llava:7b's vision tower is CLIP ViT-L/14-336, so a 128px frame was being
  # UPSCALED to 336 — blurry enough that it could not tell a zombie from a
  # skeleton. 384 lands just above native and is near-lossless.
  render_size: 384
  grayscale: false
  # ---- 2 -> 4 (2026-09-01) --------------------------------------------
  # The run holds ~3.4 steps/s against a 10 steps/s ceiling (20 server ticks
  # over repeat 2), so the SERVER's tick rate was never the binding
  # constraint — our own per-step Python was. Each agent step now covers 4
  # game ticks for the same per-step overhead: ~6.8 -> ~10 ticks/s of world
  # time, i.e. the wall clock buys roughly 1.5x more Minecraft.
  # It also halves every horizon measured in DECISIONS, which is the axis the
  # scoreboard actually fails on: a barehanded oak log is ~60 ticks, and the
  # measured median swing was 4.
  #
  # FOUR CONSTANTS MOVE WITH IT, and shipping this without them would have
  # quietly made things worse:
  #   * TREECHOP_MACROS[12] `_ticks` 20 -> 40. `_ticks` is ABSOLUTE and does
  #     not scale, so hold-attack's 10x edge over a plain attack would have
  #     silently become 5x.
  #   * MOVE_SCALE is now derived from action_repeat (_move_scale), or the
  #     `moved` proprio saturates on every ordinary walk.
  #   * the swing-retarget threshold is now 0.025 * action_repeat, or normal
  #     drift over 4 ticks reads as a retarget and zeroes attack_run.
  #   * max_option_steps drops (see skills_as_options) — 80 steps would be
  #     320 ticks.
  # Tick-denominated values (persistence_ticks, log_tick_cap,
  # neg_evidence_ticks, ATTACK_RUN_SCALE) keep their meaning unchanged.
  # Step-denominated ones (gui_dwell_steps, the excavation window) now cover
  # twice the world time — acceptable, and named here so it is not a surprise.
  action_repeat: 4
  # SKYBOT: the primary lifelong stream (env 0) joins the user's Paper
  # server through the pod-local socat->tailscale bridge. Scouts stay in
  # local generated worlds (scope: primary). "all" would put every
  # stream on the server.
  remote_server: "127.0.0.1:25565"
  # SOCIAL EXPERIMENT (2026-08-17): every stream joins the SAME persistent
  # server, so the agents can see and learn from each other. Previously only
  # slot 0 was remote and scouts ran throwaway local worlds. This is only
  # survivable because each client now has its OWN identity — see
  # `agent_name_prefix` and DevelopmentalAI._agent_name_for; with a shared
  # name Minecraft kicks the incumbent on every duplicate login and the
  # clients evict each other forever.
  remote_server_scope: all
  # Slot 0 stays the bare prefix (its offline UUID owns the lifelong
  # stream's position and inventory); scouts become SkyBot1, SkyBot2, ...
  # NOTE for an offline-mode server: each new name is a NEW player, so a
  # whitelist must include them or they cannot join.
  agent_name_prefix: SkyBot
  # ACTION THROTTLE (seconds of sleep per remote step; 0 = off).
  # Off is normally correct: against a real server the client is tick-synced
  # to the server's 20 TPS, so the agent already runs at wall-clock speed and
  # cannot out-pace a human player. Raise this ONLY if the server's
  # anti-cheat/anti-spam objects (rapid camera slew reads as erratic to some
  # plugins). 0.05 roughly halves the command rate. Applied after the step,
  # so it paces commands without distorting what the agent observes, and it
  # is remote-only — the local scout keeps running at full speed.
  remote_step_delay_s: 0.0
  # ---- NO START TOOL (2026-08-02) --------------------------------------
  # null = spawn EMPTY-HANDED. Previously an iron axe was granted via
  # SimpleInventoryAgentStart, and on the external server it was RE-GRANTED
  # on every rejoin — so each auto-rejoin handed the tool back and the
  # "barehanded" test never actually ran.
  #
  # It also made the two streams disagree: with an axe a log is ~8 ticks,
  # barehanded it is ~80. The scout kept its axe while the primary lost and
  # regained one, so the world model was being taught two different break
  # dynamics for the same block — and max_option_steps: 40 (= 80 ticks) is
  # sized for the barehanded case.
  #
  # With this null, no SimpleInventoryAgentStart handler is added at all, so
  # there is nothing to re-grant. Anything the agent ends up holding, it
  # obtained itself.
  # ---- AXE RESTORED, DELIBERATELY AND TEMPORARILY (2026-08-04) ---------
  # null (spawn empty-handed) was set 2026-08-02 to make the barehanded test
  # honest. MEASURED cost of that purity: ~5000 blocks broken over days and
  # ZERO logs — and, the part that matters, the agent has never ONCE
  # experienced a log break. Every reward mechanism built since reinforces an
  # event that has never occurred; you cannot learn to chop from data that
  # contains no chops.
  #
  # THE BINDING CONSTRAINT IS SWING LENGTH, not aim or guidance:
  #     swings ending with no break: 400  (median 4t, >=8t: 93)
  #     barehanded oak log: ~60 ticks
  # The median swing is 15x too short, so even perfect VLM guidance onto a
  # trunk could not fell it. An iron axe takes a log to ~8 ticks, which 23%
  # of swings already reach — the first log goes from effectively impossible
  # to near-certain within a segment or two.
  #
  # THIS IS NOT SCRIPTING THE BEHAVIOUR. The agent must still find a tree,
  # aim at the trunk rather than the leaves, and hold the swing. It only
  # lowers the bar from "sustain 60 ticks" (never once observed) to "sustain
  # 8" (observed ~93 times per segment).
  #
  # REMOVE IT once a real break_oak_log skill has minted from genuine log
  # breaks. That is the honest barehanded test, run in an order where it can
  # succeed rather than as a precondition for ever starting.
  # NOTE: on the external server the grant is re-applied on every rejoin.
  # REVERTED TO null (2026-08-04). SimpleInventoryAgentStart is a SERVER-side
  # handler in the mission XML, and a foreign Paper server ignores it — the
  # same reason the frozen-daytime and world-generator handlers are ignored.
  # We cannot hand SkyBot a tool from this side; only the server operator can
  # (console/RCON `give`). Worse, setting it non-null is actively HARMFUL
  # here: the local scout DOES honour the grant, so env 1 would swing an axe
  # while env 0 (the server) stayed barehanded, teaching the SHARED world
  # model two different break dynamics for the same block — the exact
  # inconsistency the 2026-08-02 note warned about.
  #
  # The analysis behind wanting one still stands, and is for the operator:
  #     swings ending with no break: 400  (median 4t, >=8t: 93)
  #     barehanded oak log ~60 ticks | iron axe ~8 ticks
  # The median swing is 15x too short to fell a log, so no guidance or
  # shaping fix can produce a chop until either a tool is granted server-side
  # or swings get dramatically longer.
  start_tool: null
  # ---- PHASE-SCOPED ACTION SPACE (2026-08-02) --------------------------
  # Primitive macro indices the policy may not select right now. Indices are
  # never renumbered (the macro table is append-only and stored skills index
  # actions by position) — the action is simply not offered.
  #
  # 10 = `inventory`. MEASURED on the live server: with it selectable the
  # agent spent 80% of every segment inside the menu, where 5 of its 12
  # actions do nothing at all and the camera actions move a CURSOR instead
  # of its head. Its pitch stayed clamped at -90 (straight up), so it could
  # not look down to reach anything, and the only exit is a two-step
  # release-then-press on an action it chose <4% of the time. gui-dwell was
  # rising (52% -> 80%), not falling.
  #
  # This declares no meaning and hands over no skill. It is the same scoping
  # the macro table already applied when it took inventory+use "over
  # hotbar.1-9 to keep the exploration burden small". RE-ENABLE (set to [])
  # when crafting is the actual objective — the button is a phase-2
  # capability and the current phase is chopping.
  # 6 RE-ENABLED (2026-08-02). Disabling attack+walk was a MISTAKE and the
  # measurement says so: it was 51% of all actions, and removing it did not
  # push the agent onto the stationary attack (5) — it pushed it onto plain
  # walking (40%), so it simply stopped attacking at all and `persistence`
  # went to exactly 0.0000/step. Removing the capability was the blunt fix.
  #
  # The right fix was already in place: the swing counter now RESETS on a
  # real retarget (position/look change), so attack+walk accumulates no
  # persistence potential while stationary attack does. The agent is taught
  # the difference by the gradient instead of having the action taken away.
  # 10 RE-ENABLED (2026-08-17) — and the macro-6 note above is the precedent.
  #
  # THE ONE-WAY DOOR. Disabling 10 removed the only action that CLOSES a
  # screen while leaving 11 (`use`) — an action that OPENS one — fully
  # available. Measured consequence: SkyBot right-clicked a WANDERING
  # VILLAGER, its trade screen opened, and it sat inside for 10,149+
  # CONSECUTIVE steps with no exit in its action space at all. The dwell was
  # not a preference; it was a room with the handle taken off the inside.
  #
  # WHY THE ORIGINAL MEASUREMENT NO LONGER HOLDS. The 52%->80% rising dwell
  # that justified disabling this was driven by a REWARD LEAK, found and
  # fixed the same day: the gui_open guard zeroes `intrinsic`, but the
  # magnet's shaping is added to prim_EXTRINSIC, which it never covered —
  # so the menu was paying 77% of all income. The agent was not choosing the
  # menu over the world; the menu simply paid better. With that leak closed
  # and `gui_dwell_weight` supplying a gradient toward the door, a menu now
  # pays strictly <= 0 while the world pays > 0.
  #
  # This is the macro-6 lesson verbatim: "Removing the capability was the
  # blunt fix. The right fix was already in place... The agent is taught the
  # difference by the gradient instead of having the action taken away."
  # tests/_gui_farm_smoke.py pins the invariant: no GUI-opening action may
  # be offered without the GUI-closing one.
  disable_macros: []
  # ---- LOG ECONOMICS (2026-08-03) --------------------------------------
  # MEASURED cause of "breaks everything except trees": the first-break tiers
  # re-arm every goal_horizon, so four trivial block types can be re-harvested
  # indefinitely for ~0.75/horizon needing no aim and no sustained effort,
  # while a log paid 5.0 once for ~60 consecutive ticks on one specific
  # target. Reliable-and-easy beat large-and-hard, and PPO correctly
  # converged on clearing ground vegetation (2484 blocks, 0 logs).
  #
  # Pay for the EFFORT, per attack tick invested, logs only:
  #     grass   0.15 over  ~1 tick  = 0.150 /tick
  #     leaves  0.30 over  ~7 ticks = 0.043 /tick
  #     dirt    0.15 over ~20 ticks = 0.008 /tick
  #     stone   1.00 over ~40 ticks = 0.025 /tick
  #     LOG     0.50/tick + 20.0/60 = 0.833 /tick   <- 5.5x the best other
  # A felled log is then ~50 total (30 effort + 20 completion) against 0.15
  # for grass, so the first log is worth more than every trivial break the
  # agent has ever made combined.
  #
  # RETROACTIVE, necessarily: nothing in the observation says "I am mining a
  # log right now" — only the completed break names the block. GAE propagates
  # it back over the swing, which is the same gradient, but it is paid at
  # completion, not during.
  log_tick_reward: 0.5
  log_break_reward: 20.0
  # HARD CAP on ticks paid. `attack_run` has been observed at 13538 on a swing
  # that never landed; uncapped, one mis-attributed streak would pay ~6800 and
  # wreck the run. 120 = 2x a barehanded log, so real chops are never clipped.
  # 120 -> 300 (2026-08-14, same directive). This caps ticks PAID, not ticks
  # held, so at 120 a genuinely long mine was only partly compensated while
  # still costing full effort — a quiet penalty on exactly the persistence
  # we want. The cap must STAY (the 13538-tick mis-attribution is why it
  # exists); 300 keeps the worst case bounded while no longer clipping a
  # slow, honest break.
  log_tick_cap: 300
  # ---- FAMILIARITY DECAY ON BREAKS (2026-08-06) ------------------------
  # MEASURED: 85% of 2231 breaks were dirt. The first-break tier re-arms
  # every goal horizon, so the ground underfoot is an inexhaustible 0.15
  # income needing no aim and no sustained effort — every capability built
  # for chopping got pointed at the floor instead.
  # The payout for a block TYPE now decays with how often that type has
  # already been felled: tier / (1 + n_type / scale). At scale 25:
  #     dirt   n=1899 -> x0.013  (0.15 -> 0.002, effectively nothing)
  #     leaves n=71   -> x0.26
  #     LOG    n=0    -> x1.00   (full 20.0 + 0.5/tick effort, untouched)
  # It declares NOTHING about dirt. It is novelty-of-achievement, the same
  # 1/(1+n) shape the curiosity terms already use: stop paying for what has
  # been thoroughly mastered, leave what has never been managed worth most.
  break_decay_scale: 25.0
  # LIFELONG BREAK MEMORY (2026-08-08): breaks_by_type persists here across
  # restarts, so "mastered" survives a redeploy — every restart used to
  # re-open the dirt tier at full worth and reset the familiarity decay.
  # Primary stream only (scouts explore local throwaway worlds).
  break_memory_path: podlogs/breaks_by_type.json
world_model:
  # ---- SCALE-UP 2026-08-14 (user directive) ----------------------------
  # 12.5M -> 54.1M params; the DYNAMICS CORE (rssm) goes 2.3M -> 21.7M and
  # the reward head 0.53M -> 2.6M. Latent 1536 -> 4352.
  #
  # WHY NOW: measured GPU utilisation was 2% — the Minecraft client is the
  # bottleneck, not compute — so a 4x larger world model is very nearly free
  # in wall-clock. Measured on the live RTX 5060 Ti: 1.59 GB peak for one
  # training step, against ~3.3 GB free. `batch_size` (16) is the lever if
  # that proves tight.
  #
  # COST, stated plainly: every one of these changes tensor SHAPES, so
  # world_model.pt / glue_layer.pt / symbolizer.pt cannot restore and the
  # trained encoder+RSSM are lost. Taken deliberately now rather than later
  # — the reward head was already being discarded each boot after the
  # dirt-economy finding, and the perception state sacrificed today is
  # worth less than it would be after another week of training.
  #
  # NOTE `encoder_hidden` sets BOTH the encoder and decoder width (the
  # constructor takes one `hidden_dim`); `decoder_hidden` below has no
  # reader and is kept only so the config still documents intent.
  stochastic_size: 48
  stochastic_classes: 48
  deterministic_size: 2048
  # (5/5) 512 -> 768. THE WEAKEST OF THE FIVE, kept last on purpose.
  # MEASURED COST, which is far below the estimate this shipped on: the
  # world model goes 216 -> 260 MB fp32 (+132 MB with Adam), NOT the
  # ~75 -> ~150 MB decoder growth predicted — because the decoder does not
  # scale with this knob at all (see decoder_hidden below). What actually
  # grew is the encoder (12.3 -> 16.5) and the RSSM's embed width
  # (90.5 -> 109.4). It still invalidates world_model.pt outright. My reading is that this world model
  # is DATA-starved, not capacity-starved — it has essentially never seen a
  # log break — and change (1) tests that hypothesis far more cheaply.
  # Included because it was asked for; FIRST THING TO REVERT if the WM block
  # time regresses without a loss improvement.
  # NOTE: this moves rssm.obs_dim, which the fovea head's input width is
  # derived from — but that reads the LIVE object, never config
  # (developmental_loop.py ~894), so it follows automatically. The
  # symbolizer's head_arch guard will correctly report fovea_head=FRESH.
  encoder_hidden: 768
  # ---- decoder_hidden IS NOT READ BY ANYTHING (found 2026-09-01) --------
  # Measured while landing this wave: raising it 512 -> 768 changed the
  # decoder by exactly 0 bytes (75.2 MB before and after). Two reasons, both
  # verifiable:
  #   * nothing in the tree reads `world_model.decoder_hidden` — the loop
  #     passes only `hidden_dim=wm_cfg["encoder_hidden"]` to WorldModel;
  #   * CNNDecoder ACCEPTS a `hidden_dim` argument and never uses it in the
  #     body — its size is set by latent_dim (the fc layer) and the
  #     image_size channel ladder.
  # Left at 768 for symmetry with encoder_hidden and flagged at boot, the
  # same treatment policy.batch_size gets: a config key that does nothing
  # must SAY it does nothing rather than imply a capacity that is not there.
  # Making it real means giving CNNDecoder an actual fc stack — an
  # architecture change with no evidence behind it, deliberately not done
  # inside a sizing wave.
  decoder_hidden: 768
  learning_rate: 0.0003
  # ---- DATA DIET 2026-08-23: SPAN, RATIO, HORIZON ----------------------
  # These four are RUNTIME dimensions, not parameter shapes, so unlike the
  # 08-14 scale-up none of this discards a trained encoder or RSSM.
  #
  # 1. A TRAINING SEQUENCE MUST BE ABLE TO CONTAIN A TREE-BREAK.
  #    seq 16 at action_repeat 2 spans 32 GAME TICKS. Measured
  #    `Ticks-to-break`: dirt/grass are 20-22t (they fit), but a BAREHANDED
  #    LOG needs ~60t. The world model has therefore never seen a complete
  #    log-break as one trajectory — only its first half or its second half.
  #    We were asking it to learn an event that does not fit in its window.
  #    16 -> 32 spans 64 ticks, which clears 60 with margin.
  #
  #    Batch is halved in exchange so transitions-per-gradient-step (256) and
  #    the obs tensor (50.3 MB) are UNCHANGED — this buys temporal span at
  #    constant memory, which matters because VRAM is shared with the VLM's
  #    ~5 GB and one training step measured 1.59 GB against ~3.3 GB free.
  #
  # 2. REPLAY RATIO. train_iters 128 x 16x16 per (wm_train_every 250 x 2
  #    envs) = 65.5 replayed transitions per collected one. DreamerV3 on
  #    Minecraft runs ~512. We are ~8x under-trained on data we ALREADY HAVE,
  #    on a GPU measured at 2% utilisation with the async trainer reporting
  #    `skip 0.0%` — it is never behind. 128 -> 384 lifts the ratio to ~196.
  #    NOT straight to ~512: the ratio is only safe alongside a buffer big
  #    enough to feed it (see buffer_capacity), and this is the knob most
  #    likely to overfit recent experience.
  #    THE GOVERNOR IS THE EXISTING LOG LINE: `AsyncWM replay-ratio: N/M
  #    blocks run (skip X%)`. It reads 0.0% today; if raising this pushes it
  #    past ~10% the trainer has stopped keeping up and this went too far.
  # ===== CAPACITY WAVE (2026-09-01) =====================================
  # Five sizing changes landed together. They are together because there was
  # nothing to invalidate: no pod, no live brain, and skill_bank.storage_dir
  # was already repointed to an empty dir by the arch: rssm change. Two of
  # them are checkpoint-breaking, so doing them NOW is free and doing them
  # after a run would orphan accumulated state.
  # ATTRIBUTION IS BOUGHT ON CRAFTER, not here — five capacity changes in one
  # Minecraft run cannot be told apart, and each is a one-key ablation on
  # configs/crafter.yaml, which is CPU-viable on a Mac Mini over a weekend.
  # (1/5) 8 -> 16. A 54M-param world model updated on 8 sequences carries
  # high gradient noise, and this model is the substrate for EVERYTHING:
  # imagination, prospection, the policy's input under arch: rssm, and
  # mastery's WM-fidelity ratio. Costs ~+1 GB of activations.
  # FREE SIDE EFFECT, and it is the one that matters most here: the batch
  # quotas are int(fraction x batch_size). At 8 that was int(0.15*8)=1 goal
  # window and int(0.05*8)=0 terminal; at 16 it is 2 goal windows and still
  # 0 terminal. Goal-prioritised replay DOUBLES — and that is the mechanism
  # most starved of the rare log break the whole scoreboard turns on.
  # REVERT IF: the AsyncWM `block ms/iter` line roughly doubles without a
  # matching drop in wm loss.
  batch_size: 16
  sequence_length: 32
  train_iters: 384
  # ---- ...OR LET THE MEASURED SKIP RATE SET IT (2026-09-01) ------------
  # 384 is a NOMINAL figure. With the async trainer's skip-if-busy the ratio
  # the GPU actually sustains is 384 x (1 - skip), so the config has been
  # stating an intent while the hardware quietly decided the real number and
  # nothing reconciled the two — the `AsyncWM replay-ratio` line reports the
  # gap every goal horizon and nobody acted on it.
  # When enabled, train_iters tracks `target_skip`: high skip means the block
  # outlasts its cadence, so shorten it and run MORE blocks on FRESHER data.
  #
  # SHIPPED OFF, deliberately. This changes the world model's DATA DIET,
  # which is the one thing in this wave a smoke test cannot judge — the same
  # reason curiosity.train_every is still 1. Turn it on alone, with a cluster
  # to watch, and read `wm/loss` across three goal horizons before trusting.
  train_iters_auto:
    enabled: false
    target_skip: 0.2
    min_iters: 32
    max_iters: 512
  # 3. MEMORY HORIZON. Capacity is SPLIT ACROSS STREAMS
  #    (MultiStreamReplayBuffer: per_stream_cap = capacity // num_streams),
  #    so 240000 with 2 bodies gave each 120k transitions = 10.4 HOURS at
  #    3.2 steps/s. Everything older was overwritten. For an agent whose
  #    whole premise is lifelong development, a ten-hour memory is the diet.
  #    1M -> 500k per stream ~ 43 h each. Cost at uint8 obs: ~49 GB of the
  #    pod's 125 GB, against ~10 GB of non-buffer RSS. Comfortable.
  #    RAISE THIS WITH train_iters, never without: a high replay ratio over a
  #    ten-hour window is a recipe for overfitting the last ten hours.
  buffer_capacity: 1000000
  # ---- CAPACITY IS A STARTING POINT, NOT A RESERVATION (2026-09-01) ----
  # `buffer_capacity` used to mean np.zeros((1000000, 49152)) per stream —
  # ~24.5 GB each, ~49 GB for a 2-client fleet. calloc hands back lazily
  # mapped zero pages, so nothing failed at startup; RSS simply climbed as
  # the buffer filled and the process was killed part-way through. At ~7
  # transitions/s that is ~40 hours in — precisely the multi-day runs this
  # project exists to do, which is why it never showed up in a smoke test.
  #
  # With growth on, the buffer STARTS at one block and appends blocks on the
  # world-model cadence, so resident memory tracks what has actually been
  # collected rather than what was hoped for. `buffer_capacity` above becomes
  # the initial target only.
  #
  # A BUFFER CANNOT GROW WITHOUT BOUND. What this gives is growth up to a
  # ceiling read from the CONTAINER's real memory limit, and then a loud
  # fallback to the circular overwrite that shipped before — degradation, not
  # death. `enabled: false` restores the old fixed preallocation exactly.
  buffer_growth:
    enabled: true
    # ~25k transitions per block = ~1.2 GB of uint8 observations at
    # obs_dim 49152. Large enough that growth is rare; small enough that a
    # part-filled final block is not mostly waste.
    block_transitions: 25000
    # Grow at 85% full, not at 100%: the new block has to be in place BEFORE
    # the write position reaches the end, or transitions get overwritten in
    # the window between the flag and the next world-model block.
    grow_at_frac: 0.85
    # Fraction of the container's memory limit the replay buffers may
    # collectively hold. Resolution order is cgroup v2 -> cgroup v1 ->
    # psutil -> sysconf; the cgroup entries come FIRST on purpose, because
    # reading the host's RAM inside a container is the measurement trap this
    # project has already paid for once, and on a cluster the container is
    # the normal case rather than the exception. ONE budget is shared by
    # every stream: N streams each taking a fraction of the machine is an
    # N-times overshoot, and N is exactly what varies.
    max_ram_frac: 0.6
    # Absolute GB cap on top of the fraction; 0 = fraction only.
    #
    # ---- 0 -> 16 (2026-09-02): A DECISION, NOT A SIDE EFFECT ------------
    # At fraction-only the ceiling was whatever 60% of the box happened to
    # be — 38 GB on a 64 GB node, i.e. ~772k transitions (~36 hours of
    # experience), because 99.87% of every row is the 49,152-byte uint8
    # frame. Nothing derived that from what the world model NEEDS; it was
    # the machine size leaking into the learning setup.
    #
    # 16 GB = ~325k transitions = ~15 hours of history. Still large by any
    # replay standard, and there is a real argument it should not be bigger:
    # this is a LIFELONG, non-stationary stream, so half of a 36-hour buffer
    # is behaviour the agent has since abandoned, and the WM spends capacity
    # modelling a policy that no longer exists. Whether recency beats
    # history here is genuinely unknown — which is exactly why the number
    # should be a deliberate knob someone can move while watching `wm/loss`,
    # not an accident of node RAM. The fraction still applies underneath, so
    # a small node is still protected; on a big node THIS is the ceiling.
    hard_max_gb: 16
  # 4. PERSIST THE MEMORY. The buffer had NO save/load path at all, so the
  #    supervisor's automatic crash-relaunch (and live Python exceptions have
  #    caused those) restarted world-model training from EMPTY. Written on the
  #    checkpoint cadence, OUTSIDE the WM param lock so a multi-GB write
  #    cannot stall the acting thread, and committed by a manifest file
  #    written LAST — a directory without one reads as absent rather than as
  #    a half-written buffer (world_model.pt's non-atomic write has already
  #    cost this project one silent partial restore).
  #    max_gb CAPS it PER STREAM: 8 GB ~ 162k transitions ~ 14 h each, which
  #    keeps the write bounded and the volume safe. Raise once the pod's free
  #    disk is known — the instance footprint measured ~42 GB.
  buffer_persist: true
  buffer_persist_max_gb: 8.0
  # (removed 2026-08-01: world_model.imagination_horizon had NO reader — the
  # only consulted key is dream_training.imagination_horizon. Two identical
  # values, one of which did nothing.)
  # ---- BATCH COMPOSITION (2026-09-01) ---------------------------------
  # `terminal_fraction` was never passed from here, so the sampler used its
  # 0.25 default — a figure that makes sense for EPISODIC training, where
  # terminals are common. This run is lifelong with reset_on_death_only, so
  # a terminal is a DEATH: rare by design. At 0.25, train_iters 384 and
  # batch_size 8, that was 768 draws per training block (every 250 env
  # steps) from a pool of a few dozen death windows, drawn WITH replacement
  # — a quarter of the world model's capacity spent memorizing the same
  # handful of frames. The sampler now also refuses to duplicate a small
  # pool, so this is a ceiling and not a quota: when there genuinely are no
  # terminals to learn from, those slots go to ordinary experience.
  terminal_fraction: 0.05
  # THE MECHANISM THAT WAS BUILT FOR THIS AND LEFT OFF. Windows containing a
  # nonzero reward are the rarest and most valuable thing in the buffer here
  # — the scoreboard is "399 breaks in pod history, exactly 1 log, ever". At
  # 0 the world model saw the log break with probability proportional to its
  # frequency, i.e. essentially never, which is the direct cause of it not
  # being able to predict the one event the whole run is about. Repeats ARE
  # allowed in this pool, unlike terminals, and it self-limits: the pool
  # grows every time the agent succeeds.
  goal_replay_fraction: 0.15
  film_conditioning: true
  inverse_dynamics: true
  inverse_dynamics_scale: 1.0
  causal_align: true
parallel_envs:
  enabled: true
  reset_timeout_s: 300
  step_timeout_s: 120
  # 4 -> 2 (2026-08-17, MEASURED). Four clients on the shared server did
  # not work: 0 segments in 17 minutes, 9 client rebuilds, env 0 dying on
  # `TimeoutError` reading its own trainer<->java socket. The pod was NOT
  # the constraint and this is worth recording, because every instinct says
  # otherwise — bridge 0.3% CPU, GPU 0-13%, load 4 of 48 cores, distinct
  # core pins, no duplicate-login kicks. Everything local was idle while
  # the clients starved, which leaves the one component not on this box:
  # the Minecraft server absorbing four simultaneous joins and four chunk
  # streams. So the ceiling on peers is the SERVER's, not the pod's.
  # 2 = slot 0 + one peer: the minimum that still makes social learning
  # possible, and only 2x the traffic of the known-good single client.
  num_envs: 2
prioritized_replay:
  enabled: true
  alpha: 0.6
  beta: 0.4
  epsilon: 0.01
async_replay:
  enabled: true
curiosity:
  # EXTERNAL CURIOSITY (ported from lifelong 2026-08-01 — skybot had NO
  # coverage_weight at all, so it defaulted to 0.0 and territory novelty was
  # silently OFF). Count-based novelty over discretised world cells: new
  # ground pays ~1, revisits decay as 1/sqrt(visits). This is what keeps the
  # WORLD able to surprise a lifelong agent after prediction-error curiosity
  # has mastered the current view. Intrinsic channel only, never a replay label.
  # 0.15 -> 0.45 (2026-08-02). MEASURED on the live server: territory was
  # emitting correctly but contributed only +0.0123/step — 6% of a
  # +0.1905/step intrinsic drive — while `cells seen` sat at 2. The agent had
  # collapsed onto spinning (turnL 56%), which is the cheapest novelty
  # available once the inventory was closed off: rotating repaints the whole
  # frame for one action, whereas walking must cross ~8-16 steps before a new
  # cell pays. Coverage was not broken, it was OUT-COMPETED.
  #
  # This raises the payout for TRANSLATION without penalising rotation — no
  # term says turning is bad. New ground now pays 0.45/step against a ~0.19
  # total drive, so a walking policy roughly triples its income while a
  # parked one still decays as 1/sqrt(visits) (0.45/sqrt(1000) = 0.014).
  # Revert to 0.15 if the agent starts sprinting past trees instead of
  # engaging them — territory is a means to find things, not the goal.
  # ---- #1/#3 PERSISTENCE (potential-based, 2026-08-02) ----------------
  # Holding attack is the LOWEST-novelty action available, so ICM paid most
  # for turning/walking and least for the one behaviour that breaks blocks.
  # Phi = min(1, attack_run / persistence_ticks); F = gamma*Phi' - Phi.
  # Provably policy-preserving (Ng): a swing-then-abandon cycle telescopes to
  # ~0, so there is no income in starting swings. What it adds is a per-step
  # gradient for CONTINUING one — the signal a stochastic policy needs to
  # hold an action for the ~8 consecutive macros a barehanded break costs.
  # Set to 0.0 to disable. Intrinsic channel only, never a replay label.
  # 0.30 -> 1.00 (2026-08-02). MEASURED: at 0.30 the per-step gradient was
  # ~+0.0074 against a total intrinsic drive of +0.2565 — under 3%, far too
  # quiet to compete with novelty. At 1.00 it is ~10% of the drive, and the
  # full potential (1.0 at a completed break) sits sensibly below the +5.0 a
  # log actually pays, so shaping never dwarfs the real task signal.
  persistence_weight: 1.00
  # 80 -> 200 (2026-08-14, user directive: "under ideal situations SkyBot can
  # learn to mine as long as it wants; it should be limited by long-hold
  # constraints"). Phi saturates at persistence_ticks, so BEYOND that value
  # the gradient to KEEP HOLDING is exactly zero — the encouragement to
  # continue vanished at 80 ticks, precisely where a slow block needs it
  # most. It was sized for a barehanded log (~60t) and silently capped
  # anything harder: stone with a pickaxe, obsidian, ore. The agent has
  # demonstrably held 202 ticks, so this is not a capability limit, it was a
  # SHAPING limit.
  # What bounds a pointless hold now is the honest one: effort_cost, charged
  # per attack tick, so holding forever bleeds while a long PRODUCTIVE mine
  # is repaid by the block. A ceiling on the gradient is an arbitrary cap; a
  # metabolic cost is a constraint.
  persistence_ticks: 200
  # ---- #7 APPROACH TO REACH (potential-based) -------------------------
  # The stall fix zeroed approach/align/aim because they were RAW per-step
  # income a parked agent farmed. This restores the missing half in
  # telescoping form: a potential on P(breakable_in_reach), so closing pays,
  # standing still pays exactly 0, and backing off charges it back.
  reach_weight: 0.25
  # GAZE LEVELING (2026-08-16). Measured live: pitch pinned at +90 ("<--
  # PINNED"), at a clamp on 21% of steps, and every vision predicate starved
  # into DEGENERATE because the ground fills the whole view. The gaze-bucket
  # bonus unsticks a clamp once and then saturates (1/sqrt(n)) — nothing
  # durable makes leaning on the clamp COST. Telescoping potential
  # Phi = -(|pitch|/90)^4: quartic, so mining tilts up to ~60 deg cost ~2%
  # of the weight while the last 30 deg into a clamp carry the whole
  # gradient. Exit pays back exactly what entry charged — no farm either
  # way. Weight sized against the measured +0.003/step total drive: leaving
  # the clamp for the horizon collects a one-time ~+0.02 (about 6 steps of
  # everything else) — an audible nudge, not a command.
  pitch_level_weight: 0.02
  # GUI DWELL (2026-08-17). MEASURED LIVE: SkyBot right-clicked a wandering
  # villager, opened its trade screen, and sat in it for 10,149+ CONSECUTIVE
  # steps — position frozen, gui 66% of the segment — while magnet_seek paid
  # 77% of ALL income, because the gui_open guard zeroes `intrinsic` and the
  # magnet's shaping is added to the EXTRINSIC channel it never covered.
  # That leak is fixed; this term supplies the other half. Zeroing income
  # gives no reason to LEAVE, and it had already trained `inventory` — the
  # only button that closes a screen — to zero probability (0 presses in a
  # whole run at 92%-of-max entropy), because pressing it opens a screen
  # that pays nothing. Telescoping Phi = -min(1, gui_run/steps): dwelling
  # costs once, leaving refunds it, a cycle nets ~0. Small on purpose — it
  # is a nudge toward the door, not a punishment for opening one, and
  # crafting still earns its extrinsic tier inside the menu.
  gui_dwell_weight: 0.05
  # 200 -> 100 (2026-09-01, action_repeat 2 -> 4). STEP-denominated: Phi is
  # -min(1, gui_run/steps), so at 200 steps x 4 ticks the dwell cost only
  # saturated after 800 GAME TICKS — halving, in world time, the one gradient
  # pulling the agent back out of a menu. The incident this term exists for
  # ran 10,149 consecutive steps inside a wandering villager's trade screen.
  # 100 restores the original ~400-tick meaning.
  gui_dwell_steps: 100
  # BORING-VIEW BASE DISCOUNT (2026-08-16). Run of 2026-08-16, -90 clamp:
  # ICM/LP base +0.0147/step = 96% of the drive, paid for watching clouds
  # drift — the sky discount only ever covered the itemised novelty term,
  # so the BASE was a standing wage no shaping term could outbid. This
  # applies the same measured boring-view judgement (geometry past 55 deg
  # of tilt, fovea sky reading, learned mastery-boringness; floored at
  # 0.15) to the base itself. At 0.85: a fully-boring view retains
  # 1 - 0.85*0.85 ~ 28% of base pay (~0.004/step — below every honest
  # opportunity), a horizon view keeps ~full pay. Reward-side only: the
  # world model still trains on every frame.
  icm_boring_discount: 0.85
  # MEASURED over a full run: Reach sense 0.01-0.03 while the agent broke
  # 4931 blocks. `breakable_in_reach` is VLM-taught and llava cannot judge
  # reach from a still frame, so the head learned to answer "no" and the
  # approach-to-reach potential above was inert. "evidence" reads ground
  # truth instead — a completed break proves something was within range.
  # Retrospective, and honest about it: it says "I recently could touch
  # something", not "I can right now". "head" restores the old behaviour.
  reach_source: evidence
  # 0.45 -> 0.10 (2026-08-02). Coverage counts (x, z) CELLS, so it pays for
  # DISTANCE TRAVELLED and nothing else — and the cheapest way to maximise
  # that is to walk in a straight line staring at the floor, which is exactly
  # what the agent converged on (walk 40%, pitch pinned at +90, nothing seen).
  # Kept small: territory is still worth something as an anti-parking term,
  # but it should not be the reason to explore.
  # 0.10 -> 0.30 (2026-08-08): "kept small" was calibrated when junk income
  # (dirt grinding, sky/ground novelty farms) competed with walking. With
  # all of those defunded the bot idled at 5 territory cells in 9h — the
  # walk pressure must now be the dominant IDLE drive, because trunks only
  # enter the fovea if the body moves. Still count-based (1/sqrt revisits),
  # still unfarmable by pacing one cell.
  #
  # 0.30 -> 0.07 (2026-08-12, user directive: "this should not be nearly as
  # heavily weighted as the actual learning process"). Measured at 65% of
  # the whole ledger — coverage pays for DISTANCE TRAVELLED and nothing
  # else, so at that share the agent was mostly being paid to wander.
  #
  # The 0.30 raise is now OBSOLETE ON ITS OWN TERMS. It existed because
  # something had to make the body move, and at the time nothing else did.
  # Two things have since changed: the vision magnet actually works
  # (magnet_seek went 4% -> 22% of income once the DEGENERATE gate stopped
  # excluding its targets), and the episodic position bug that made every
  # landmark None is fixed. Movement pressure now comes from STEERING
  # TOWARD A THING, which is the drive we actually want, rather than from
  # raw displacement, which is satisfied equally well by walking in a
  # straight line staring at the floor.
  #
  # NOT taken to zero, and deliberately not made semantic the way novelty
  # was: coverage is the only term that pays the body to move when NOTHING
  # is visible. In featureless terrain a symbol-gated coverage would pay 0,
  # the agent would park, and it would never reach the forest it cannot yet
  # see. This is the anti-parking floor — instrumentally necessary, so it
  # keeps a small honest weight rather than being redesigned away.
  coverage_weight: 0.07
  # ---- NOVELTY OF EXPERIENCE (2026-08-02) ------------------------------
  # What exploring SHOULD pay for: seeing things it has not seen. Same
  # count-based form as coverage (new ~1, revisits decay as 1/sqrt(n)) but
  # keyed on a hash of the agent's OWN world-model latent — so "a new thing"
  # is defined by what its perception can already tell apart, not by a rule.
  #
  # Why count-based rather than raw prediction error: ICM never saturates on
  # a rotation, so spinning farms it forever. Counting DOES saturate —
  # turning on the spot cycles the same handful of views and their payout
  # decays, while walking somewhere genuinely different keeps producing
  # unseen ones. That asymmetry is what makes it exploration rather than
  # fidgeting, and it is why this replaces most of the coverage weight.
  # 0.45 -> 0.15. The visual hash keys on raw latent geometry, so a change
  # of lighting or angle read as "new" even when nothing new was there. It is
  # kept as a small floor for things the symbolic layer cannot yet name,
  # while symbol_weight below carries the real exploration drive.
  # 0.15 -> 0.08 (2026-08-11, user directive after a decisive observation:
  # placed directly in front of a tree, the agent ignored it, dug ONE dirt
  # block and sat in the hole). This was the largest income line at 34% of
  # the ledger, and it is a count over a hash of the VISUAL LATENT — so a
  # freshly dug hole is a never-before-seen view and pays like a discovery.
  # Halving the weight is the blunt half of the fix; novelty_semantic below
  # is the real one.
  novelty_weight: 0.08
  # SEMANTIC NOVELTY (2026-08-11): scale the payout by how unfamiliar the
  # least-seen NAMEABLE thing in view is, so novelty tracks DISCOVERY rather
  # than unseen pixel arrangements. First village or first tree -> its
  # symbols are unseen -> factor ~1.0 -> novelty spikes exactly when
  # something genuinely new is found (and the symbol term and curiosity
  # spike with it). Dirt hole -> `dirt` named thousands of times -> ~0.02 ->
  # digging stops paying. Nothing declares which symbols matter; the
  # vocabulary is whatever the VLM taught and the world confirmed.
  novelty_semantic: true
  # What a view the symbolic layer CANNOT NAME is worth. Non-zero on purpose:
  # silence from the vocabulary may mean genuinely new territory, so unnamed
  # sights keep a small pull. Named-but-familiar views are allowed to decay
  # BELOW this floor — something you can name and have seen 4000 times is
  # less interesting than something you cannot name at all.
  novelty_unnamed_floor: 0.1
  novelty_bits: 14        # 16384 buckets: coarse enough that views recur
  # SKY DISCOUNT (2026-08-07): clouds drift even under frozen time, so a
  # sky-filled gaze mints fresh view buckets forever. MEASURED: view-novelty
  # was the largest itemised intrinsic term (+0.022/step) while the agent
  # dwelt at the -90 sky clamp (43,900 gaze hits) parked in a self-dug pit.
  # Scales view-novelty by (1 - fovea P(sky)), trust-gated, floored at 0.15
  # so a first sky glance still pays — the FARM dies, not the sight.
  novelty_sky_discount: true
  # FROZEN HASH ENCODER (2026-08-07): the live shared encoder keeps training,
  # so the bucket map drifts and old sights slowly re-key as "new" — novelty
  # that replenishes without the world changing. Hash through a snapshot
  # refreshed at this cadence instead. 0 = live (old behaviour).
  novelty_encoder_refresh: 50000
  # MASTERY HABITUATION (2026-08-08): the extrinsic break tier already
  # decays with familiarity, and it worked (dirt pays ~0 extrinsically) —
  # what kept the dirt farm alive was INTRINSIC income: every break makes a
  # big frame change, so ICM/novelty re-paid the 300th dirt like the 1st
  # (measured: 272+134 dirt across two runs, 0 logs). On a step where a
  # block breaks, the whole step intrinsic is scaled by the LEAST-familiar
  # type that broke: 1/(1+n/50), floored at 0.1. A novel block keeps full
  # surprise; sights and movement are never touched. Also extends the sky
  # view-novelty discount to fovea views dominated by mastered materials
  # (a fresh dirt hole is a genuinely new view — digging manufactures
  # novelty — so mastered-material views pay less). 0 = off.
  break_habituation_scale: 50
  # COMPRESSION-PROGRESS CURIOSITY (infra #13, 2026-08-09): pay for the world
  # model measurably IMPROVING on a fixed probe set — being drawn to what you
  # are LEARNING — while the raw ICM error term is damped to a seasoning
  # (it funded five farms: anything visually dramatic paid). progress_weight
  # is the per-step rate multiplier; eval every 512 steps under a
  # non-blocking WM lock.
  progress_weight: 0.4
  progress_eval_every: 512
  icm_base_scale: 0.5
  # ---- BATCHED CURIOSITY TRAINING (2026-08-23) -------------------------
  # MEASURED on the live module (LearningProgressCuriosity, CNN encoder,
  # 1.25M params): `train_step` issues 1519 aten ops per call and runs EVERY
  # env step at batch num_envs=2. Recorded GPU utilisation is 2% — the device
  # is idle and the per-step cost is ~2350 tiny kernel launches, not
  # arithmetic. Accumulating K steps and issuing ONE update on the
  # concatenated batch carries the SAME gradient information with K-fold
  # fewer launches: 1519 -> 380 ops/step at K=4, -> 95 at K=16.
  #
  # SAFE because LearningProgressCuriosity does not override train_step —
  # the LP bucket/history bookkeeping is all in compute_intrinsic_reward,
  # which stays per-step. ICM.train_step is a pure forward/backward/step.
  # This batches WHEN the optimizer steps; it never skips training (skipping
  # would slow novelty decay, which IS a reward-economy change).
  #
  # LEFT AT 1 (= exactly the old behaviour) because K>1 is not identical:
  # one Adam step on 4N samples is not four steps on N, and that cannot be
  # validated without a live run. Raise to 4-8 when there is a pod to watch,
  # and check that `Curiosity (mean/step)` is unchanged — if it moves, this
  # is the first thing to revert.
  # HELD AT 1 — and as of 2026-09-02 this is SETTLED BY MEASUREMENT, not by
  # caution. The pod run this comment used to ask for has now happened
  # (RTX A4000, /tmp/inv_icm.py + /tmp/inv_lp.py). Both numbers:
  #
  #   SPEED   train_every=8 is a big win: 15.28 -> 2.59 ms per env step,
  #           saving 12.7 ms/step, i.e. 83% of the ICM training cost. This
  #           part of the old analysis was right, and it is the largest
  #           single unpulled throughput lever in the loop.
  #   REWARD  and it fails this comment's OWN revert test. Over 400 steps on
  #           six recurring scenes, `Curiosity (mean/step)` measured
  #           0.00251 at K=1 vs 0.00131 at K=8 — the intrinsic drive is
  #           roughly HALVED (-47.9%). Not noise: the same collapse shows in
  #           both halves of the run (first 0.00396->0.00229, last
  #           0.00106->0.00032).
  #
  # WHY THE OLD REASONING ABOVE WAS WRONG, since it reads convincingly:
  # it argued this is "not a reward change" because the LP prototype bank and
  # bucket histories live in compute_intrinsic_reward, which runs every step
  # regardless. True, and irrelevant. Learning progress is not a function of
  # the error, it is the DROP in that error between two visits to the same
  # prototype — and the error only drops because train_step ran. Starving
  # train_step 8x starves the exact quantity LP integrates. The bookkeeping
  # does keep running every step; it just has 8x less progress to find.
  # Measured parameter divergence confirms the two are not equivalent
  # optimizers: after identical data, ||A-init||=1.87 vs ||B-init||=0.59,
  # cosine between the two update directions 0.586 — K=8 moves a third as
  # far, in a meaningfully different direction.
  #
  # SO: the 12.7 ms/step is real but it is NOT free, and paying for it in
  # curiosity is the worst possible currency in this project — see CLAUDE.md
  # §9, where every historical "win" was the agent finding a way to be paid
  # for doing nothing.
  #
  # AND THE OBVIOUS RESCUE DOES NOT WORK. The first version of this note
  # recommended "K=2 or K=4 with a compensating ICM lr raise". That was
  # written before measuring it, and measuring it (inv_lp2.py, same pod,
  # same session) killed it. Scaling lr by K does not restore the signal, it
  # overshoots wildly and NON-MONOTONICALLY:
  #     K=2 lr x1 -47.8%  | lr x2  +168.8%
  #     K=4 lr x1 -75.3%  | lr x4   +79.5%
  #     K=8 lr x1 -79.4%  | lr x8  +388.9%
  # A curiosity mean 5x the baseline is not a rescue. LP is an error DROP,
  # so an over-large step produces big drops that read as learning progress
  # while being optimizer thrash — a curiosity farm sourced from instability
  # rather than from the world getting more predictable. There is no K here
  # that is merely "a bit cheaper"; every K trades the drive for compute at
  # a rate this project cannot afford.
  #
  # CAVEAT ON THE MAGNITUDES, so nobody over-reads them: absolute LP means
  # vary run-to-run (the probe's action stream is not seeded, so K=1 measured
  # 0.00251 in one probe and 0.00139 in the next). The DIRECTION is robust —
  # every K at unchanged lr lost 48-79% of the drive across both probes, and
  # every lr-compensated K overshot. Treat the signs as established and the
  # exact percentages as indicative.
  train_every: 1
  # METABOLIC EFFORT (2026-08-09): attack/use/jump steps cost this much
  # (intrinsic channel, ledger source "effort"). Observed live: sustained
  # attack swings at CLOUDS — futile effort was exactly free, so nothing
  # extinguished it. A 60-tick barehanded chop costs ~0.09 against the +20
  # log; air-punching just bleeds. Humans stop punching air for this reason.
  effort_cost: 0.0015
  # MEMORY-PULL POTENTIAL (point 3) — DISABLED 2026-08-11 after adversarial
  # review found it NET HARMFUL as built. Kept at 0 (not deleted) because the
  # idea is right and the defects are specific and fixable:
  #
  #  1. IT DOES NOT POINT AT THE TARGET. `episodic.record("sighting", ...)`
  #     is stamped with the AGENT's own position (developmental_loop.py
  #     ~7400 -> stack.py ~319), so the "remembered goal site" is really
  #     "where I stood when a tree was in the fovea".
  #  2. THEREFORE THE BASELINE RE-ADOPTS AT phi~1.0, and the sighting
  #     throttle re-mints every 50 total steps = ~25 primary steps while a
  #     tree stays in view. Ng's identity needs an UNBROKEN baseline; broken
  #     every 25 steps it stops telescoping and the accrued charge is never
  #     refundable — a measured drain of ~0.005-0.009/step, 25-45% of the
  #     intrinsic budget, with the sign inverted.
  #  3. THE DRAIN IS MINIMISED BY STANDING STILL, STAYING AWAY, OR OPENING
  #     THE GUI (intrinsic is zeroed while gui_open, so the menu becomes a
  #     shelter from the bleed) — re-opening the 1491-step menu-dwell farm
  #     through the negative door.
  #  4. THE DEATH GUARD IS DEAD CODE ON THIS CONFIG: the remote-server death
  #     path returns early with {"env_restarted","respawned"} and no
  #     "events"/"world", so ("death","self") never reaches the guard; and
  #     the guard re-adopts at the PRE-respawn position anyway, so it would
  #     pay the teleport in full on the next step.
  #  5. kind "break" can never match: break records are keyed by BLOCK NAME
  #     ("oak_log"), the seek category is "tree_visible" — so "go back to
  #     where you chopped" was never actually implemented.
  #
  # TO RE-ENABLE, all of: record the TARGET's position (needs depth/raycast,
  # or accept observer-position semantics honestly), mint landmarks on
  # DISTANCE not a step throttle so re-adoption is rare, make the death
  # guard a latch that re-adopts on the first POST-respawn phi, key break
  # records to the seek category, and pay outside the gui_open zeroing.
  memory_pull_weight: 0.0
  # ---- SYMBOLIC NOVELTY (2026-08-02) -----------------------------------
  # Exploration should pay for seeing things the agent can NAME as new, not
  # for covering ground or for pixels changing:
  #     sees new thing -> a symbol becomes grounded -> reward
  #     sees more of an already-known symbol       -> less reward
  #
  # new_symbol_bonus fires ONCE, the first time a predicate crosses the
  # symbolizer's trust gate (enough VLM labels AND enough reliability against
  # real events) — acquiring a concept is a one-time event and can never be
  # farmed. symbol_weight is count-based over the SET of currently-true
  # predicates, decaying as 1/sqrt(n): staring at the ground yields one
  # unchanging signature and decays to nothing within seconds.
  #
  # Nothing here says which symbols matter. The vocabulary is whatever the
  # VLM taught and the world confirmed.
  symbol_weight: 0.40
  new_symbol_bonus: 2.00
  # ---- SEEING AND AIMING, ONE DRIVE (2026-08-02) -----------------------
  # symbol_weight above scores the SET of currently-true predicates. It is
  # POSITION-BLIND: a tree at the edge of frame and a tree dead-centre pay
  # exactly the same, and it decays as 1/sqrt(n) per distinct set — measured
  # live at +0.0082/step with 48 distinct scenes, i.e. effectively zero. So
  # NOTHING in the intrinsic channel rewarded turning toward a symbol, and
  # the agent sat with pitch clamped at +90 while the drive that was supposed
  # to pull it back paid the same either way.
  #
  # This is a POTENTIAL on centring the least-familiar thing the agent can
  # currently name: Phi = P(something centred) x 1/sqrt(1 + times seen).
  # Ng-telescoping, so a look-away/look-back cycle nets ~0 and fidgeting
  # earns nothing; what it adds is the per-step GRADIENT that "turn toward
  # it" never had. Nothing here says which symbols matter — the pull follows
  # whatever has been named least, and fades as it becomes familiar.
  # 0.5 matches seek_weight, the analogous orientation potential. Lower it if
  # the agent starts sweeping its view instead of engaging what it finds.
  symbol_center_weight: 0.5
  # ---- GAZE COVERAGE (2026-08-02) --------------------------------------
  # coverage_weight above counts the (x,z) CELLS the agent has stood in.
  # NOTHING counted where it LOOKS — and pitch is clamped to [-90,+90], so
  # once the agent drifted to +90 `lookDOWN` became a free no-op: the world
  # does not change, so it costs zero prediction error and zero curiosity,
  # while `lookUP` was the only action that moved. Measured over 100k+ steps:
  # pitch pinned at +90 with lookDOWN chosen ~2x more often than lookUP —
  # steady downward pressure into a wall that costs nothing to push against.
  # No shaping term could fix that, because the agent was not being paid to
  # look anywhere in particular; it simply was not being CHARGED for staring.
  #
  # Same count-based form as territory: a well-dwelt pitch bucket pays ~0, an
  # unvisited one pays ~the weight, decaying 1/sqrt(n). PITCH ONLY — yaw is
  # cyclic and spinning is this project's known cheap-novelty failure mode
  # (turnL 56% once ate a whole run). ~12 buckets, so it saturates fast: it
  # unsticks the clamp and then gets out of the way.
  #
  # 0.25 -> 0.06 (2026-08-12), applying the same rule as coverage/novelty:
  # this pays for WHERE THE CAMERA POINTS regardless of what is there, which
  # is activity, not learning. Cutting coverage and novelty while leaving
  # this at 0.25 would have made gaze the largest activity term by 3x and
  # simply moved the behaviour from walking to head-swivelling — the
  # one-farm-at-a-time whack-a-mole this project has now played five times.
  # Its stated job ("unsticks the clamp and then gets out of the way") is an
  # ANTI-FIXATION FLOOR and needs only enough weight to make a pinned pitch
  # uncomfortable; with ~12 buckets it saturates fast either way. What
  # should actually decide where to look is symbol_center_weight (centre the
  # least-familiar NAMED thing) and the magnet's seek potential.
  gaze_weight: 0.06
  gaze_bucket_deg: 15.0
  mode: learning_progress
  lp_history: 30
  lp_min_samples: 4
  lp_pixel_pool: 4
  # ---- STANDING STILL MUST PAY ZERO (2026-08-02) -----------------------
  # MEASURED with the new reward census, on a stationary agent:
  #     ICM/LP base  +0.1321/step  = 95% of the entire +0.1393 drive
  #     LP internals running_std=1.42e-05  raw_pred_err=2.64e-03
  # The LP pool's real spread had collapsed to 1.4e-05 — correct, the view IS
  # mastered — but the normalizer divides by max(std, 1e-3), so residual
  # jitter that squeaked past the RELATIVE significance gate was re-inflated
  # ~100x into +0.13/step. Doing nothing was the best-paid behaviour
  # available, and no shaping term (gaze, centring, coverage, all ~0.03
  # combined) could outbid it.
  # This requires an error drop to ALSO clear 5% of the bucket's outstanding
  # error before it counts as learning. Unit-free and bucket-local like the
  # existing gate. Real progress clears it easily; jitter on a mastered
  # bucket does not — so a static view pays exactly 0 and curiosity has to be
  # EARNED by finding something genuinely unpredicted.
  # Raise if the agent still parks; lower if it starts ignoring real learning.
  # ---- ACTION-CONDITIONAL CURIOSITY (2026-08-04) ------------------------
  # MEASURED: the policy converged deterministically on `noop` — 80% of all
  # actions, entropy 0.00 — while still collecting +0.2951/step. Doing
  # nothing paid nearly as well as acting, so a converged policy picked it.
  #
  # Curiosity is forward-model prediction ERROR, and on a live server the
  # world moves without the agent: day/night, mobs, other players, foliage.
  # The env requests frozen time, but that is a SERVER-side handler and a
  # foreign Paper server ignores it (confirmed — POV frames from one run show
  # both daylight and night). Ambient change therefore paid an income for
  # merely existing.
  #
  # The gate asks how much of each transition the agent's OWN action explains:
  #     gate = relu(err_null - err_a) / (err_null + eps)   in [0,1]
  # A no-op compares the forward model against ITSELF, so the gate is EXACTLY
  # 0 — doing nothing can no longer earn anything, by construction rather
  # than by tuning.
  #
  # SCOPE: this gates REWARD, never perception. The world model and ICM still
  # train on every frame, so learning to predict mobs, weather and other
  # players is untouched — that remains a goal, it just stops being PAID for.
  action_conditional: true
  null_action: 0        # macro 0 = noop in TREECHOP_MACROS
  lp_abs_frac: 0.05
  lp_proto_thresh: 0.025
  # ---- 512 -> 4096 (2026-09-02) ---------------------------------------
  # The ceiling on how many distinct SCENE PROTOTYPES learning progress can
  # hold, and the real capacity lever for the exploration drive — more so
  # than feature_dim, which was raised 256->512 the day before.
  #
  # WHY IT MATTERS. LP is the error DROP within a prototype's own 30-sample
  # history. When the LRU evicts a prototype it drops that history with it
  # (`_bucket_err.pop(old)` in learning_progress.py), so a scene the agent
  # had already mastered comes back reading as brand new — the signal that
  # decides what is interesting manufactures fake novelty out of its own
  # forgetting. 512 prototypes is very few for Minecraft: day/night, biomes,
  # varied terrain and self-dug holes all mint distinct pooled-pixel vectors,
  # so the set churns constantly.
  #
  # COST: ~786 KB of HOST RAM (4096 x 48 dims x 4 B). Not VRAM. The per-step
  # CPU cost is held flat by the prototype-matrix cache added alongside this
  # (see _proto_arr) — without that cache this change would have been an 8x
  # allocate-and-copy on the hot path every step, which is the opposite of
  # what it is for.
  # REVERT IF: `Phase timing: curiosity` rises materially, or the LP census
  # shows the drive getting noisier rather than steadier.
  lp_max_protos: 4096
  exploration_decay_rate: 0.02
  # (2/5) 256 -> 512. The highest value-per-byte change in the wave.
  # This is the space the ENTIRE exploration drive is computed in: learning
  # progress is literally error-reduction measured here, and the forward
  # model has to make "did MY ACTION cause this change" recoverable from it.
  # 256 dims to carry a 128px Minecraft scene is a narrow channel deciding
  # what the agent finds interesting — and every failure in this project's
  # history is the agent finding the wrong thing interesting (sky 96% of the
  # drive, a menu 77% of income, dirt 85% of 2231 breaks).
  # Costs ~5 -> ~20 MB. Invalidates nothing: the ICM is deliberately NOT in
  # the resume set (_resume_smoke asserts `curiosity` is refused BY NAME so a
  # config typo cannot resurrect a stale exploration drive).
  # REVERT IF: `Curiosity (mean/step)` shifts by more than noise without a
  # matching change in what the census says the drive is paid for.
  feature_dim: 512
  hidden_dim: 256
  forward_loss_weight: 0.8
  inverse_loss_weight: 0.2
  curiosity_reward_scale: 1.0
  curiosity_reward_clip: 5.0
  learning_rate: 0.0001
  novelty_window: 1000
knowledge_graph:
  neo4j_uri: bolt://localhost:7687
  neo4j_user: neo4j
  neo4j_password: password
  embedding_dim: 64
  embedding_model: TransE
  embedding_epochs: 100
  min_confidence: 0.7
  max_facts_per_step: 10
  use_in_memory_fallback: true
  force_in_memory: true
symbolic:
  enabled: true
  knowledge_source: goal
symbolic_grounding:
  enabled: true
  # llava:7b -> qwen2.5vl:7b (2026-08-06). MEASURED on real 128px SkyBot
  # frames: llava answered tree_visible=true on EVERY patch including
  # canopy-only sky crops, and hallucinated freely on single-material patches
  # ("a dog", "YOUR INVESTMENT"). The saturated tree_visible that froze the
  # magnet's every gradient was the TEACHER's blindness, not the head's.
  # qwen2.5vl:7b scored 8/8 on the same battery at the same warm latency
  # (~1.17s vs ~1.1s). Pulled on the pod 2026-08-06 (4.7GB, fits beside the
  # rest in 16GB VRAM).
  # ---- 4-BIT (2026-09-01) ---------------------------------------------
  # The VLM is the largest single GPU tenant and is demonstrably on the
  # critical path: fovea_interval 12 cost 28% of the step rate, which is why
  # it sits at 30. q4_K_M cuts the weights ~3.5x (~15 GB -> ~4.5 GB), which
  # is what lets more than one agent share a node — the point of the cluster
  # move, and the VLM is what caps it.
  #
  # THIS IS A SENSOR CHANGE and this project has been burned by exactly one
  # before: llava WAS the broken sensor, and its tree_visible drifted to
  # reliability 1.0 unopposed because the verifier is structurally blind to
  # false positives. Every guard that eventually caught it is still live and
  # still load-bearing here — reliability_floor, min_labels, the
  # degenerate-signal monitor, and the negative-evidence exam
  # (neg_evidence_ticks). Watch per-predicate agreement over the first few
  # hundred labels; if it falls, put this back to `qwen2.5vl:7b` BEFORE
  # suspecting anything else in this wave.
  #
  # PROVISIONING — Ollama quantizes at import, not at run time:
  #   printf 'FROM qwen2.5vl:7b\n' > /tmp/Modelfile
  #   ollama create qwen2.5vl:7b-q4 -f /tmp/Modelfile -q q4_K_M
  # A startup probe logs the RESOLVED model and warns loudly if this tag is
  # missing, rather than silently labelling with a different sensor.
  #
  # ---- 7b-q4 -> 3b-q4 (2026-09-02) -------------------------------------
  # Same VRAM argument one size down: ~5.5 GB -> ~2.2 GB COMPUTED, not
  # measured (no CUDA box in hand when this was written). This is a SECOND
  # sensor change stacked on the first, so the same watch-list applies and
  # matters more, not less: reliability_floor, min_labels, the
  # degenerate-signal monitor, negative-evidence, and now also the boot-time
  # smoke probe (probe_ollama_model, llm_module.py) that actually exercises
  # the model rather than just checking the tag is present. Watch
  # per-predicate agreement over the first few hundred labels; if it falls,
  # revert the line below BEFORE suspecting anything else.
  # Prompt is UNCHANGED on purpose — still the flat boolean list; a smaller
  # model answering the same question is the whole experiment. Provision:
  #   printf 'FROM qwen2.5vl:3b\n' > /tmp/Modelfile
  #   ollama create qwen2.5vl:3b-q4 -f /tmp/Modelfile -q q4_K_M
  # REVERT TARGET, one line away:
  # model: qwen2.5vl:7b
  #
  # NO `-q4` SUFFIX — THE REGISTRY TAG IS ALREADY QUANTIZED (fix 2026-09-02).
  # This said `qwen2.5vl:3b-q4`, on the assumption that ollama ships an F16
  # base you quantize locally (the recipe in the comment above). Measured on
  # the pod, that is wrong twice over:
  #   * there is no `3b-q4` tag to pull — manifest 404;
  #   * building one fails anyway:
  #       Error: quantization is only supported for F16, BF16 and F32 models
  #     because `qwen2.5vl:3b` REPORTS quantization Q4_K_M already
  #     (3.8B params, 3.2 GB). It is the q4 build; there is nothing to convert.
  # So the plain tag IS the small quantized VLM this was reaching for, and
  # provisioning now completes instead of failing at the last stage.
  model: qwen2.5vl:3b
  # Downscale the WHOLE-FRAME request to this longest side before the PNG
  # encode. 336 is qwen2.5vl's ViT tile size, so the model sees the tiling it
  # would have produced anyway and stops paying to re-tile pixels it was
  # going to discard. The render stays at 384 and the FOVEA crop is exempt,
  # so the high-detail channel keeps every pixel it has today. 0 = off.
  input_max_side: 336
  # FOVEA channel (2026-08-06): alternate labelling of the CENTER CROP of the
  # view ("what is under my crosshair?") training a separate small head. Even
  # a good VLM cannot judge "is X under the crosshair" from a full frame — but
  # presence-in-a-patch it answers reliably, and the crop converts the spatial
  # question into a presence question (that is what a fovea is). Gives the
  # magnet the per-step, pose-dependent centring gradient every potential was
  # missing. Full-frame cadence halves (each channel labels every ~2x
  # interval); the anneal absorbs it.
  # Re-run the boot smoke probe (llm_module.probe_ollama_model) every this
  # many CONSECUTIVE failed generate calls, so a mid-run Ollama crash or
  # restart is reported instead of silently producing zero labels at DEBUG
  # for the rest of a multi-day run. 0 = never re-probe.
  reprobe_after_failures: 5
  fovea: true
  fovea_frac: 0.4
  # FOVEA CADENCE (2026-08-08): fixed, NOT annealed. The anneal is driven by
  # full-frame agreement, which says nothing about the fovea's much harder
  # trunk-under-gaze discrimination — inherited annealing had the fovea down
  # to one label per ~908 steps (284 labels in 11h). One qwen call is ~1.2s;
  # at 60 the two channels together stay far under the worker's capacity.
  #
  # 60 -> 12 (2026-08-17), from MEASUREMENT rather than taste. On the live
  # pod: one qwen2.5vl call is 1.55s median (both channels, shared GPU) and
  # the run steps at 3.41/s, so a query occupies 5.3 steps of the SINGLE
  # labelling worker. At fovea 60 + full 600 the worker was ~10% busy and
  # the GPU 1-6% — nine tenths of the teacher was idle. At 12 the fovea
  # alone asks 0.284 q/s; with the full channel below it the worker lands
  # near 48% duty, which keeps a real margin for latency spikes (the
  # scheduler DEFERS rather than drops, so the failure mode of oversubscribing
  # is two channels starving each other, not a crash).
  # Why the fovea gets the headroom: its agreement is 0.82 against the full
  # channel's 0.94, so its labels still carry information, and it is the
  # head the magnet reads EVERY step to decide where to look.
  #
  # 12 -> 30 (2026-08-17, MEASURED not predicted). 12 was derived from the
  # labelling worker's duty cycle, which was the wrong ceiling: the binding
  # resource is the GPU the VLM SHARES with the trainer. At 12 the step rate
  # fell 3.41 -> 2.44/s (-28%) and the GPU went 1-6% -> 91% — each 1.55s
  # inference holds the device while the trainer's own per-step forwards
  # queue behind it. Buying 5x labels with 28% of all experience is a bad
  # trade; 30 keeps ~2x the labels for a fraction of the cost. The real
  # ceiling on VLM cadence is inference OCCUPANCY (see --image-min-tokens
  # 1024 on the ollama server), not worker duty.
  fovea_interval: 30
  # NEGATIVE EVIDENCE (2026-08-07): this many held-attack ticks with NO
  # completed break docks the claimed affordance predicates
  # (breakable_in_reach / object_centered / object_adjacent) — the verifier
  # was structurally blind to false positives before this (a stuck-true
  # predicate drifted to reliability 1.0 unopposed; llava's tree_visible
  # did exactly that for weeks). 90 ticks > the ~60 a barehanded log needs,
  # so a genuine slow break can never be scored as a miss. 0 = off.
  neg_evidence_ticks: 90
  interval: 60
  # 600 -> 120 (2026-08-17). This is the ANNEALED ceiling, not a fixed rate:
  # the full channel widens 1.5x per high-agreement segment and had reached
  # the old 600 cap, i.e. one grounding label per ~3 minutes of wall clock.
  # The anneal's premise is that a head agreeing 0.94 with its teacher does
  # not need asking — true, but it was written when the worker's capacity
  # was the scarce thing, and it is not: at 600 the teacher sat 90% idle.
  # Capping at 120 keeps the anneal's shape (60 -> 90 -> 120) while making
  # the system 5x more responsive when the scene changes and agreement
  # falls — which is exactly when a fresh label is worth most.
  max_interval: 120
  anneal_agreement: 0.9
  hidden_dim: 256
  lr: 0.001
  # ---- QUALITY OVER SPEED: THE SYMBOLIC LEARNER (2026-09-01) ----------
  # ORDER MATTERS HERE. Before this, every VLM label produced ONE gradient
  # step at batch size 1 and was then discarded. At interval 60 and ~3 agent
  # steps/s that is a label every ~20 s — roughly 4-8k labels in a 24-hour
  # run, to fit 29 binary predicates from a 4352-d latent. Adding capacity
  # under that regime overfits; adding labels is what pays. So: replay
  # first, then width, then the ensemble.
  #
  # 1. REPLAY. Keep every label and train minibatches over all of them. A
  #    latent is 4352 float32 = 17.4 KB, so 50k labels is ~870 MB of HOST
  #    RAM (not VRAM — batches move to the device on sample). This is the
  #    single highest-value change in the block and it is nearly free.
  replay_capacity: 50000
  replay_batch: 64
  # Gradient steps per member per new label. 8 turns ~6k labels/day into
  # ~48k updates/day over the whole history instead of 6k over singletons.
  # Raise for more quality per label; it costs GPU time, not memory.
  replay_steps: 8
  # 2. CAPACITY, now that labels are reused. 256 hidden / 3 layers was sized
  #    when the head read 512-d encoder features; it now reads the 4352-d
  #    RSSM latent, a 17:1 squeeze. 512/4 costs ~15 MB with Adam.
  head_hidden: 512
  head_layers: 4
  # 3. ENSEMBLE. K independently initialised heads, each trained on its OWN
  #    replay minibatches so they genuinely diverge. Spread across members is
  #    epistemic uncertainty — the axis a single sigmoid does not have, and
  #    the one that separates "confident" from "collapsed to a constant".
  #    That distinction is exactly what was missing when llava's
  #    tree_visible rode a stuck-true output to reliability 1.0 unopposed.
  #    1 = off and byte-identical.
  head_members: 5
  # Do not assert a fact the ensemble does not agree on. 0.15 std across 5
  # members is a loose gate (a genuinely known predicate sits near 0.02);
  # tighten once `symbol disagreement` in the segment log has a baseline.
  max_disagreement: 0.15
  fact_threshold: 0.7
  min_labels: 5
  reliability_floor: 0.35
skill_bank:
  # ARCH-VERSIONED (2026-09-01). Skills store the policy arch they were
  # minted under and are refused on mismatch, so an `rssm` policy cannot load
  # a `wm` skill. Pointing at a new directory makes that a clean start
  # instead of a slot-by-slot refusal storm at every paging event. The old
  # bank stays on disk untouched — it is the agent's accumulated
  # developmental memory and is never wiped (CLAUDE.md section 3).
  storage_dir: ./skill_bank_mc_rssm
  mastery_threshold: 0.8
  mastery_window: 50
  min_episodes_before_save: 20
  # SKILL RETRIEVAL (given a python reader 2026-08-01 — both keys shipped in
  # every config from the start and NOTHING read them; the warm-start path
  # hardcoded 3 / 0.7 instead). max_skills_loaded = how many prior skills a
  # new goal ranks as warm-start candidates. similarity_threshold = the floor
  # a candidate must clear to seed the live policy, on the NORMALIZED [0,1]
  # relevance scale ((cos+1)/2, then scaled by competence) — 0.5 is
  # "orthogonal", 1.0 is "identical context". NOTE: 0.5 is LOOSER than the
  # 0.7 that was hardcoded here; raise it to 0.7 to keep the old bar.
  max_skills_loaded: 5
  similarity_threshold: 0.5
policy:
  # ---- ONE VENTRAL STREAM (2026-08-01) ----------------------------------
  # arch: wm  =>  the policy's perception IS world_model.encoder, shared by
  # reference and read detached. Until now this run was arch:flat (the
  # default — there was no `arch` key at all), which gave the agent TWO
  # independent visual systems:
  #   * the world model's CNN encoder, trained by reconstruction + KL on
  #     every frame of all 4 streams — a dense, constant learning signal;
  #   * the policy's own (256, 49250) pixel layer, trained only by PPO
  #     gradients. MEASURED on a stored skill: 86% of its weights were still
  #     inside their initialization bound and the knowledge columns sat at
  #     1.009x init. The policy was acting on a near-random projection of the
  #     screen while a trained representation of the same pixels sat unused.
  # The dream actor already consumed world-model latents; the waking policy
  # now does too. Side effects, all wanted: minted skills drop from ~116 MB
  # to a few MB (no more three near-duplicate 49250-wide layers), and the
  # conditioner gates 256 features instead of 49250 raw pixels.
  # PPO CANNOT train the shared encoder (excluded from the optimizer AND
  # detached in _encode) — perception is shaped by prediction, never reward.
  # enc_dim is not set here on purpose: for arch:wm it is DERIVED from
  # world_model.encoder_hidden, so the two can never drift apart.
  # ---- THE POLICY SEES THE WORLD MODEL'S STATE (2026-09-01) ----------
  # wm -> rssm. Under `wm` the actor read DETACHED ENCODER FEATURES OF THE
  # CURRENT FRAME: the 2048-d deterministic RSSM state h — the entire reason
  # for having an RSSM — never reached it. The policy was memoryless on a
  # task whose defining difficulty is sustaining one action through ~60 ticks
  # of no visible feedback, and a frame mid-swing looks almost exactly like a
  # frame at rest (the crack overlay is a few pixels at 128px). h does not.
  #
  # Input width becomes the world model's LATENT (deterministic +
  # stochastic*classes = 2048 + 2304 = 4352), derived from the world_model
  # block so the two cannot be set inconsistently. Still DETACHED: prediction
  # shapes perception, reward never does.
  #
  # SKILL BANK COMPATIBILITY — the sharp edge. get_state_dict stamps `arch`
  # and load_state_dict refuses a mismatch, so every skill minted under `wm`
  # will be refused by this policy. That degrades rather than crashes
  # (refresh_slots catches it per skill), but the old bank is effectively
  # orphaned, so skill_bank.storage_dir is versioned below. The old directory
  # is NEVER wiped — see CLAUDE.md section 3.
  arch: rssm
  # ---- POLICY TRUNK WIDTH (2026-09-01) ---------------------------------
  # Newly exposed; it was hardcoded at 256 in the loop. 256 was sized for
  # arch: wm, where the actor read 512-d encoder features — a 2:1 squeeze.
  # Under arch: rssm the input is 4352 (latent) + 17 (proprio) + 98
  # (knowledge) = 4467, so one Linear now compresses 17:1 before the policy
  # sees anything. That may well be too narrow to exploit the recurrent state
  # the rssm change exists to deliver.
  # (3/5) RAISED TO 512 (capacity wave, 2026-09-01). ~35 MB with Adam —
  # less than the dead glue gate this session removed, so it comes out of
  # headroom rather than out of the card.
  # INVALIDATES EVERY STORED SKILL: actor/critic shapes move and
  # load_state_dict's arch guard refuses them. skill_bank_mc_rssm is empty
  # today, so this is free NOW and must never be done once skills exist.
  # STILL HAS NO MEASUREMENT BEHIND IT — settle 256 vs 512 on a Crafter
  # ablation; this ships on the argument that a 17:1 squeeze in one Linear
  # is a worse default than a 9:1 one, not on evidence.
  # REVERT IF: entropy collapses faster than at 256 (`Policy: entropy`,
  # `max_prob`) — a wider trunk can overfit a small rollout.
  hidden_dim: 512
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  # ---- REUSE THE ENCODER FORWARD ACROSS THE STEP BOUNDARY (2026-08-23) --
  # arch:wm means this policy encodes through world_model.encoder — the SAME
  # module the loop already ran on this very frame one step earlier, as
  # `encoded_next` for the RSSM. The loop now hands that result forward
  # instead of recomputing it (~5% of the ~2350 aten ops per env step).
  #
  # It is EXPLICIT DATAFLOW, not a cache, and validity is decided by an
  # IDENTITY test: an env that kept running had `obs_list[e] =
  # next_obs_list[e]` assigned, so the two are the same object; an env that
  # reset holds a fresh array from reset(). Inferring that from the branch
  # conditions instead (`dones[e] or _crashed`, plus a timeout path that
  # carries the obs anyway) is how this would one day serve the policy a
  # frame from the world that existed before a rebuild.
  #
  # verify_encoder_feats recomputes and compares on EVERY use, raising if the
  # difference exceeds one optimizer step of encoder drift. It costs the
  # saving while on — deliberately: the first live run proves the carry is
  # correct, then set it false to collect the speedup. `Feat drift (max)`
  # prints per segment; ~0 means no async WM update landed between the two.
  # ---- BOTH FORCED FALSE BY arch: rssm (2026-09-01) -------------------
  # The carry optimisation and its self-check are wm-only. Under arch: rssm
  # the policy's input is the world model's LATENT, produced fresh from each
  # env's own RSSM row every step and never carried across a step boundary —
  # so there is nothing to carry and nothing to recompute (`_encode` refuses
  # by design, because h is recurrent and is not a function of one frame).
  # The loop already overrides these at construction and logs it; leaving
  # them `true` here left the config ASSERTING A LIVE SELF-CHECK THAT IS NOT
  # RUNNING, and `Feat drift (max)` would never print. Set them back to true
  # only alongside arch: wm.
  reuse_encoder_feats: false
  verify_encoder_feats: false
  # 0.99 -> 0.995 (2026-09-01). ~100 -> ~200 decision horizon. Finding a
  # tree, aiming at the trunk and holding through the break is a
  # multi-hundred-step chain, so at 0.99 the approach that made a break
  # possible received almost no credit for it. This is the cheapest change in
  # the wave and it targets the one behaviour the scoreboard has never shown.
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  extrinsic_reward_weight: 0.3
  intrinsic_reward_weight: 0.7
  reward_decay_rate: 5.0e-06
  # ---- CURIOSITY MUST BE ABLE TO REACH ZERO (2026-08-02) ---------------
  # This was never passed through, so it sat at its 0.1 default: the anneal
  # drove curiosity down to 0.1 and then stopped, leaving a permanent drive
  # to fidget even on a world the agent had exhausted — which is why it ends
  # up sitting and staring. 0.0 lets it genuinely fall to nothing, so an
  # agent with nothing left to learn is not paid to keep twitching, and the
  # task signal is all that remains.
  min_intrinsic: 0.0
  # ---- SIGNAL-DRIVEN ANNEAL, ON (2026-09-01) --------------------------
  # The curiosity->task mix has been drifting on a WALL CLOCK
  # (reward_decay_rate 5e-6) while the return-ratio damper did the real work
  # invisibly. With this on, the anneal tracks how reliably extrinsic reward
  # is actually being earned: sparse task signal -> curiosity retained;
  # findable task signal -> the system behaves like plain PPO instead of
  # paying a permanent curiosity tax.
  adaptive_gating: true
  adaptive_gating_rate: 5.0e-5
  # WHAT COUNTS AS "SOLVED", and this number is load-bearing. The mixer's
  # default is 0.1, and on this env ANY dirt break clears 0.1 — enabling the
  # anneal against that would read the ground-clearing behaviour the whole
  # reward economy exists to defund as success, and drain the exploration
  # drive while the agent had still never felled a log. 15.0 is log-sized
  # (a felled log pays log_break_reward 20 plus 0.5/tick of effort), so the
  # anneal can only start once the ONE event the scoreboard is about has
  # actually happened.
  solve_threshold: 15.0
  solve_ema_beta: 0.05
  # ---- THE TASK SIGNAL MUST BE VISIBLE (2026-08-02) --------------------
  # RewardMixer has had a return-normalizing guard since 2026-07-27 and it
  # was never wired: `return_ratio_cap` defaulted to 0.0, which DISABLES it,
  # and no config set it. So the fix for the measured failure existed in
  # source and ran in no run.
  #
  # The failure it fixes: the WEIGHTS say 0.7 intrinsic / 0.3 extrinsic, but
  # the RETURNS were 1922:1 curiosity (weighted intrinsic return 9179.4 vs
  # weighted extrinsic 4.78). Curiosity fires EVERY step at ~0.2; the task
  # fires when a block breaks. Shifting a weight cannot matter at that ratio
  # — PPO optimises curiosity and never sees the task, which is exactly the
  # "reward does not work" symptom.
  #
  # 3.0 keeps curiosity DOMINANT (it is the exploration engine) while leaving
  # the task signal an order of magnitude above invisible. The guard only
  # ever SHRINKS intrinsic, never amplifies it, and it is inert until some
  # extrinsic reward has actually been seen — so a task-free warmup is
  # unaffected. min_intrinsic_scale bounds the correction so a very sparse
  # task can damp curiosity but never delete it.
  return_ratio_cap: 3.0
  return_ema_alpha: 1.0e-4    # slow: the extrinsic stream is sparse and a
                              # fast EMA would collapse between spikes
  min_intrinsic_scale: 0.1    # floor on the damping (never zero curiosity)
  # ---- REAL MINIBATCHING (2026-08-02) ----------------------------------
  # `batch_size: 64` above has NEVER been read: the PPO update ran n_epochs
  # FULL-batch passes, so a 1024-step rollout bought 10 gradient steps where
  # standard PPO takes 10 x 16 = 160. Learning was ~16x slower than this file
  # claimed. Deliberately a SEPARATE key: batch_size is set in all eleven
  # configs, and adopting it would silently change MiniGrid/Crafter/Craftax
  # learning dynamics and invalidate their recorded results.
  # ---- REVERTED TO 0 (2026-08-02, same day it was enabled) -------------
  # Enabling this took PPO from 10 to ~160 gradient steps per 1024-step
  # rollout. Within three segments the (newly restored) entropy readout went
  # 0.06 -> 0.00 -> 0.00 nats against a 2.48 maximum: the policy collapsed to
  # a deterministic one, reward fell 0.45 -> 0.22 -> 0.15, and blocks-broken
  # froze. 16x more sharpening per segment at entropy_coef 0.01 is the
  # obvious cause, and the pre-change action histogram was visibly flatter
  # (attack 30/use 25/atk+walk 20/jump 18 vs turnL 47 + entropy 0).
  #
  # NOT PROVEN — entropy was not recorded before the diagnostic was restored
  # in the same wave, so this cannot be attributed with certainty. Setting it
  # back to 0 is BOTH the rollback and the single-variable experiment: if
  # entropy recovers, minibatching caused it.
  #
  # To re-enable, raise policy.entropy_coef FIRST (0.01 -> ~0.03-0.05) and
  # watch "Policy: entropy" for three segments before trusting it. The
  # underlying finding stands — policy.batch_size has never been read and
  # 10 full-batch passes is very little learning per rollout.
  #
  # 0 -> 64 (2026-09-01), and this time with the entropy guard the previous
  # attempt was missing. THE UNDERLYING FINDING, now quantified: with this
  # at 0, `train_step` takes ONE full-batch gradient step per epoch, and the
  # epoch count is itself capped at rows//32. Under SMDP options (mean tau
  # ~40) a 1024-env-step rollout holds ~25 rows -> 25//32 = 0 -> ONE gradient
  # step per segment. At ~3.4 steps/s that is one policy update every five
  # minutes. Textbook PPO at these settings (1024 steps, batch 64, 10 epochs)
  # takes 160. That is the learning rate, not a tuning detail.
  #
  # WHY IT IS SAFE NOW AND WAS NOT BEFORE. The 2026-08-05 rollback note above
  # is honest that entropy fell WITH minibatching and the cause could not be
  # isolated. Three things have changed:
  #   * entropy_coef is already at 0.03 (that note's own precondition), and
  #   * logit_range 5.0 hard-bounds the logit spread, so no update can drive
  #     the softmax to one-hot however many steps it takes, and
  #   * target_kl is on (see below) and now stops the ACTOR per MINIBATCH.
  # If entropy still collapses, this is the single variable to revert, and
  # `Policy: entropy` / `max_prob` are the numbers that say so.
  #
  # 32 rather than 64: rows are the scarce resource here (see
  # min_rows_per_update), and 64 would give only 2 chunks per epoch at the
  # row floor. At 32 the floor yields 4 distinct slices per epoch, which is
  # what makes this minibatching rather than full-batch with extra steps.
  minibatch_size: 32
  # ---- THE UPDATE MUST HAVE ROWS, NOT JUST STEPS (2026-09-01) ----------
  # `n_steps` counts ENV steps, which is right for scheduling and wrong for
  # sizing: under SMDP options one stored row spans tau env steps, so at
  # mean tau ~40 a 1024-env-step rollout is ~25 rows. 25 rows is smaller
  # than any minibatch, so the update silently degenerates back to a single
  # full-batch gradient step — the exact failure minibatch_size was set to
  # fix, reappearing through the trigger instead of the loop.
  #
  # Both conditions now hold before an update: on schedule (n_steps) AND
  # enough rows to learn from. Rows are scarce precisely when options are
  # used, which is the regime the project is trying to reach, so this is the
  # difference between options being affordable and options starving the
  # policy that has to decide whether to use them.
  min_rows_per_update: 128
  # ESCAPE PATH, and it is required: without it a run where every decision
  # is a maximal option would accumulate rows so slowly that the update
  # never fires — a row floor is a guard, and an unsatisfiable guard is the
  # latch this codebase has now hit nine times. At 8192 env steps the update
  # happens regardless of row count. Memory is safe by construction: this
  # ceiling is only reachable while rows are FEW, and rows are what cost
  # memory (a row holds a full 49k-float frame).
  max_env_steps_per_update: 8192
  # ---- AND A ROW CEILING (2026-09-01) ---------------------------------
  # The floor above can hold a rollout open across several segments, and rows
  # now arrive from every stream, while the trigger is only evaluated at
  # segment end. Each row holds a full 128px frame (~196 KB), so two streams
  # of all-primitive decisions reach ~2048 rows (~400 MB) in one segment —
  # plus a second full copy at np.stack time inside the update. Fine at 2
  # clients, not fine at 4, and 4 is a fleet size this repo has run.
  # 2048 rows is ~400 MB resident and still a large PPO batch by any standard.
  max_rows_per_update: 2048
  # Exposed (2026-08-02) — previously pinned at the constructor default with
  # no way to reach it, on a run whose failure mode is the action
  # distribution collapsing onto three macros.
  # 0.01 -> 0.03 (2026-08-02). MEASURED, once the entropy readout was finally
  # recorded in the lifelong path: entropy falls monotonically across
  # segments even with minibatching OFF —
  #     93% -> 37% -> 27% -> 13% of the 2.48-nat maximum.
  # Below ~50% the run stops sampling its own alternatives, and every shaping
  # term added this session then becomes unreachable in principle: the gaze
  # gradient now pays ~4x MORE for looking up than for staying pinned
  # (0.017 vs 0.0045/step) and the agent still does not take it, because at
  # 13% entropy it is effectively executing a fixed policy.
  # This is the knob that governs how hard PPO is allowed to sharpen. 0.03 is
  # a deliberate, modest step — NOT derived — chosen to slow the collapse
  # without pinning the policy at permanent randomness. Watch
  # "Policy: entropy" for three segments: it should settle ABOVE 50% rather
  # than continuing to fall. Raise toward 0.05 if it keeps sliding; drop back
  # if the agent stops committing to anything.
  entropy_coef: 0.03
  # ---- THE MISSING TRUST REGION (2026-08-05) ---------------------------
  # PPO's clip_range bounds the SURROGATE OBJECTIVE, not how far the policy
  # actually moves. Running n_epochs passes over one batch lets it walk
  # arbitrarily far from the policy that collected the data. This codebase
  # had NO KL check at all — no target_kl, no approx_kl, no early break —
  # which every reference PPO (SB3, CleanRL, Spinning Up) has.
  #
  # MEASURED on every restart: entropy 90% -> 0.00 within one or two
  # segments, max_prob EXACTLY 1.000 (one-hot softmax), obs_spread collapsing
  # to 0.026 as the frozen policy stopped generating varied experience.
  # Independent of entropy_coef (0.01 AND 0.03) and of minibatching (on AND
  # off) — because neither of those bounds policy movement. Two rounds of
  # tuning them failed for that reason.
  #
  # 0.02 is the standard value. Epochs now stop as soon as the update has
  # spent its movement budget, so n_epochs: 10 becomes a CEILING rather than
  # a mandate. Watch "PPO trust region" — it should stop early most segments.
  # TESTED AND LEFT OFF (2026-08-05). Adding it was the obvious "standard
  # PPO" fix and it MADE THINGS WORSE in the only test where movement was
  # large enough to trip it: over 6 updates on a deliberately skewed reward,
  #     target_kl OFF : entropy 99% -> 56%,  max_prob 0.22 -> 0.76
  #     target_kl 0.02: entropy 99% -> 18%,  max_prob 0.30 -> 0.97
  # The check runs AFTER an epoch completes, so it always overshoots the
  # budget rather than enforcing it, and the shortened epoch count leaves the
  # critic less well fit — larger advantage errors, bigger policy moves.
  # The machinery and the approx_kl readout stay (both are useful); only the
  # enable is withdrawn. Do not re-enable without evidence on the live run.
  #
  # RE-ENABLED 2026-09-01, and the note above is the reason it can be. That
  # rollback did not measure "KL early-stopping is bad"; it measured the
  # early stop AS IMPLEMENTED IN THE FULL-BATCH PATH, and its own diagnosis
  # names both mechanisms:
  #   (1) "The check runs AFTER an epoch completes, so it always overshoots
  #       the budget rather than enforcing it."
  #       With minibatch_size 0 an epoch IS one gradient step over the whole
  #       rollout, so the first check could only ever happen after the move
  #       had already been made — the budget was unenforceable by
  #       construction. The check has always been inside the minibatch loop
  #       (actor_critic.py), so at minibatch_size 64 it now fires after ~64
  #       rows instead of after ~1024, which is the granularity it was
  #       written for.
  #   (2) "the shortened epoch count leaves the critic less well fit —
  #       larger advantage errors, bigger policy moves."
  #       Fixed directly rather than argued away: the stop now FREEZES THE
  #       ACTOR and lets the critic keep training to the end of the budget
  #       (see `_actor_frozen` in train_step). The critic is no longer
  #       collateral damage of an actor-side guard, so this specific failure
  #       cannot recur.
  # 0.05, not 0.02: 0.02 was measured to bite too early even accounting for
  # the overshoot. `kl_stopped` / `kl_stop_frac` in the segment line say how
  # often it actually fires — if that is ~100%, it is too tight; if it is
  # ~0%, it is inert and the entropy guard is really logit_range.
  # ESCAPE PATH (required of every guard here): this one re-opens by itself
  # every update — it is recomputed from scratch per rollout and can never
  # latch, unlike a frozen threshold.
  target_kl: 0.05
  # ---- HARD EXPLORATION FLOOR (2026-08-05) -----------------------------
  # Bounds the SPREAD of the action logits (rescaled, so their ORDER and
  # therefore learning are untouched), capping the best/worst probability
  # ratio at e^5. The policy may become confident; it cannot become certain.
  #
  # WHY A HARD BOUND AND NOT entropy_coef. Measured on the softmax itself:
  #     max_prob 0.174 -> |d(entropy)/d(logits)| 2.88e-01
  #     max_prob 0.920 -> 4.41e-01
  #     max_prob 1.000 -> 9.54e-07      <- five orders of magnitude gone
  # The entropy bonus can PREVENT saturation but can never REVERSE it, and
  # every entropy_coef tried this session (0.01, 0.03) was applied to a policy
  # already sitting at max_prob = 1.000 where it has no leverage whatsoever.
  # That single fact explains why all of those attempts failed.
  #
  # VERIFIED over 30 updates on a deliberately skewed reward:
  #     OFF : max_prob 0.987, entropy  5.0% of max, picked-best 98%
  #     5.0 : max_prob 0.953, entropy 14.5% of max, picked-best 96%
  # ~3x the exploration retained for 2 points of task performance.
  # Raise if the agent still freezes; lower if it will not commit to anything.
  logit_range: 5.0
  value_coef: 0.5
llm:
  enabled: false
  # WHERE THE VLM SERVER LIVES (2026-09-01). null = the shipped resolution
  # (OLLAMA_HOST env, else http://127.0.0.1:11434). Set to a URL to move the
  # labeller off the training node — it is the largest single GPU tenant and
  # is measurably on the critical path (fovea_interval 12 cost 28% of the
  # step rate), so on a cluster it is the first thing worth relocating. The
  # symbolizer is already async, so a remote endpoint costs latency, not
  # throughput.
  endpoint: null
  model: llama3.1:8b
  env_description: 'Minecraft: find trees and chop wood.'
  # Curiosity-ranked vision magnet (redesigned July 2026): no second VLM. It
  # reads the grounding head's per-object presence probs + the primary stream's
  # own learning progress (intrinsic[0]), keeps a contrastive per-category
  # LP-EMA, and steers toward whatever it is most CURIOUS about — fading as
  # curiosity quenches and re-arming on a novel object. Condition-based, not a
  # clock, so it is correct in a never-ending lifelong stream.
  vision:
    enabled: true
    # 0.6 -> 1.0 (2026-08-09, user request): magnet income read tiny in the
    # ledger. Partly by DESIGN (potentials telescope to ~0 net), but the
    # transient guidance magnitudes were genuinely small against the other
    # drives; the whole envelope is raised. Safe against farming by
    # construction (still potentials); ledger + farm detector police it.
    weight: 1.0                  # peak shaping weight at full curiosity
    min_weight: 0.0
    # 0.20 -> 0.35 (ported from lifelong 2026-08-01). With the raw geometry
    # terms zeroed above, the floor pull no longer scales a farmable income —
    # it only scales the telescoping potentials, so it can be raised to
    # actually bootstrap first contact without paying an agent to park.
    cold_start_weight: 0.5   # 0.35 -> 0.5 (2026-08-09, same raise)
    # CONSEQUENCE-WEIGHTED RANKING (2026-08-13). Reorders categories the
    # agent is roughly EQUALLY curious about, preferring the one it has
    # never affected: rank = score * (1 + promise_weight * deficit).
    # RANKING ONLY — it never touches `_score`/`_w`, because those set the
    # shaping magnitude that is written into the replay buffer as the world
    # model's REWARD LABEL, and training the model on the agent's own
    # inference is a closed loop. A mastered category has score ~0, and
    # 0 * anything is 0, so this can never manufacture interest in
    # something already understood — it is a tie-break, not an override.
    promise_weight: 0.6
    # target set: which interactables the magnet may steer toward. null ->
    # DEFAULT_TARGETS (tree/stone/water/animal). Backgrounds are excluded so an
    # always-on-screen predicate can't win by co-occurrence.
    target_categories: null
    # attribution EMAs
    ema_beta: 0.01               # per-category / global LP EMA rate
    # 0.005 -> 0.0 (ported from lifelong). A leak means an out-of-view
    # category's learning-progress estimate decays toward zero, which
    # re-arms its cold-start floor on a timer rather than on evidence —
    # exactly the "guard becomes a latch" shape this project keeps hitting.
    ema_leak: 0.0
    # ---- THE MAGNET COULD NEVER RANK ANYTHING (2026-08-06) -------------
    # _score() was cat_lp[c] - global_lp, but cat_lp is EMA'd with the same
    # beta and the same lp as global_lp on every step c is present. For a
    # category present on EVERY step the two series are identical by
    # construction and the score is exactly 0, permanently. tree_visible is
    # exactly that: the head reports it present essentially always (it read
    # present while the agent stood in unrenderable void 65 blocks down).
    # MEASURED: 144 of 144 segments pinned at the cold-start floor w=0.3500,
    # cold_spent[tree]=144827, curiosity-ranked branch never fired once.
    # Comparing against the mean of the OTHER live targets lets an
    # always-present category still be ranked.
    contrast_vs_peers: true
    # ---- PHI FROM MEASURED CONTACT (2026-08-06) -------------------------
    # object_centered / object_adjacent are VLM-taught, and llava cannot tell
    # from a still frame whether something sits under the crosshair. The head
    # agreed with it 96% of the time and faithfully learned "nothing is ever
    # centred": Centring Phi 0.003 and Reach 2.0% for an entire run. The
    # label carries no spatial information, so no amount of training fixes it.
    # phi is now built from a COMPLETED BREAK — ground truth that something
    # was both centred and within range — the same substitution already made
    # for the reach sense.
    phi_from_evidence: true
    # trust gate (mirrors the symbolizer's perceptual_facts gate)
    present_threshold: 0.6
    reliability_floor: 0.35
    min_labels: 5
    # retarget hysteresis
    retarget_margin: 0.20
    min_dwell: 25
    absent_tolerance: 3          # tolerate brief head-sigmoid flicker (MF-2)
    # fade
    eps_abs: 1.0e-3              # absolute LP floor for hard ON/OFF
    scale_decay: 0.999           # running curiosity-scale decay
    # ZERO-REWARD-STALL FIX (ported from minecraft_lifelong.yaml 2026-08-01;
    # the fix was made there on 2026-07-25 and adversarially verified, but
    # skybot still carried the OLD farmable values and would have reproduced
    # the 19-hour zero-reward stall).
    # These four are RAW PER-STEP income (x weight, unbudgeted, NOT potentials).
    # With the cold-start budget unlatched they are farmable: standing at a
    # trunk holding attack paid ~0.14/step (~143/segment) against +5.0 for
    # actually felling a log — a 16:1 incentive to park. Zeroed so only the
    # TELESCOPING potential terms survive: a parked agent earns exactly 0,
    # while approaching still pays.
    instinct_bonus: 0.0
    approach_pull: 0.0
    align_bonus: 0.0
    aim_bonus: 0.0
    # GOAL-SEEKING / FRONTIER drive (July 2026): the pulls above are inert once
    # NO tree is on screen, and lifelong mode never resets the world to re-place
    # the fleet among trees — so after the spawn cluster is harvested the primary
    # strands off-tree at ~0 reward. seek_weight is a POTENTIAL on tree
    # visibility (rewards actions that bring a trunk into frame; telescopes to 0
    # over look-away/look-back so it can't be farmed). seek_forward_nudge is a
    # small BUDGETED forward reward that unsticks the agent from parking on stone
    # while no tree is visible; the budget refills the instant a tree is seen.
    # Both feed shaped_extrinsic and ride the reward mixer's natural anneal — the
    # intrinsic/extrinsic ratio is never hard-fixed.
    seek_weight: 1.5   # 0.5 -> 1.5 (2026-08-09): the seek potential is
                       # the tree-hunting drive; tripled with the envelope
    seek_categories:
    - tree_visible
    # GAZE RIGHTING (2026-08-06): levelness factor on the seek potential.
    # MEASURED: pitch pinned at the sky clamp 47.7% of a segment (mean -76deg)
    # — a pose from which no terrestrial goal can ever be foveated — and
    # nothing paid for coming back to the horizon. Humans get this from
    # vestibular righting. Telescoping (a bounded state function of measured
    # pitch), scaled by goal visibility, so it cannot become a stare-at-the-
    # horizon income.
    seek_pitch_level: true
    # ---- SOCIAL LEARNING (2026-08-09) -----------------------------------
    # JOINT ATTENTION: learning-progress attribution doubles for categories
    # co-present with the other player under the gaze — what happens near
    # the teacher teaches more. Demonstrations (observed_change events with
    # the player recently in view) socially PRIME the witnessed category:
    # curiosity injected for ~4000 steps + search refilled (goal emulation:
    # imitate the WHAT, discover the HOW).
    social_attention_boost: 1.0
    # 0.02 -> 0.05 (2026-08-08, alongside coverage 0.1->0.3): with every
    # farm defunded, search must be the best thing to do while no tree is
    # in sight. Still budgeted + pure-forward-only, so it cannot become a
    # parked income; budget refills on sighting and trickles via regen.
    seek_forward_nudge: 0.05
    # 200 -> 100 (2026-09-01, action_repeat 2 -> 4). Also STEP-denominated:
    # left alone the search drive would last twice as long in world time.
    # Halved together with seek_nudge_regen below so their RATIO is
    # unchanged — that ratio is what makes search able to starve but never
    # die, and it was bought by a measured 10h stall at nudge_left=0.
    seek_nudge_budget: 100
    # NUDGE REGEN (2026-08-07): the budget refilled ONLY on a goal sighting,
    # so a bot that burned it without ever finding a tree lost its search
    # drive PERMANENTLY (measured: nudge_left=0 for 10h+, parked in a
    # self-dug pit at 20 cells explored). One nudge trickles back per this
    # many steps — search can starve but never die. 0 = off.
    # 500 -> 250 (2026-08-08): doubled sustain rate alongside the nudge
    # raise — search is now the intended idle behaviour.
    # 250 -> 125 (2026-09-01): halved with seek_nudge_budget above so one
    # nudge still trickles back per the same amount of GAME TIME.
    seek_nudge_regen: 125
    # STALE-LP DISCOUNT (2026-08-07): with ema_leak=0 an absent category's
    # LP freezes; measured 10h fossils (water/zombie/sheep ~0.4 vs global
    # 0.03) would grab the target on their first re-sighting with zero fresh
    # evidence. On re-appearance the stored EMA decays toward the current
    # global with this time constant in absent-steps; recently-absent keeps
    # its standing, long-absent re-earns. 0 = off.
    lp_stale_tau: 20000
    # cold-start floor budget (audit): steps of floor-pull each category gets
    # to bootstrap its first interaction; after that an un-engaged category's
    # floor drops to 0 (static stone can no longer pay a standing park income
    # forever). Contrastive (genuine-curiosity) engagement is unaffected.
    # 4000 -> 100000000 (ported from lifelong). The BUDGET LATCH was the
    # measured cause of the 19-hour zero-reward run: the floor pull expired
    # after 4000 steps, and with it the only drive that brought a trunk into
    # frame. Effectively unlatched now that the farmable raw terms are 0 —
    # what remains is potential-only, so an unbounded budget cannot be farmed.
    cold_start_budget: 100000000
    pitch_actions:
    - 7
    - 8
    chop_actions:
    - 5
    - 6
    - 12                       # HOLD attack (2026-08-05)
    forward_actions:
    - 1
    - 2
    - 6
    turn_left_actions:
    - 3
    turn_right_actions:
    - 4
  perception_interval: 50
  goal_interval: 25
  reasoning_interval: 100
  async_mode: true
  reward_shaping:
    enabled: false
    weight: 0.2
    min_weight: 0.0
    decay: 5.0e-06
    clip: 1.0
    interval: 25
# ---- GENERAL INFRASTRUCTURE (2026-08-08) -----------------------------------
# The domain-agnostic monitor stack (docs/GENERAL_INFRASTRUCTURE.md): gates
# with declared reopen budgets, proof-of-life heartbeats, the reward ledger +
# farm detector, signal-informativeness monitoring, behaviour-drift alarms,
# stuck escalation ending in structured HELP REQUESTS
# (podlogs/help_requests.jsonl), episodic event memory, the affordance map,
# and empowerment shaping (reachable-future diversity — the general mechanism
# that makes pits/towers unattractive with zero domain knowledge).
infra:
  enabled: true
  log_dir: podlogs
  # DEGENERATE-SIGNAL GATE (2026-08-11). This set is the magnet's EXCLUSION
  # list, so a wrong entry here silently disables the drive that finds
  # trees. A signal counts as degenerate only once the teacher has actually
  # observed it TRUE this many times — i.e. once it has had a real
  # opportunity to vary. Measured live: `tree_visible` got flagged while the
  # agent stood in a treeless spot (fovea tree=0.007, "sighting never"), and
  # the magnet went to w=0.0000/target=None. Absence of trees is not a
  # broken tree detector.
  degenerate_min_positives: 10
  # STARVED vs BROKEN split (2026-08-16, the 5th guard-becomes-latch): the
  # min-positives gate above fixed the cold-start case, then latched anyway
  # on a WARM head — historical positives exist (35 logs felled), the agent
  # stares at the ground, every predicate reads constant-LOW, gets flagged,
  # and the magnet is forbidden from steering toward the one thing that
  # would cure the constancy. Now constant-low WITH proven positives stays
  # STEERABLE (honest absence is what seeking is FOR); only stuck-high or
  # positive-free signals are excluded. When this fraction of observed
  # predicates is starved at once, the stack calls it a GAZE problem
  # (actions["gaze_starved"]) and the loop re-opens gaze novelty instead of
  # demoting perception.
  gaze_starved_frac: 0.6
  # ---- UNSTUCK ADVISOR (#46, 2026-08-16) -------------------------------
  # The answering half of help requests: stuck L3 sends the request PLUS
  # the current view to the local VLM (same model as the symbolizer), which
  # picks ONE gentle intervention — look_around / prime a known category /
  # explore_wider / conserve. Guidance only biases what is INTERESTING
  # (curiosity injection, gaze novelty, exploration weights — all existing,
  # self-expiring levers); the agent's own body still discovers the how.
  # Rate-limited; every exchange logged to podlogs/help_responses.jsonl.
  # Fails to a no-op without a VLM.
  advisor_enabled: true
  advisor_min_gap: 4096
  advisor_prime_steps: 4000
  # ---- CONSEQUENCE FRONTIER (2026-08-13) -------------------------------
  # "Bored of what you have already CAUSED; curious about what you have SEEN
  # but never AFFECTED" — plus possession as a second axis of location.
  #
  # WHY: the magnet ranks by LEARNING PROGRESS, so it steers wherever it is
  # learning fastest. Measured live: water 0.186, stone 0.143, tree 0.138 —
  # so it went to stone, and the agent was watched looking straight at a
  # tree, walking past it, and mining dirt. Prediction-error progress can
  # express "how much am I learning ABOUT this" but never "how much does
  # this OPEN UP for me", and wood is visually dull and enormous in
  # consequence.
  #
  # This bootstraps with NO first success because the evidence is already
  # banked: thousands of dirt breaks closed dirt's consequence set, while a
  # category seen constantly has never once been affected. Every rival
  # design failed exactly there (interest from a graph built by experience,
  # where the experience needs the interest = latch, nine so far).
  consequence:
    enabled: true
    # a category must be SEEN this much before any deficit is claimed, so
    # ignorance (or a dead sensor) never reads as interest
    min_seen: 20.0
    # FRUITLESS ATTEMPTS ALSO CLOSE A FRONTIER (2026-08-14). Crediting only
    # outcomes let an UNAFFECTABLE target trap the magnet: stone is
    # unbreakable barehanded, so 400 swings (182 of them >=8 ticks, max
    # streak 202) produced zero breaks, stone's deficit stayed maximal, and
    # it held attention indefinitely while the agent broke NOTHING for
    # 307k steps. "I tried this repeatedly and nothing happened" is real
    # evidence about a thing. Weighted below 1.0 because a failed swing is
    # weaker evidence than a break — it may be bad aim rather than an inert
    # target — so it takes several to close what one success closes.
    attempt_scale: 0.25
    # attention spike over a category's OWN baseline that counts as
    # attending to it — stops an always-present predicate banking credit
    # for unrelated events
    min_credit: 0.05
    base_beta: 0.001
    # ONE-SHOT income for entering a possession set never held before. This
    # is what makes the ladder recede (log -> planks -> sticks) with no
    # recipe written anywhere. Strictly first-entry: the 1/sqrt form used
    # first was farmable at 10x by dropping and re-taking one item, because
    # sum(1/sqrt(n)) diverges. Lifetime income is bounded by the number of
    # distinct sets ever discovered.
    possession_weight: 0.30
    # CHAIN DEPTH (2026-08-15, user directive): "what should reward SkyBot
    # the most is delegating goals of getting wood -> crafting planks ->
    # making a crafting table, rewarded by far more than collecting wood."
    # Payout scales with how DEEP a possession set is, so a third rung pays
    # 9x a first. Depth is read off the agent's own inventory — nothing here
    # knows planks come from logs; a chain found in another order, or in
    # another domain, scores identically. Capped at 8 so the deepest rung is
    # worth about one felled log (19.2 vs 20) rather than swamping the task
    # signal, and still strictly one-shot per set.
    depth_exponent: 2.0
    max_depth: 8
  # ---- ANTICIPATION (2026-09-02, user-specified curve) -----------------
  # Per grounded predicate: repeated SIGHTING without the associated caused
  # effect builds a bounded anticipation level; the step the effect actually
  # happens, the level is paid out (scaled by how long it had been building)
  # and reset to zero; and the whole channel decays toward nothing as the
  # agent gets independently better at producing that effect — reusing
  # infra/stack.py's familiarity_curve, the SAME mastery clock
  # category_boringness already uses, rather than a second one that could
  # drift. Intrinsic channel ONLY (see infra/anticipation.py's docstring for
  # why prim_extrinsic would train the world model on its own inference).
  anticipation:
    enabled: true
    # THE "heavily guide when reward cannot be found" knob. Bounded from
    # both sides by design, not by this number alone: the ramp/decay curve
    # caps any single payout, and RewardMixer's return_ratio_cap already
    # limits how much any intrinsic term can dominate once real extrinsic
    # reward starts arriving. 0.5 is an honest starting weight, not a token
    # one — raise it if the segment log's "Anticipation bonus" line shows it
    # is inert against the rest of the intrinsic drive.
    weight: 0.5
    # a predicate counts as "seen" this step at or above this probability
    sight_threshold: 0.5
    # ANTI-FARM GATE: minimum steps between two counted sightings of the
    # SAME predicate. Without this, continuous presence (staring) would
    # inflate the anticipation level every step — exactly the sky/menu/
    # trunk-holding farm shape this project has paid for three times.
    # Sighting only counts on genuine RE-encounters, not on dwelling.
    sight_throttle_steps: 50
    # ceiling on the anticipation counter — bounded, never unbounded, so a
    # predicate seen for days without its effect cannot pay an unbounded
    # jackpot the one time it finally happens
    wait_cap: 8
    # EMA rate learning predicate<->effect association (contrastive against
    # each predicate's own baseline presence, same formula family as the
    # fovea association block in infra/stack.py)
    assoc_beta: 0.01
    # an association must clear this before it is eligible to pay. A
    # predicate with no achievable correlate (sky_visible, grass_visible)
    # never clears it and never pays — correct, not a bug: nothing "is
    # gotten" from seeing the sky.
    assoc_floor: 0.3
    base_beta: 0.001
    max_keys: 512
  empowerment_weight: 0.05
  empowerment_interval: 25
  stuck_patience: 3
  stuck_cooldown: 6
  farm_income_alarm: 0.02
  ledger_share_alarm: 0.8

skills_as_options:
  enabled: true
  # FOVEA CONTACT GATE (2026-08-07): break_*log* options are only OFFERED
  # when the trunk is under the gaze (fovea P(tree) >= 0.35) or contact is
  # measured — so the option's 80-tick budget starts at the work, not during
  # the walk. MEASURED motivation: 61 break_spruce_log invocations, 0
  # successes. Fail-open everywhere (ungated sense / non-log skill -> no
  # veto); vetoes counted in the Gate state log line.
  fovea_precondition: true
  # INERT IN LIFELONG MODE. developmental_loop reads
  # `lifelong.active_skills` and IGNORES k_slots whenever lifelong.enabled
  # is true, so editing this line alone changes nothing. Kept only so the
  # two stay visibly in agreement; the real knob is lifelong.active_skills.
  k_slots: 24           # = lifelong.active_skills (which overrides this)
  # WIDENED 25 -> 40 (2026-08-01), matching minecraft_lifelong.yaml, which
  # made this change on 2026-07-25 after measuring it; skybot never got it.
  # MEASURED: the agent chops BAREHANDED, and a log needs ~60 ticks. At 25
  # option-steps x action_repeat 2 the chop held attack for only 50 and timed
  # out a few ticks short EVERY time. 40 x 2 = 80 ticks clears it with margin.
  # This is the budget the scripted chop_trunk macro needs to ever complete.
  # Known cost: longer invocations coarsen SMDP credit assignment (~25 PPO
  # rows per 1024-step segment instead of ~41), so do NOT raise it further
  # without reason — the target is ticks-to-break plus margin, not "big".
  # 40 -> 80 (= 160 ticks, 2026-08-14). The note above says the target is
  # "ticks-to-break plus margin, not big" — and that target moved: 80 ticks
  # covers a barehanded log but truncates any harder block, so an option
  # attempting one could never finish and the agent could never learn that
  # it CAN. The documented cost is real and accepted: longer invocations
  # coarsen SMDP credit (~13 PPO rows per 1024-step segment instead of ~25),
  # which is why this is doubled rather than removed. Raise further only
  # against a measured ticks-to-break that needs it.
  # 80 -> 16 (2026-09-01). Two reasons compounding. At action_repeat 4 an
  # 80-step option is 320 game ticks with the meta-policy blindfolded
  # throughout. And it buys behavioural diversity that MEASURABLY DOES NOT
  # EXIST: a minted skill is a byte copy of the shared policy (cosine
  # 0.869-1.000, three pairs bit-identical), so invoking one is running the
  # same policy with the decision resolution thrown away. 16 keeps the whole
  # SMDP apparatus and the row economics while restoring resolution. Raise it
  # when a skill-divergence measurement says there is something to commit to.
  max_option_steps: 16
  terminate_on_spike: true
  scouts_use_options: true
  gate_by_preconditions: true
  # skill-invokes-skill depth (ported from lifelong). Absent = 1 = the legacy
  # flat behaviour, which would have made the nested-option machinery inert.
  max_skill_depth: 2
  # LET GOAL-DIRECTED OPTIONS DRIVE MORE: the old 0.6 gates locked out every
  # early low-competence skill, so the policy never invoked an option (0 firings
  # over the whole run). Loosened so learned skills are actually offered and
  # exercised — the option value/competence still governs WHEN the policy picks
  # them; this only widens eligibility.
  precondition_min_match: 0.4
  # COMPETENCE FLOOR 0 (2026-08-10, pre-boot point 4): the 0.25 floor was the
  # FOURTH guard-becomes-latch — every skill's frozen bias inherited a
  # poisoned −5.68, no invocation could ever raise competence, so ALL 16
  # skills sat at invocations=0 forever and mastery was UNMEASURABLE. The
  # floor is redundant protection: probation, the contact gate and
  # precondition matching all still govern option firing, and the option
  # VALUE still decides when the policy picks one. Eligibility must not
  # depend on a statistic that can only move once eligibility is granted.
  competence_floor: 0.0
  # NO SCRIPTED OPTIONS (ported from lifelong 2026-08-01; the decision was
  # made there on measured evidence and skybot never received it).
  #
  # Meaning and skill must be EARNED from experience, never declared. Felling
  # a tree is not a fixed macro.
  #
  # IT WAS ALSO ACTIVELY HARMFUL. Measured over 32 segments / ~110k steps with
  # the scripted `chop_trunk` this file used to contain:
  #   * 2366 invocations = 96% of ALL option activity, on every stream at once
  #   * ZERO logs broken, the entire run (69 dirt, 66 spruce_leaves, 0 logs)
  #   * attack held for 10726 consecutive game ticks with nothing breaking
  #   * 21+ consecutive segments of 0.00 extrinsic reward
  # Root cause: its preconditions were tree_visible + object_centered +
  # object_adjacent, but `precondition_min_match: 0.4` above means TWO OF
  # THREE suffice — so it fired with object_adjacent FALSE and held attack at
  # a trunk it could not reach. A fixed macro cannot notice it is hitting
  # nothing; a policy can.
  #
  # The original justification ("the emergent policy presses attack a step at
  # a time and moves on") does not survive the data either: the agent has
  # already produced runs of 10-21 consecutive attack macros 69 times — that
  # is what a 20-42 tick dirt break IS. The sustained-attack barrier this
  # existed to vault is lower than the height the agent already clears.
  #
  # tests/_no_scripted_skills_smoke.py FAILS if this list is ever non-empty.
  scripted_options: []
  # ---- SKILLS AS MEMORIES (2026-08-01) ----------------------------------
  # A skill used to mint ONCE, at its first unlock (when the policy could
  # barely do it), and then stay frozen for the whole run — a recording, not
  # a memory. With practice on, an invocation that produces the skill's OWN
  # grounded effect trains that skill toward the actions it just took.
  #   * self-imitation only — failures change no weights (see skill_practice)
  #   * KL trust region — bounded drift per invocation, so the meta-policy's
  #     value for "invoke slot k" can never go stale by more than kl_max
  #   * consolidation — proven skills (high strength) move progressively less
  #   * decay — unrehearsed skills weaken and are reported stale for
  #     re-derivation from current competence
  practice:
    enabled: true
    lr: 1.0e-4              # small: a skill should drift, not lurch
    kl_max: 0.02            # max action-distribution change per invocation
    min_steps: 4            # too short an invocation is not evidence
    epochs: 1
    strength_up: 0.10       # ~10 clean successes to fully consolidate
    strength_down: 0.02     # a failure costs confidence, not weights
    decay_per_segment: 0.01 # forgetting: ~100 unused segments to go stale
    stale_below: 0.15
    max_traj: 256
  cache:
    max_resident: 8
    dtype: fp32
  mine_cooccurrence: true
# ---- LIVE VIEWER (2026-08-02) ------------------------------------------
# MJPEG stream of the agent's own frame with the live action, extrinsic and
# intrinsic reward overlaid. The server has existed for months and was never
# enabled here; it was also only ever fed from the episodic loop path, so it
# would have shown a black screen even if switched on. Both fixed.
# Watch it with:
#   ssh -N -L 8000:localhost:8000 -i ~/.ssh/skybot_ed25519 root@<pod>
#   then open http://localhost:8000
viewer:
  enabled: true
  port: 8000
brain_viewer:
  enabled: true
  out_dir: podlogs/brain
  interval: 400
  ghost_frontier: true
skill_composition:
  enabled: true
  min_mastery: 0.7
  max_compositions_per_cycle: 3
dream_training:
  enabled: true
  # ---- AUGMENT, NOT CONTROL (2026-08-01) --------------------------------
  # control: true made this ENTIRE block dead in a lifelong run. Two
  # independent gates closed it:
  #   1. dream_training_active = (not lifelong) and control and stage==IMAGINE
  #      -> lifelong.enabled: true forces this False, forever.
  #   2. dream_augment = enabled and NOT control -> control:true forces this
  #      False, so the distill path never ran either.
  # control: false selects AUGMENT mode, which lifelong DOES support (the
  # dream_augment_active check carries no lifelong guard): PPO stays in
  # control of real actions and the PPO path is byte-for-byte unchanged,
  # while the dream actor trains in imagination and is distilled into the
  # real policy. That is the sample-efficiency lever this run wants — the
  # bottleneck is the Minecraft client at ~10 steps/s, not GPU.
  control: false
  warmup_episodes: 2
  # NOW LIVE (it gates dream_augment_active). Kept explicit rather than
  # relying on its silent fallback to warmup_episodes.
  activate_after_episodes: 2
  # 15 -> 30. At action_repeat 2 a 15-step dream is only 30 GAME TICKS, and a
  # barehanded log break is ~60 — the rollout structurally could not contain
  # a completed break, so the dream critic could never propagate value back
  # from one. 30 steps = 60 ticks covers it. COST: compounding WM error over
  # longer rollouts; if dream_distill_trust_frac is low, walk this back first.
  imagination_horizon: 30
  batch_size: 16
  # 1 -> 4. One batch of 16 sequences per 1024-step segment was a rounding
  # error of extra learning. Dream batches cost GPU, not environment
  # interaction, and the env is the bottleneck — so this is close to free.
  n_dream_batches: 4
  # Verified safe: _add_dream_curiosity calls the ICM with update_state=False
  # and never writes to replay or the WM reward head, so it does NOT cross the
  # self-hallucinated-reward boundary. BUT it makes the dream teacher prefer
  # states the ICM found surprising IN IMAGINATION, which on a weak WM is the
  # same set as "hallucinated". Turn this OFF FIRST if distillation hurts.
  dream_curiosity: true
  hidden_dim: 400
  actor_lr: 3.0e-05
  critic_lr: 3.0e-05
  gamma: 0.997
  lambda_: 0.95
  entropy_scale: 0.0003
  target_ema: 0.98
  # ---- DISTILL STRENGTH (were defaults; made explicit so they are tunable) --
  distill_weight: 1.0            # base dream->real pull
  distill_lr: 1.0e-4             # optimizer LR for the distill step
  teacher_temp: 0.5              # <1 sharpens toward the dream's PREFERRED action
  value_gate: true               # distill only where dream critic > real critic
  natural_anneal: true           # fade the pull by (1 - solve_ema)
  # ---- THE ANNEAL'S DEFINITION OF "SOLVED" (defect fix 2026-08-01) --------
  # WAS the 0.1 default, which is calibrated for EPISODIC tasks where episode
  # reward means task completion. In lifelong, episode_metrics is a 1024-step
  # SEGMENT and episode_reward is the primary stream's raw extrinsic SUM —
  # so a single incidental dirt break (+0.15) or leaf (+0.3) marked the whole
  # segment "solved". With solve_ema_beta 0.05 the EMA saturates toward 1.0
  # within ~60 segments and eff_w = w * (1 - solve_ema) collapses to ~0: the
  # distillation would have annealed ITSELF OFF because the agent broke some
  # dirt, not because it learned anything. 5.0 = one log, i.e. real progress.
  solve_threshold: 5.0
  solve_ema_beta: 0.05
  # ---- WM-TRUST GATE — do not tune blind ---------------------------------
  # This is what stands between the policy and the documented collapse mode
  # (weak WM -> hallucinating teacher -> full-strength pull -> more failure).
  # The distill step RETURNS dream_distill_trust_frac / _gate_frac /
  # _eff_weight — READ THOSE before changing trust_kl_max. trust_frac ~0 means
  # the WM never earns trust (inert but safe) -> raise it. trust_frac ~1 while
  # the WM is visibly bad -> lower it. 6.0 nats summed over 32 categorical
  # groups is tight for pixel Minecraft; expect a low fraction at first.
  trust_gate: true
  trust_kl_max: 6.0
  trust_ema_beta: 0.1
  # ---- SLEEP CONSOLIDATION FOR SKILLS (2026-08-01) -----------------------
  # Waking practice only fires when a skill is invoked AND produces its own
  # grounded effect — rare at ~10 env steps/s. Here each bound skill is
  # rolled forward through the WORLD MODEL using its own actor, and trained
  # toward its ELITE imagined rollouts. Same self-imitation, same KL trust
  # region, same consolidation curve as waking practice; only the evidence
  # is dreamed, and it is discounted (lr_scale) and gated on WM trust
  # accordingly. min_trust is the important safety line: below it a rollout
  # is confabulation, and consolidating on it teaches the skill to be good
  # at a hallucination. Raise min_trust if dream_distill_trust_frac is high
  # while real competence is not improving.
  consolidate_skills:
    enabled: true
    min_trust: 0.2        # WM trust EMA floor — below this, nothing dreams
    rollouts: 8           # imagined trajectories per skill per rehearsal
    horizon: 12           # imagination depth (WM error compounds past this)
    elite_frac: 0.25      # top fraction of rollouts that teach
    slots_per_segment: 3  # round-robin, so every skill gets sleep
    lr_scale: 0.5         # dreamed evidence is weaker than real evidence
developmental_stages:
  window: 6
  min_episodes: 2
  flat_slope_threshold: 0.001
  skill_rate_threshold: 0.02
  spike_factor: 2.5
  reentry_bump: 0.2
  trust_level: 0.012
  patience: 4
  # total_timesteps counts ALL streams, so thresholds here are num_envs x the
  # primary stream's steps. 200000 fired EXPLOIT at only 50k primary steps
  # (audit); 800000 was then chosen as "= 200k primary steps" on the
  # assumption of 4 streams.
  # CORRECTED 2026-08-02: parallel_envs.num_envs is 2, not 4, so the counter
  # advances +2 per loop step and 800000 was actually 400k primary steps —
  # double the intended point, and since the mixer is gated=True that also
  # doubled how long the curiosity->task anneal stayed frozen (min_intrinsic
  # 0.0 does nothing until start_anneal fires). 400000 = 200k primary steps,
  # which is what was meant. Keep this = 2 x the intended primary-step count
  # whenever num_envs changes.
  force_exploit_timestep: 400000
  force_imagine_timestep: 1500000
hub:
  enabled: false
  repo_id: ''
  private: true
  push_on_mastery: false
  token: null
distributed:
  enabled: false
  num_workers: 4
  num_cpus_per_worker: 1
  num_gpus_per_worker: 0
  shared_skill_bank: true
  ray_address: null
loop:
  total_timesteps: 4000000
  checkpoint_interval: 25000
  eval_interval: 1000000
  eval_episodes: 1
  curriculum_enabled: false
  difficulty_increase_threshold: 0.8
  difficulty_check_interval: 50
  log_dir: ./logs
  # ---- SELECTIVE RESUME (2026-08-03) -----------------------------------
  # load_checkpoint() has existed for months and NOTHING in the launch path
  # ever called it, so every restart threw away the world model, policy,
  # curiosity, dream actor and glue layer and relearned from scratch — while
  # the skill bank persisted. The system retained SKILLS better than
  # LEARNING. That is why entropy started ~90% after every deploy and the
  # reward curve 0.02 -> 0.14 -> 0.38 -> 0.53 was re-run from zero each time.
  #
  # PERCEPTION ONLY, ON PURPOSE. These four are trained by PREDICTION, not by
  # reward, so none of them carries a policy pathology forward. The world
  # model is also the expensive one (55 MB, every frame of every stream) and
  # under arch="wm" the policy READS its encoder — so a fresh policy resumes
  # onto a trained visual system and only relearns its action mapping.
  #
  # `policy` and `dream_actor` are deliberately ABSENT and are refused by
  # name if added: they encode a policy converged under the reward economics
  # we just changed, and would resume at ~0 entropy with no way to explore
  # out of a now-wrong optimum. Revisit once entropy is understood.
  #
  # PERCEPTION + FAMILIARITY NOW PERSIST (2026-08-10, pre-boot point 1):
  # `perception` = symbolizer.pt (grounded heads, reliability, label/pos
  # evidence, retractions — heads load only on exact vocab match, evidence
  # merges always) and `familiarity` = familiarity.pt (_nov_counts,
  # _gaze_counts, known symbols, symbol counts — merged, never replaced).
  # Env-side _visits rides in breaks_by_type.json ("cells"). Before this,
  # every launch rebooted perception to random and re-paid the novelty
  # windfall for a world already seen.
  resume_components:
    - world_model
    - symbolic_decoder
    - glue_layer
    - knowledge_graph
    - perception
    - familiarity
    # MAGNET (2026-08-17): the curiosity memory that decides WHERE TO LOOK.
    # Measured after the relaunch of this date: "w=0.0000, target=None" with
    # every category at LP 0.000 — not suppressed, amnesiac.
    # NO LONGER GATED ON world_model (2026-08-23 review): VisionScaffold's
    # state is five category-NAME-keyed scalar containers, valid against any
    # encoder, so gating it made a failed world-model restore ALSO discard
    # the curiosity memory. See _RESUME_ENCODER_KEYED.
    - magnet
    # REPLAY BUFFER (2026-08-23): the world model's raw experience. Without
    # this every crash-relaunch restarted WM training from an EMPTY buffer —
    # the effective memory was never the configured capacity, it was
    # "however long since the last crash". Not encoder-keyed (it stores raw
    # frames and actions), so a fresh encoder can train on it perfectly well;
    # that is what a replay buffer IS.
    - replay_buffer
  tensorboard: true
  verbose: 1
imagination_curiosity:
  # CURIOSITY THAT DOES NOT DIE (ported from lifelong 2026-08-01 — this block
  # was entirely ABSENT from skybot, so the subsystem was off).
  # Learning-progress curiosity is a DERIVATIVE of prediction error, so it
  # necessarily dies once a stationary world is mastered — and skybot runs on
  # a persistent server where that happens. This adds two world-model-sourced
  # drives that take over as external curiosity fades: DISAGREEMENT between
  # imagined rollouts (never dies — there is always something the model is
  # unsure of) plus a small DECAYING daydream term. Intrinsic channel ONLY,
  # so it can never become a replay reward LABEL and train the world model's
  # reward head on the agent's own daydreams.
  enabled: true
  every: 50                      # steps between imagination probes (cost)
  rollouts: 8                    # K imagined futures
  horizon: 10                    # H latent steps each
  disagreement_weight: 0.30      # the durable, never-dying term
  imagined_reward_weight: 0.10   # the small daydream term...
  imagined_reward_halflife: 300000   # ...which decays over a life
  lp_reference: 0.05             # global_lp at which boredom = 0
  max_bonus: 0.5                 # hard cap on the total intrinsic add
goals:
  # REPEATABILITY GATE (ported from lifelong 2026-08-01 — absent here, so one
  # reward spike could mint a skill). A spike must RECUR before it becomes a
  # goal/skill; without it the bank fills with junk goals (48/48 ungrounded
  # slots, 0/51 mastered, was the measured outcome). Enforced by
  # tests/_repeatability_gate_smoke.py.
  mint_min_repeats: 3
  mint_window_eps: 12
  mode: discovered
  max_slots: 48        # widened working goal set (single-knob = lifelong.active_goals)
  mint_skills: true
  spike_threshold: 0.9
  match_cosine: 0.8
  seed: 0
video:
  enabled: true
  out_dir: podlogs/mc_videos
  head: 3
  every: 25
  upscale: 6
  fps: 12
lifelong:
  enabled: true
  forever: false
  stop_file: podlogs/STOP
  segment_steps: 1024
  active_skills: 24
  active_goals: 48
  state_decay: 1.0
  reset_on_death_only: true
  segment_len: 1024
  wm_train_every: 250
  goal_horizon: 8000
  # Working-set <-> long-term paging (unbounded goals). With this ON a full
  # goals.max_slots registry no longer refuses new discoveries: the stalest
  # low-value slot is paged OUT to an on-disk store (evict-on-disuse) and a
  # re-encountered behaviour is RECALLED (recall-on-cue). Total knowledge grows
  # unbounded on disk while the network only ever sees the bounded working set.
  # Skill payloads are NEVER wiped on a page-out (skill_bank_data is retained).
  paging:
    enabled: true
    min_idle_episodes: 8      # goal-horizon windows a slot must be idle to evict
    recall_threshold: 0.8     # cosine cue-match to page a dormant behaviour in

# ---- Acting-while-learning: WM consolidation on a background thread ----
# (the bot never freezes at wm_train_every; PPO stays synchronous)
async_wm:
  enabled: true

# ---- Goal-level prospection: imagine-before-committing at goal selection ----
# At each goal horizon the frontier's top-M candidates are rolled through the
# world model under their counterfactual goal broadcasts; imagined discounted
# return blends 50/50 with the retrospective frontier score.
prospection:
  enabled: true
  weight: 0.5
  top_m: 4
  rollouts: 16
  # (4/5) 15 -> 24. At action_repeat 4 a horizon of 15 is 60 GAME TICKS —
  # exactly one barehanded oak log. Prospection is "imagine before
  # committing"; a horizon that barely spans the act it is evaluating cannot
  # distinguish "this fells a log" from "this does nothing", which is the
  # one discrimination the whole mechanism exists to make. 24 = 96 ticks
  # gives real margin either side. Costs ROLLOUT COMPUTE, not memory — and
  # the GPU sits at ~2% on the acting thread.
  # REVERT IF: `Phase timing: act` rises materially (prospection runs in the
  # decision path, so this is the line that would show it).
  horizon: 24
