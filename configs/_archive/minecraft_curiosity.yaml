environment:
  name: MineRLTreechop-v0
  max_episode_steps: null
  success_reward_threshold: 0.9
  mastery_reward_floor: 0.0
  mastery_reward_target: 8.0
  render_mode: null
  pixel_obs: true
  image_size: 128
  render_size: 128
  grayscale: false
  action_repeat: 2
world_model:
  stochastic_size: 32
  stochastic_classes: 32
  deterministic_size: 512
  encoder_hidden: 256
  decoder_hidden: 256
  learning_rate: 0.0003
  batch_size: 16
  sequence_length: 16
  train_iters: 128
  buffer_capacity: 240000
  imagination_horizon: 15
  film_conditioning: true
  inverse_dynamics: true
  inverse_dynamics_scale: 1.0
  causal_align: true
parallel_envs:
  enabled: true
  reset_timeout_s: 300
  step_timeout_s: 120
  num_envs: 4
prioritized_replay:
  enabled: true
  alpha: 0.6
  beta: 0.4
  epsilon: 0.01
async_replay:
  enabled: true
curiosity:
  mode: learning_progress
  lp_history: 30
  lp_min_samples: 4
  lp_pixel_pool: 4
  lp_proto_thresh: 0.025
  lp_max_protos: 512
  exploration_decay_rate: 0.02
  feature_dim: 256
  hidden_dim: 256
  forward_loss_weight: 0.8
  inverse_loss_weight: 0.2
  curiosity_reward_scale: 1.0
  curiosity_reward_clip: 5.0
  learning_rate: 0.0001
  novelty_window: 1000
knowledge_graph:
  neo4j_uri: bolt://localhost:7687
  neo4j_user: neo4j
  neo4j_password: password
  embedding_dim: 64
  embedding_model: TransE
  embedding_epochs: 100
  min_confidence: 0.7
  max_facts_per_step: 10
  use_in_memory_fallback: true
  force_in_memory: true
symbolic:
  enabled: true
  knowledge_source: goal
symbolic_grounding:
  enabled: true
  model: llava:7b
  interval: 60
  max_interval: 600
  anneal_agreement: 0.9
  hidden_dim: 256
  lr: 0.001
  fact_threshold: 0.7
  min_labels: 5
  reliability_floor: 0.35
skill_bank:
  storage_dir: ./skill_bank_mc_curiosity
  mastery_threshold: 0.8
  mastery_window: 50
  min_episodes_before_save: 20
  max_skills_loaded: 5
  similarity_threshold: 0.5
policy:
  algorithm: PPO
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  extrinsic_reward_weight: 0.3
  intrinsic_reward_weight: 0.7
  reward_decay_rate: 5.0e-06
llm:
  enabled: false
  model: llama3.1:8b
  env_description: 'Minecraft: find trees and chop wood.'
  # Curiosity-ranked vision magnet (redesigned July 2026): reads the grounding
  # head's per-object presence probs + the primary stream's learning progress
  # (intrinsic[0]), keeps a contrastive per-category LP-EMA, and steers toward
  # the most-curious in-view interactable — fading as curiosity quenches,
  # re-arming on a novel object. No second VLM; condition-based, not a clock.
  vision:
    enabled: true
    weight: 0.6
    min_weight: 0.0
    target_categories: null       # null -> tree/stone/water/animal
    ema_beta: 0.01
    ema_leak: 0.005
    present_threshold: 0.6
    reliability_floor: 0.35
    min_labels: 5
    retarget_margin: 0.20
    min_dwell: 25
    eps_abs: 1.0e-3
    scale_decay: 0.999
    instinct_bonus: 0.4
    approach_pull: 0.18
    align_bonus: 0.12
    aim_bonus: 0.15
    pitch_actions:
    - 7
    - 8
    chop_actions:
    - 5
    - 6
    forward_actions:
    - 1
    - 2
    - 6
    turn_left_actions:
    - 3
    turn_right_actions:
    - 4
  perception_interval: 50
  goal_interval: 25
  reasoning_interval: 100
  async_mode: true
  reward_shaping:
    enabled: false
    weight: 0.2
    min_weight: 0.0
    decay: 5.0e-06
    clip: 1.0
    interval: 25
skills_as_options:
  enabled: true
  k_slots: 8
  max_option_steps: 25
  terminate_on_spike: true
  scouts_use_options: true
  gate_by_preconditions: true
  precondition_min_match: 0.6
  competence_floor: 0.6
  cache:
    max_resident: 8
    dtype: fp32
  mine_cooccurrence: true
brain_viewer:
  enabled: true
  out_dir: podlogs/brain
  interval: 400
  ghost_frontier: true
skill_composition:
  enabled: true
  min_mastery: 0.7
  max_compositions_per_cycle: 3
dream_training:
  enabled: true
  control: true
  warmup_episodes: 2
  activate_after_episodes: 2
  imagination_horizon: 15
  batch_size: 16
  n_dream_batches: 1
  dream_curiosity: true
  hidden_dim: 400
  actor_lr: 3.0e-05
  critic_lr: 3.0e-05
  gamma: 0.997
  lambda_: 0.95
  entropy_scale: 0.0003
  target_ema: 0.98
  trust_gate: true
  trust_kl_max: 6.0
  trust_ema_beta: 0.1
developmental_stages:
  window: 6
  min_episodes: 2
  flat_slope_threshold: 0.001
  skill_rate_threshold: 0.02
  spike_factor: 2.5
  reentry_bump: 0.2
  trust_level: 0.012
  patience: 4
  force_exploit_timestep: 200000
  force_imagine_timestep: 3000000
hub:
  enabled: false
  repo_id: ''
  private: true
  push_on_mastery: false
  token: null
distributed:
  enabled: false
  num_workers: 4
  num_cpus_per_worker: 1
  num_gpus_per_worker: 0
  shared_skill_bank: true
  ray_address: null
loop:
  total_timesteps: 4000000
  checkpoint_interval: 25000
  eval_interval: 1000000
  eval_episodes: 1
  curriculum_enabled: false
  difficulty_increase_threshold: 0.8
  difficulty_check_interval: 50
  log_dir: ./logs
  tensorboard: true
  verbose: 1
goals:
  mode: discovered
  max_slots: 16
  mint_skills: true
  spike_threshold: 0.9
  match_cosine: 0.8
  seed: 0
video:
  enabled: true
  out_dir: podlogs/mc_videos
  head: 3
  every: 25
  upscale: 6
  fps: 12
lifelong:
  enabled: false
  forever: false
  stop_file: podlogs/STOP
  segment_steps: 1024
  active_skills: 24
  active_goals: 48
  state_decay: 1.0
  reset_on_death_only: true
