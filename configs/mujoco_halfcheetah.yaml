# ============================================================
# Developmental AI — MuJoCo HalfCheetah Configuration
# ============================================================
# Continuous control benchmark: 17D observations, 6D continuous
# actions. Tests the dream training pipeline on high-dimensional
# continuous environments where sample efficiency matters most.
#
# Requires: pip install gymnasium[mujoco]
# Usage: DevelopmentalAI(config_path="configs/mujoco_halfcheetah.yaml")
# ============================================================

environment:
  name: "HalfCheetah-v4"
  max_episode_steps: 1000
  render_mode: null
  pixel_obs: false

world_model:
  stochastic_size: 32
  stochastic_classes: 32
  deterministic_size: 512
  encoder_hidden: 256
  decoder_hidden: 256
  learning_rate: 0.0001
  batch_size: 32
  sequence_length: 50
  buffer_capacity: 500000
  imagination_horizon: 15

curiosity:
  feature_dim: 256
  hidden_dim: 256
  forward_loss_weight: 0.8
  inverse_loss_weight: 0.2
  curiosity_reward_scale: 0.5
  curiosity_reward_clip: 5.0
  learning_rate: 0.0001

knowledge_graph:
  embedding_dim: 64
  embedding_model: "TransE"
  embedding_epochs: 100
  min_confidence: 0.7
  use_in_memory_fallback: true

skill_bank:
  storage_dir: "./skill_bank_data/halfcheetah"
  mastery_threshold: 0.8
  mastery_window: 100
  min_episodes_before_save: 50

policy:
  algorithm: "PPO"
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  extrinsic_reward_weight: 0.5
  intrinsic_reward_weight: 0.5

llm:
  enabled: true
  model: "llama3.1:8b"
  env_description: >
    HalfCheetah-v4: A 2D cheetah robot with 6 joints that must learn
    to run forward as fast as possible. Observations include joint angles
    and velocities (17D). Actions are continuous torques applied to each
    joint (6D). Reward is forward velocity minus control cost. The agent
    must discover coordinated leg movements for efficient locomotion.
  perception_interval: 100
  goal_interval: 50
  reasoning_interval: 200

skill_composition:
  enabled: true
  min_mastery: 0.7
  max_compositions_per_cycle: 3

dream_training:
  enabled: true
  warmup_episodes: 100
  imagination_horizon: 15
  batch_size: 32
  n_dream_batches: 4
  dream_curiosity: false
  hidden_dim: 400
  actor_lr: 0.00008
  critic_lr: 0.00008
  gamma: 0.997
  lambda_: 0.95
  entropy_scale: 0.001
  target_ema: 0.98

loop:
  total_timesteps: 2000000
  checkpoint_interval: 50000
  eval_interval: 25000
  eval_episodes: 10
  curriculum_enabled: false
  log_dir: "./logs/halfcheetah"
  tensorboard: true
  verbose: 1
