# SkyBot live tracker — collector + dashboard.
#
# RUNS ON THE CI-RUNNER MINI, not the Paper server box. CLAUDE.md §6 records
# the server mini as the system's bottleneck (4 MineRL clients -> 0 segments in
# 17 minutes); Grafana plus an ingester on 2 cores would compete with the
# Paper tick thread, and a laggy tick costs agent actions directly.
#
#   cp monitor.env.example .env && edit          # .env, NOT monitor.env —
#   docker compose up -d --build                 # ${...} interpolation only
#                                                # reads a file named .env
#
# THE RAW JSONL IS THE SYSTEM OF RECORD. skybot.db is a view: delete it, and
# `docker compose restart ingest` rebuilds it identically from the log.
# ---- PROJECT NAME IS PINNED (added 2026-09-23) ----------------------------
# Compose names volumes `<project>_<volume>`, and the project defaults to the
# DIRECTORY NAME. This stack's volumes hold the ENTIRE metrics history
# (metrics_data) and Grafana's own database -- admin password, dashboard
# edits, annotations (grafana_data). Running this file from a different path
# would create EMPTY volumes and look like total data loss, which is exactly
# what a move from a hand-copied ~/skybot-monitor into a git checkout would
# otherwise do. Pinning the name makes the directory irrelevant.
name: skybot-monitor

services:

  # 1. Pull the host's metrics here, live + complete. See the script header for
  #    why it runs BOTH a tail and a periodic rsync.
  collector:
    # BUILT, not `image: alpine` + a runtime install. The inline
    # `sh -c "apk add ... && bash ..."` crash-looped with
    #   sh: syntax error: unexpected "&&"
    # because a YAML folded scalar plus Compose's argument splitting does not
    # preserve the quoting. See Dockerfile.collector.
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: skybot-collector
    restart: unless-stopped
    env_file: [.env]
    volumes:
      # The script is baked into the image; mounting it too means an edit on
      # the host takes effect on restart without a rebuild.
      - ./collect_metrics.sh:/opt/collect_metrics.sh:ro
      - ${MAIN_SSH_KEY_HOST_PATH:?set MAIN_SSH_KEY_HOST_PATH in docker/monitor/.env}:/root/.ssh/skybot_ed25519:ro
      - metrics_data:/data
    environment:
      MAIN_SSH_KEYFILE: /root/.ssh/skybot_ed25519
      OUT_DIR: /data
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # 2. Independent server-side truth. Thin on purpose — see server_poll.py.
  server_poll:
    image: python:3.11-alpine
    container_name: skybot-server-poll
    restart: unless-stopped
    env_file: [.env]
    command: python /opt/server_poll.py
    volumes:
      - ./server_poll.py:/opt/server_poll.py:ro
      - metrics_data:/data
    environment:
      SERVER_PATH: /data/server.jsonl
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  # 3. JSONL -> SQLite. Idempotent on `seq`, so re-running over the whole file
  #    is safe and is how you rebuild after a bad ingest.
  ingest:
    image: python:3.11-alpine
    container_name: skybot-ingest
    restart: unless-stopped
    command: python /opt/ingest.py
    volumes:
      - ./ingest.py:/opt/ingest.py:ro
      - metrics_data:/data
    environment:
      DB_PATH: /data/skybot.db
      METRICS_PATH: /data/metrics.jsonl
      SERVER_PATH: /data/server.jsonl
      HEARTBEAT_PATH: /data/heartbeat.jsonl
      POLL_SECONDS: "10"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  grafana:
    image: grafana/grafana:11.1.0
    container_name: skybot-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      # The SQLite datasource is a community plugin; without this Grafana
      # starts fine and every panel is empty, which reads like "no data" when
      # it is actually "no datasource".
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-skybot}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - metrics_data:/data:ro
      - grafana_data:/var/lib/grafana
    depends_on: [ingest]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  # ---- RACK HOST METRICS (committed 2026-10-01) ------------------------
  # These three ran on node1 for weeks and existed in NO repo. Everything
  # below this line is now version-controlled; `.env` (secrets) and the named
  # volumes (state) deliberately are not.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    # The hostname node-exporter reports. PARAMETERISED (was hardcoded
    # `node1`): the whole point of committing this file is that it can be
    # deployed somewhere else, and a second host silently reporting as "node1"
    # would be worse than no metrics at all.
    hostname: ${MONITOR_HOSTNAME:-node1}
    restart: unless-stopped
    pid: host                    # so metrics are the HOST's, not the container's
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - node_textfile:/textfile
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      # picks up gpu.prom from the gpu-metrics container below
      - '--collector.textfile.directory=/textfile'
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  # INTEL iGPU ONLY — this is node1's integrated graphics via /dev/dri. It has
  # never measured main's RTX 5050; that is nvidia_gpu_exporter on main:9835,
  # installed by scripts/install_host_exporters.sh. Confusing the two cost a
  # day of assuming main's GPU was being watched when nothing was.
  gpu-metrics:
    build:
      context: .
      dockerfile: Dockerfile.gpu_metrics
    container_name: gpu-metrics
    restart: unless-stopped
    privileged: true            # intel_gpu_top needs perf-event access
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - node_textfile:/textfile
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

volumes:
  # Shared so the collector writes, ingest reads, Grafana reads the DB.
  # A named volume rather than a bind mount: this is the durable artifact and
  # it should not depend on a host path that might be moved.
  metrics_data:
  grafana_data:
  # textfile drop-box: gpu-metrics writes, node-exporter reads
  node_textfile:
  prometheus_data:
