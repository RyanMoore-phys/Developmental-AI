# Sync code to the training host. Runs automatically after `ci` succeeds, and can be run
# by hand at any time from any branch.
#
# NO BRANCH PROTECTION IS ASSUMED (2026-09-02). This is a single-maintainer
# private repo; requiring review-before-merge would be ceremony with nobody to
# perform it, and branch protection is not available on every plan anyway. The
# real production gates are in THIS FILE and do not depend on any repo setting:
#   * automatic runs require ci to have passed (workflow_dispatch bypasses it
#     deliberately — you are the reviewer);
#   * the checkout is pinned to the exact commit ci validated;
#   * a live training run is never stopped or restarted implicitly.
#
# TRANSPORT defaults to plain SSH, NOT tailscale. The self-hosted runner is
# the maintainer's own machine: it already holds ~/.ssh/skybot_ed25519 and can
# reach the host's public endpoint, so nothing extra needs configuring. Set
# DEPLOY_TRANSPORT=tailscale in the runner's .env to switch — that path needs a
# tailnet ACL rule (docs/CI_SETUP.md) and is strictly optional.
#
# SAFETY PRECONDITION: a self-hosted runner must only ever serve a PRIVATE
# repo. On a public repo any fork could open a PR and run arbitrary code as
# the runner user, on your machine.
name: deploy

# Which commit went to the training host, and whether it was auto (after ci) or manual.
# `workflow_run` runs carry the triggering branch/sha in their own payload —
# github.ref_name would say the DEFAULT branch, which is not necessarily what
# was deployed.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('deploy · manual · {0}{1} · by @{2}', github.ref_name,
                inputs.launch && ' · WILL LAUNCH' || '', github.actor)
      || format('deploy · after ci · {0}@{1}',
                github.event.workflow_run.head_branch,
                github.event.workflow_run.head_sha) }}

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    # No `branches:` filter — deploy follows whatever branch you work on.
  workflow_dispatch:
    inputs:
      launch:
        description: "also START training after syncing (default: no)"
        type: boolean
        default: false
      allow_stop_live:
        description: "proceed even if training is LIVE (it will be stopped)"
        type: boolean
        default: false

# Two runs must not race a half-synced tree onto one training host. cancel-in-progress
# is FALSE on purpose: cancelling mid-rsync would leave exactly that.
concurrency:
  group: deploy-training host
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # FORKS CANNOT REACH THIS RUNNER (2026-10-01, for publishing).
    # `workflow_run` DOES fire for pull requests from forks, and it runs in
    # the BASE repo context with full runner access -- the documented
    # escalation path onto a self-hosted runner from a public repo. The job
    # below ssh's into the training host, so this guard is the thing standing
    # between a stranger's PR and the box.
    # workflow_dispatch is unaffected: dispatching already requires write
    # access, and head_repository is absent there, hence the || clause.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # PIN TO THE COMMIT CI ACTUALLY TESTED. On a `workflow_run` event
      # GITHUB_SHA is the tip of the default branch, not the commit that
      # triggered the passing run — so a bare checkout can ship code CI never
      # saw. The `|| github.sha` fallback covers workflow_dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Report exactly what is being deployed
        run: |
          echo "commit:    $(git rev-parse HEAD)"
          echo "subject:   $(git log -1 --pretty=%s)"
          echo "trigger:   ${{ github.event_name }}"
          echo "transport: ${DEPLOY_TRANSPORT:-ssh}"
          echo "launch:    ${{ github.event.inputs.launch || 'false' }}"

      - name: Preflight — can we reach the training host at all?
        run: |
          set -euo pipefail
          T="${DEPLOY_TRANSPORT:-ssh}"
          if [ "$T" = "tailscale" ]; then
            : "${MAIN_HOST:?MAIN_HOST not set in the runner .env}"
            command -v tailscale >/dev/null || { echo "::error::tailscale CLI not on the runner host"; exit 1; }
            # If this HANGS rather than fails, the tailnet ACL ssh rule is
            # action "check" (interactive re-auth) instead of "accept".
            tailscale ssh "${MAIN_USER:-root}@${MAIN_HOST}" 'echo "training host: $(hostname)"' \
              || { echo "::error::Tailscale SSH to ${MAIN_HOST} failed — see docs/CI_SETUP.md"; exit 1; }
          else
            : "${MAIN_HOST:?MAIN_HOST not set in the runner .env (training-host IP for ssh transport)}"
            : "${MAIN_SSH_PORT:?MAIN_SSH_PORT not set in the runner .env}"
            KEY="${MAIN_SSH_KEYFILE:-$HOME/.ssh/skybot_ed25519}"
            [ -f "$KEY" ] || { echo "::error::no SSH key at $KEY on the runner host"; exit 1; }
            ssh -p "$MAIN_SSH_PORT" -i "$KEY" -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
                "${MAIN_USER:-root}@$MAIN_HOST" 'echo "training host: $(hostname)"' \
              || { echo "::error::ssh to $MAIN_HOST:$MAIN_SSH_PORT failed. The host's SSH port rotates on every restart — update MAIN_SSH_PORT in the runner .env."; exit 1; }
          fi

      # STEP-LEVEL TIMEOUT (added 2026-09-02). A hang here used to run until
      # the 30-minute JOB timeout, and GitHub marks the job failed while the
      # step still shows "in progress" with no error printed — the worst
      # possible diagnostic. 12 minutes is generous for rsync + four host-side
      # smoke suites; anything longer is a hang, not slow work.
      - name: Sync code + host-side smoke tests
        timeout-minutes: 12
        env:
          # deploy_skybot.sh reads these; MAIN_HOST/MAIN_SSH_PORT/MAIN_SSH_KEYFILE
          # come from the runner .env and are NOT redefined here (an unset
          # `${{ vars.X }}` would expand to "" and shadow them).
          DEPLOY_LAUNCH: ${{ github.event.inputs.launch == 'true' && '1' || '0' }}
          DEPLOY_ALLOW_STOP_LIVE: ${{ github.event.inputs.allow_stop_live == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash scripts/deploy_skybot.sh "${MAIN_SSH_PORT:-22}"

      - name: Report final host state
        run: |
          T="${DEPLOY_TRANSPORT:-ssh}"
          CMD='cd /workspace/devai 2>/dev/null || exit 0
               R="run_min""ecraft"
               if pgrep -f "$R[.]py" >/dev/null; then
                 echo "training LIVE (pid $(cat runlogs/skybot_run.pid 2>/dev/null))"
               else
                 echo "training not running"
               fi
               echo "STOP file: $(test -f runlogs/STOP && echo present || echo absent)"'
          if [ "$T" = "tailscale" ]; then
            tailscale ssh "${MAIN_USER:-root}@${MAIN_HOST}" "$CMD"
          else
            ssh -p "$MAIN_SSH_PORT" -i "${MAIN_SSH_KEYFILE:-$HOME/.ssh/skybot_ed25519}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "${MAIN_USER:-root}@$MAIN_HOST" "$CMD"
          fi
