# Quality gate. Runs on the GitHub runner only — no pod, no tailnet, no GPU.
#
# WHY A SUBSET BY DEFAULT: there are 91 `tests/_*_smoke.py` files and several
# construct a full DevelopmentalAI. Running all of them costs ~45 min of a
# private repo's CI minutes on every push. The `core` set below is the
# repo's own trust boundary — the four suites `scripts/deploy_skybot.sh`
# already refuses to launch without, plus the contract tests that encode the
# rules CLAUDE.md says have each been re-broken multiple times (scripted
# skills, the GUI/gamma-discounting farm, PPO starvation, the data diet).
# Use the `full` input via workflow_dispatch before a risky merge.
#
# These tests are standalone `__main__` scripts, NOT pytest. Each prints
# numbered contract lines and ends with `[name] ALL PASS`; a non-zero exit is
# the failure signal. There is no runner, so this workflow is the runner.
name: ci

# Which suite ran, on what. A push run and a manual `full` run are very
# different things and looked identical in the list.
run-name: >-
  ci · ${{ github.event.inputs.suite || 'core' }} · ${{ github.ref_name }}${{ github.event_name == 'pull_request' && ' (PR)' || '' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "core (fast gate) or full (all 91 smokes)"
        type: choice
        options: [core, full]
        default: core

jobs:
  smoke:
    # DEFAULTS TO A CLEAN GITHUB RUNNER ON PURPOSE, unlike deploy.yml/host.yml.
    # This job needs NO secrets and never touches the pod, so it gains nothing
    # from being self-hosted — and it loses the one thing a throwaway box is
    # good for: a clean-room dependency check. A missing `crafter`/`minigrid`
    # surfaces as ModuleNotFoundError that reads exactly like a code failure,
    # and that already cost a diagnostic cycle here; a developer machine has
    # them installed and would hide it.
    # To move it onto the self-hosted runner anyway (e.g. to conserve metered
    # private-repo minutes), set the repository variable CI_RUNS_ON to
    # `self-hosted`. No secrets are involved either way.
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 3.10 matches the pod's venv_mc. The MineRL chain is pinned to 3.10
      # (legacy gym + setuptools==65.5.1; 3.12 dropped stdlib distutils that
      # those builds still expect). CI does not build MineRL, but staying on
      # the same interpreter keeps "passes in CI, fails on the pod" rare.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # CPU torch on purpose: the default index pulls ~2.5 GB of CUDA wheels
      # that a CPU runner can never use.
      #
      # NOT installing the full requirements.txt: neo4j, pykeen,
      # torch-geometric and stable-baselines3 are heavy and their imports are
      # already guarded at runtime (the pod logs warn-and-continue for exactly
      # these). crafter and minigrid ARE required — 20 smokes import them, and
      # a missing one surfaces as ModuleNotFoundError that reads like a code
      # failure. That already cost a diagnostic cycle on the A4000 pod, which
      # is why requirements.txt carries a note about it.
      # VERSIONS MIRROR THE POD, MEASURED FROM IT (2026-09-02).
      # The first version of this step installed UNPINNED latest and 6 of the
      # 12 core suites failed while all 12 passed locally — not six bugs, one
      # stack mismatch. requirements.txt specifies only FLOORS
      # (`torch>=2.0.0`, `numpy>=1.24.0`), so a fresh resolve pulls whatever
      # shipped this week and CI tests a configuration that exists nowhere.
      #
      # THE VERSIONS BELOW WERE READ OFF THE RUNNING POD (`pip list` in
      # venv_mc), NOT GUESSED. That distinction cost a wrong fix: the first
      # attempt pinned `numpy<2` on the assumption that numpy 2 was the
      # culprit. The pod actually runs numpy 2.2.6, and the failing suites
      # were then re-run ON the pod against it — all passed. So numpy 2 is
      # production, and `numpy<2` would have made CI green for a stack that
      # never ships. torch is the real difference: the pod is on 2.6.0 while
      # an unpinned install pulls something far newer.
      #
      # WHEN YOU BUMP THE POD, BUMP THESE IN THE SAME CHANGE — a CI that
      # tests a stack the pod does not run is worse than no CI, because it
      # reports green for a configuration nobody deploys. Re-read them with:
      #   ssh <pod> 'cd /workspace/devai && ./venv_mc/bin/pip list'
      - name: Install dependencies (mirrors the pod's venv_mc)
        run: |
          python -m pip install -q --upgrade pip wheel setuptools
          # CPU build: the default index pulls ~2.5 GB of CUDA wheels a CPU
          # runner can never use. Same 2.6.0 as the pod's 2.6.0+cu124.
          pip install -q "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          # NO crafter, NO minigrid (removed 2026-09-02). They are OTHER
          # training environments (configs/crafter.yaml, minigrid_doorkey.yaml)
          # and have nothing to do with deploying SkyBot to a Minecraft
          # server. They were here only because the core set included
          # _options_smoke, which builds a Crafter env — so a Crafter
          # dependency leaked into a Minecraft deployment gate. crafter also
          # depends on legacy `gym`, which resolves badly alongside gymnasium.
          # The suite list below is now SkyBot-only and needs neither.
          pip install -q "numpy==2.2.6" "gymnasium==1.3.0" "PyYAML==6.0.3" \
                        "pillow==12.3.0" "scipy==1.15.3" "matplotlib==3.10.9" \
                        "tqdm==4.70.0" "imageio==2.37.4" "psutil==7.2.2" \
                        scikit-learn

      - name: Environment report
        run: |
          python - <<'PY'
          import sys, torch, numpy, gymnasium
          print("python   ", ".".join(map(str, sys.version_info[:3])))
          print("torch    ", torch.__version__)
          print("numpy    ", numpy.__version__)
          print("gymnasium", gymnasium.__version__)
          # Guard the MIRROR, not a guessed value: these must match the pod.
          assert numpy.__version__ == "2.2.6", f"numpy drifted to {numpy.__version__}"
          assert torch.__version__.startswith("2.6.0"), f"torch drifted to {torch.__version__}"
          PY
          # FULL RESOLVE, printed every run. The failing suites pass on the pod
          # (Linux, py3.10, torch 2.6.0, numpy 2.2.6) both on GPU and with
          # CUDA hidden, so device and those three versions are all ruled out.
          # Whatever differs is in here — most likely a transitive dep pulled
          # in by crafter/minigrid that the pod's venv_mc does not have.
          echo "----- pip freeze -----"
          pip freeze

      - name: Run smoke suite
        env:
          PYTHONPATH: .
          SUITE: ${{ github.event.inputs.suite || 'core' }}
        run: |
          set -uo pipefail
          if [ "$SUITE" = "full" ]; then
            mapfile -t TESTS < <(ls tests/_*_smoke.py)
          else
            # SKYBOT-ONLY. This pipeline exists to deploy SkyBot to a
            # Minecraft server, so the gate is the suites that bear on that.
            # Every one below was VERIFIED to pass on the pod's own venv_mc —
            # Linux, python 3.10, torch 2.6.0, numpy 2.2.6, no crafter, no
            # minigrid, CUDA hidden — i.e. this exact dependency set.
            TESTS=(
              # the four scripts/deploy_skybot.sh gates the pod launch on
              tests/_reward_fixes_smoke.py
              tests/_centering_drive_smoke.py
              tests/_resume_smoke.py
              tests/_stall_fixes_smoke.py
              # contract tests for the bug classes CLAUDE.md says keep recurring
              tests/_no_scripted_skills_smoke.py
              tests/_gui_farm_smoke.py
              tests/_throughput_wave_smoke.py
              tests/_data_diet_smoke.py
              tests/_capacity_wave_smoke.py
              tests/_anticipation_smoke.py
              tests/_learning_rate_wave_smoke.py
              # ADDED 2026-09-25. This file existed for weeks and was gated
              # NOWHERE, so it had never run. It now also carries the
              # contracts for the cave incident: imagination was 69% of all
              # income while the agent went 196k steps without breaking a
              # block, because `dis` was normalised against a DECAYING
              # running maximum and could not report its own exhaustion.
              tests/_imagination_curiosity_smoke.py
              # RE-ADDED 2026-09-02 after the arch:rssm bind path was built.
              # This suite is the one that caught it: it mints a skill through
              # the real bank and binds it, so it fails if the encoded-family
              # plumbing regresses. Keep it in the gate.
              tests/_skybot_boot_smoke.py
              # The live tracker. In the gate because its failure mode is
              # "looks healthy, stores nothing" — a green dashboard gets read
              # as evidence, so the contracts that keep it honest (one
              # ledger.segment() consumer, seq never rewinds) must be enforced
              # on every push, not checked once.
              tests/_metrics_sink_smoke.py
            )
            # DELIBERATELY EXCLUDED, each for a reason:
            #   _options_smoke     builds a Crafter env — wrong environment
            #                      for this pipeline, and the sole reason
            #                      crafter/minigrid were ever installed here.
            #   _remote_server_smoke, _minerl_smoke
            #                      import `minerl`, which needs Java + the
            #                      built MCP-Reborn tree. Pod-only by nature;
            #                      deploy_skybot.sh runs the pod-side gate.
            # (_skybot_boot_smoke was excluded while arch:rssm binding was
            #  broken; it is back in the list above now that it is built.)
          fi
          echo "running ${#TESTS[@]} suite(s)"
          mkdir -p /tmp/suite_logs
          FAILED=()
          for t in "${TESTS[@]}"; do
            [ -f "$t" ] || { echo "SKIP (missing): $t"; continue; }
            LOG="/tmp/suite_logs/$(basename "$t").log"
            printf '::group::%s\n' "$t"
            # Per-test timeout so one hang cannot eat the whole job budget.
            # Output is TEE'd: visible in the group, and kept for the failure
            # report below.
            timeout 600 python "$t" 2>&1 | tee "$LOG"
            # PIPESTATUS[0] is python's exit code; $? would be tee's, which is
            # always 0 and would mark every suite as passing.
            RC=${PIPESTATUS[0]}
            echo '::endgroup::'
            if [ "${RC:-1}" -eq 0 ]; then
              echo "PASS $t"
            else
              echo "FAIL $t (exit $RC)"
              FAILED+=("$t")
            fi
          done

          echo "==================== SUMMARY ===================="
          if [ ${#FAILED[@]} -eq 0 ]; then
            echo "all ${#TESTS[@]} suite(s) passed"
            exit 0
          fi

          # PRINT FAILURES OUTSIDE THE GROUPS (added 2026-09-02).
          # The first version wrapped every suite in ::group:: and printed only
          # a list of names in the summary. Groups render COLLAPSED, so a
          # failing run showed 12 filenames and no traceback — the log
          # contained the answer and nobody could see it. Three debugging
          # rounds were spent guessing at causes that measurement then refuted.
          # A CI that hides the error is not a diagnostic tool.
          echo ""
          echo "############### FAILURE DETAIL ###############"
          for t in "${FAILED[@]}"; do
            LOG="/tmp/suite_logs/$(basename "$t").log"
            echo ""
            echo "=================================================="
            echo "### $t"
            echo "=================================================="
            tail -40 "$LOG" 2>/dev/null || echo "(no log captured)"
            # One-line annotation so the cause shows on the run's summary page
            # without opening the log at all.
            REASON=$(grep -aoE "(ModuleNotFoundError|ImportError|AssertionError|RuntimeError|TypeError|AttributeError|ValueError|FileNotFoundError|OSError)[^\"]{0,160}" "$LOG" 2>/dev/null | tail -1)
            echo "::error file=$t::${REASON:-failed, see FAILURE DETAIL in the log}"
          done

          {
            echo "### Failed suites"
            for t in "${FAILED[@]}"; do
              LOG="/tmp/suite_logs/$(basename "$t").log"
              echo "<details><summary>$t</summary>"
              echo ""
              echo '```'
              tail -40 "$LOG" 2>/dev/null
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'FAILED: %s\n' "${FAILED[@]}"
          exit 1
