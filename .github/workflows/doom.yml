# Doom. One of the per-game actions for SkyBot's ONE universal brain
# (docs/UNIVERSAL_GAMES.md §6, docs/OPERATIONS.md "Per-game actions").
#
# ONE WORKFLOW, TWO ENGINES (2026-10-14; was game-doom.yml + game-doom_player.yml,
# two near-identical files that differed only in GAME). `engine` picks which:
#
#   vizdoom   game `doom`: the ViZDoom research API (docs/UNIVERSAL_GAMES.md §6).
#   player    game `doom_player`: the real Chocolate Doom engine, played through
#             a screen, speakers, keyboard and mouse like a person (§11).
#             UNPROVEN ON THE HOST until tools/player_spike.py (stage P0)
#             passes there.
#
# They are separate entries in runlogs/games.enabled and can both be enabled.
#
#   status    what is enabled, what is running, Doom's save-state rings. Safe.
#   install   whatever configs/games/<game>.yaml `install:` lists, via
#             tools/game_install.py: the LAN game depot first (synced from the
#             runner, scripts/depot_sync.sh), the internet second; nothing
#             already installed is fetched again. Idempotent.
#             vizdoom: libopenal1 + vizdoom==1.3.1 + Freedoom (sha256-verified).
#             player:  pulseaudio + chocolate-doom + mss + python-xlib + Freedoom.
#   enable    add it to runlogs/games.enabled
#   disable   remove it (refused if it is the last enabled game)
#
# `restart` (install/enable/disable): stop the live run GRACEFULLY, sync the
# code, and relaunch so the change takes effect now. Off = the change waits for
# the next launch.
#
# INSTALL STOPS A LIVE RUN TOO (2026-10-14). It used to sync without stopping,
# and deploy_skybot.sh REFUSES to sync under a live run — so `install` failed
# every time training was up, which is exactly when you would run it after
# `host -> launch`. With restart off, install now fails fast with that reason
# instead of inside the deploy script. There is still exactly one trainer and one brain: enabling Doom
# ADDS Doom streams to it, it does not start a second agent.
#
# workflow_dispatch workflows only appear in the Actions tab once this file is
# on the DEFAULT branch (same rule as deploy.yml's workflow_run, CLAUDE.md §6).
name: Doom

run-name: >-
  Doom · ${{ inputs.engine }} · ${{ inputs.action }}${{ (inputs.action == 'install' || inputs.action == 'enable' || inputs.action == 'disable') && inputs.restart && ' · restart' || '' }} · by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "vizdoom (game: doom) or player (game: doom_player, real Chocolate Doom)"
        type: choice
        options: [vizdoom, player]
        default: vizdoom
      action:
        description: "what to do"
        type: choice
        options: [status, install, enable, disable]
        default: status
      restart:
        description: "install/enable/disable: stop the live run, sync code, relaunch it (only if it was running)"
        type: boolean
        default: true
      timesteps:
        description: "relaunch only: total timesteps"
        default: "4000000"

# Serialised with the other game actions: two of them restarting the one
# supervisor at once would race the singleton lock and the games file.
concurrency:
  group: skybot-games
  cancel-in-progress: false

jobs:
  game:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      GAME: ${{ inputs.engine == 'player' && 'doom_player' || 'doom' }}
      ACTION: ${{ inputs.action }}
      RESTART: ${{ (inputs.action == 'install' || inputs.action == 'enable' || inputs.action == 'disable') && inputs.restart && '1' || '0' }}
      TS_STEPS: ${{ inputs.timesteps }}
    steps:
      - uses: actions/checkout@v4

      # Stop BEFORE syncing: deploy_skybot.sh refuses to sync under a live run
      # without DEPLOY_ALLOW_STOP_LIVE, and a graceful stop saves the brain.
      # A RUN STOPPED ON PURPOSE STAYS STOPPED (2026-10-14). The stop below
      # succeeds instantly when nothing is running, and relaunch clears
      # runlogs/STOP — so with restart on (the default), any game action used
      # to START training on a host someone had deliberately stopped. Only a
      # run that was live is relaunched; start one by hand with host -> launch.
      - name: was training running?
        id: live
        if: ${{ env.RESTART == '1' }}
        run: |
          if bash scripts/host_exec.sh 'R="run_min""ecraft"; pgrep -f "$R[.]py" >/dev/null'; then
            echo "was_live=1" >> "$GITHUB_OUTPUT"; echo "training is running: it will be relaunched"
          else
            echo "was_live=0" >> "$GITHUB_OUTPUT"; echo "training is NOT running: it will not be started (host -> launch does that)"
          fi

      - name: stop the live run (graceful)
        id: stop
        if: ${{ env.RESTART == '1' }}
        run: |
          set -euo pipefail
          bash scripts/host_stop_wait.sh 1200

      - name: refuse to sync onto a live run
        if: ${{ env.RESTART == '0' && inputs.action == 'install' }}
        run: |
          set -euo pipefail
          if bash scripts/host_exec.sh 'R="run_min""ecraft"; pgrep -f "$R[.]py" >/dev/null' 2>/dev/null; then
            echo "::error::training is LIVE and install must sync code first. Re-run with restart=true (stops gracefully, installs, relaunches), or host -> stop first."
            exit 1
          fi

      # The host needs this commit's game_ctl.sh, configs/games/ and composer.
      - name: sync code + host-side smoke tests
        id: sync
        if: ${{ env.RESTART == '1' || inputs.action == 'install' }}
        timeout-minutes: 12
        env:
          DEPLOY_LAUNCH: "0"
        run: |
          set -euo pipefail
          bash scripts/deploy_skybot.sh "${MAIN_SSH_PORT:-22}"

      # THE LAN GAME DEPOT (2026-10-14): everything an earlier install fetched
      # (.debs, wheels, WADs) goes to the host from node1 over the LAN first,
      # so the install below only reaches the internet for what is new — and
      # what it does fetch is copied back afterwards. Neither step can fail the
      # job: without a depot, install still works from the internet.
      - name: game depot -> host
        if: ${{ inputs.action == 'install' }}
        continue-on-error: true
        run: bash scripts/depot_sync.sh to-host

      - name: install ${{ env.GAME }}
        if: ${{ inputs.action == 'install' }}
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh "cd /workspace/devai && bash scripts/game_ctl.sh ${GAME} install"

      # always(): a partly-failed install still keeps what it downloaded
      - name: host -> game depot
        if: ${{ always() && inputs.action == 'install' && steps.sync.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/depot_sync.sh from-host

      - name: ${{ inputs.action }} ${{ env.GAME }}
        if: ${{ inputs.action == 'enable' || inputs.action == 'disable' }}
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh "cd /workspace/devai && bash scripts/game_ctl.sh ${GAME} ${ACTION}"

      # Same launch block as host.yml `launch`: green only for a LIVE agent.
      #
      # RELAUNCHES EVEN IF THE ACTION FAILED (2026-10-14). This used to be
      # skipped whenever any earlier step failed, so a failed install (an apt
      # mirror timing out) left training STOPPED until a human noticed — a
      # guard-becomes-latch (CLAUDE.md §4.1). It is restarted whenever it WAS
      # running (steps.live) and the stop and the sync both succeeded. The job still goes red for the failed step. It does NOT
      # relaunch after a failed sync: that would start code whose host-side
      # smoke tests just failed.
      - name: relaunch
        if: ${{ !cancelled() && env.RESTART == '1' && steps.live.outputs.was_live == '1' && steps.stop.outcome == 'success' && steps.sync.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh "
            cd /workspace/devai
            rm -f runlogs/STOP
            setsid nohup bash scripts/supervise_skybot.sh ${TS_STEPS} \
              > runlogs/supervisor.log 2>&1 < /dev/null &
            sleep 25
            tail -8 runlogs/supervisor.log
            PID=\$(cat runlogs/skybot_run.pid 2>/dev/null || true)
            if [ -n \"\$PID\" ] && ps -p \"\$PID\" >/dev/null 2>&1; then
              echo \"run pid: \$PID (LIVE)\"
            else
              echo '::error::relaunch did not produce a live agent -- see REFUSED above'
              grep -E 'REFUSED|refused' runlogs/supervisor.log 2>/dev/null | tail -5
              exit 1
            fi"

      - name: status
        if: ${{ always() }}
        run: |
          bash scripts/host_exec.sh "cd /workspace/devai && bash scripts/game_ctl.sh ${GAME} status" || true
