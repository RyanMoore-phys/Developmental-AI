# Game — Doom through the PLAYER ADAPTER (the real Chocolate Doom engine,
# played through a screen, speakers, keyboard and mouse like a person).
# docs/UNIVERSAL_GAMES.md §11. Same actions as game-doom:
#
#   status    what is enabled / running. Safe.
#   install   pulseaudio + chocolate-doom + mss + python-xlib + Freedoom.
#   enable    add doom_player to runlogs/games.enabled
#   disable   remove it (refused if it is the last enabled game)
#
# UNPROVEN ON THE HOST until tools/player_spike.py (stage P0) passes there.
# workflow_dispatch workflows only appear in the Actions tab once this file is
# on the DEFAULT branch (CLAUDE.md §6).
name: game-doom_player

run-name: >-
  game · doom_player · ${{ inputs.action }}${{ (inputs.action == 'enable' || inputs.action == 'disable') && inputs.restart && ' · restart' || '' }} · by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "what to do"
        type: choice
        options: [status, install, enable, disable]
        default: status
      restart:
        description: "enable/disable: stop the live run, sync code, relaunch now"
        type: boolean
        default: true
      timesteps:
        description: "relaunch only: total timesteps"
        default: "4000000"

# Serialised with the other game actions: two of them restarting the one
# supervisor at once would race the singleton lock and the games file.
concurrency:
  group: skybot-games
  cancel-in-progress: false

jobs:
  game:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      GAME: doom_player
      ACTION: ${{ inputs.action }}
      RESTART: ${{ (inputs.action == 'enable' || inputs.action == 'disable') && inputs.restart && '1' || '0' }}
      TS_STEPS: ${{ inputs.timesteps }}
    steps:
      - uses: actions/checkout@v4

      # Stop BEFORE syncing: deploy_skybot.sh refuses to sync under a live run
      # without DEPLOY_ALLOW_STOP_LIVE, and a graceful stop saves the brain.
      - name: stop the live run (graceful)
        if: ${{ env.RESTART == '1' }}
        run: |
          set -euo pipefail
          bash scripts/host_stop_wait.sh 1200

      # The host needs this commit's game_ctl.sh, configs/games/ and composer.
      - name: sync code + host-side smoke tests
        if: ${{ env.RESTART == '1' || inputs.action == 'install' }}
        timeout-minutes: 12
        env:
          DEPLOY_LAUNCH: "0"
        run: |
          set -euo pipefail
          bash scripts/deploy_skybot.sh "${MAIN_SSH_PORT:-22}"

      - name: install
        if: ${{ inputs.action == 'install' }}
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh "cd /workspace/devai && bash scripts/game_ctl.sh ${GAME} install"

      - name: ${{ inputs.action }} ${{ env.GAME }}
        if: ${{ inputs.action == 'enable' || inputs.action == 'disable' }}
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh "cd /workspace/devai && bash scripts/game_ctl.sh ${GAME} ${ACTION}"

      # Same launch block as host.yml `launch`: green only for a LIVE agent.
      - name: relaunch
        if: ${{ env.RESTART == '1' }}
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh "
            cd /workspace/devai
            rm -f runlogs/STOP
            setsid nohup bash scripts/supervise_skybot.sh ${TS_STEPS} \
              > runlogs/supervisor.log 2>&1 < /dev/null &
            sleep 25
            tail -8 runlogs/supervisor.log
            PID=\$(cat runlogs/skybot_run.pid 2>/dev/null || true)
            if [ -n \"\$PID\" ] && ps -p \"\$PID\" >/dev/null 2>&1; then
              echo \"run pid: \$PID (LIVE)\"
            else
              echo '::error::relaunch did not produce a live agent -- see REFUSED above'
              grep -E 'REFUSED|refused' runlogs/supervisor.log 2>/dev/null | tail -5
              exit 1
            fi"

      - name: status
        if: ${{ always() }}
        run: |
          bash scripts/host_exec.sh "cd /workspace/devai && bash scripts/game_ctl.sh ${GAME} status" || true
