# The whole chain in one place: preflight -> deploy -> connect -> launch -> report.
#
# This is the "run everything" workflow. Unlike host.yml (one action at a time)
# each stage here is its own JOB, so the run view shows a chain of boxes and a
# failure tells you WHICH stage broke without reading a log.
#
# STAGES ARE OPT-IN. Every one is a checkbox, and `launch` defaults to FALSE.
# Starting training is the one irreversible-ish act here — it costs the brain's
# continuity if it restarts a live run — so it never happens because you left a
# default alone.
#
# SCHEDULED RUNS ARE HEALTH CHECKS ONLY, BY CONSTRUCTION. On a `schedule`
# event the `inputs` context is empty, so every `if: inputs.X` is false and
# only preflight + report run. Cron therefore reports on the pod; it cannot
# deploy to it or start it. To change that you have to edit this file
# deliberately, which is the point.
#
# RUNNER: `self-hosted` with no extra label, matching the runner registered on
# this machine (iMac-3). If you ever add a second runner, give them distinct
# labels and target those instead, or jobs will land on whichever is free.
name: pipeline

# A SCHEDULED RUN LOOKS EMPTY, AND THAT IS THE DESIGN — but it read as broken.
# On a `schedule` event the `inputs` context is empty, so every `if: inputs.X`
# is false and deploy/connect/launch are SKIPPED; only preflight and report
# run. That is the safety property (cron cannot deploy or start training), but
# three grey boxes with no explanation looks like a failure. The run title now
# says which it is.
run-name: >-
  ${{ github.event_name == 'schedule'
      && 'pipeline · daily health check (deploy/connect/launch skipped by design)'
      || format('pipeline · stop={0} deploy={1} connect={2} LAUNCH={3} · by @{4}',
                inputs.stop, inputs.deploy, inputs.connect, inputs.launch, github.actor) }}

on:
  workflow_dispatch:
    inputs:
      stop:
        description: "STOP a live run first, and WAIT for it to exit (needed before deploy)"
        type: boolean
        default: true
      deploy:
        description: "sync code to the pod (runs pod-side smoke tests)"
        type: boolean
        default: true
      connect:
        description: "bring up the socat bridge to the Paper server"
        type: boolean
        default: true
      launch:
        description: "START TRAINING (leave off unless you mean it)"
        type: boolean
        default: false
      timesteps:
        description: "launch only: total timesteps"
        default: "4000000"
  schedule:
    # 09:00 UTC daily — health report only, see the note above.
    - cron: "0 9 * * *"

# One pipeline against one pod at a time. cancel-in-progress is FALSE:
# cancelling mid-rsync would leave a half-synced tree on the pod.
concurrency:
  group: skybot-pipeline
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      training_live: ${{ steps.probe.outputs.training_live }}
    steps:
      - uses: actions/checkout@v4

      - name: Pod reachable?
        run: |
          set -euo pipefail
          bash scripts/host_exec.sh 'echo "pod: $(hostname)"' \
            || { echo "::error::cannot reach the pod. MAIN_SSH_PORT rotates on every pod restart — update ~/actions-runner/.env and RESTART the runner (.env is only read at start)."; exit 1; }

      - name: Probe pod state
        id: probe
        run: |
          set -euo pipefail
          # Patterns SPLIT so this command line cannot match itself.
          OUT=$(bash scripts/host_exec.sh '
            cd /workspace/devai 2>/dev/null || { echo "NOREPO"; exit 0; }
            R="run_min""ecraft"
            pgrep -f "$R[.]py" >/dev/null && echo "LIVE" || echo "IDLE"
            test -f runlogs/STOP && echo "STOP_PRESENT" || echo "STOP_ABSENT"
            ss -tln 2>/dev/null | grep -q "127.0.0.1:25565" && echo "BRIDGE_UP" || echo "BRIDGE_DOWN"')
          echo "$OUT"
          case "$OUT" in *LIVE*) L=true ;; *) L=false ;; esac
          echo "training_live=$L" >> "$GITHUB_OUTPUT"
          echo "### Pod state" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # THE MISSING STAGE (2026-09-04). `deploy` REFUSES while training is live,
  # and nothing in this pipeline could stop it — so the only route was a
  # separate `pod` run, whose stop reported GREEN on timeout while the agent
  # was still going. The result was a hand-run loop: stop -> deploy fails ->
  # stop again -> deploy with allow_stop_live. That is a missing edge in the
  # graph, not user error, and `needs:` is exactly the thing that fixes it.
  #
  # Skipping this stage (stop=false) does NOT skip its ordering: `deploy`
  # still waits for the job to resolve, so unchecking it cannot race.
  stop:
    needs: preflight
    if: ${{ !cancelled() && inputs.stop && needs.preflight.result == 'success' }}
    runs-on: self-hosted
    # 25 > the 20-minute wait inside the script, so the script's own honest
    # timeout message is what you see rather than a bare job kill.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Stop training and WAIT for the process to exit
        run: |
          set -euo pipefail
          # Run unconditionally rather than trusting preflight's reading:
          # the script exits immediately when nothing is running, and both
          # launch paths `rm -f runlogs/STOP` before starting, so a STOP file
          # written against an idle pod cannot strand the next launch.
          # Gating on a prior job's probe would only reintroduce a stale read.
          bash scripts/host_stop_wait.sh 1200

  deploy:
    # `stop` is in `needs` even when unchecked: a skipped job still resolves,
    # so deploy can never start while a stop is in flight.
    needs: [preflight, stop]
    if: ${{ !cancelled() && inputs.deploy && needs.preflight.result == 'success'
            && needs.stop.result != 'failure' }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy onto a live run
        # deploy_skybot.sh already refuses, but it does so from inside a long
        # script. Failing here says WHICH stage and WHY in one line, and
        # names the fix instead of leaving you to guess at flags.
        run: |
          set -euo pipefail
          if bash scripts/host_exec.sh 'R="run_min""ecraft"; pgrep -f "$R[.]py" >/dev/null' 2>/dev/null; then
            echo "::error::training is STILL LIVE. Re-run this pipeline with stop=true (it waits up to 20 min for a real exit). Do not reach for allow_stop_live unless you intend to discard the current segment."
            exit 1
          fi
          echo "pod is idle — safe to sync"
      - name: Sync + pod-side smoke tests
        env:
          # Never launches from here — that is the `launch` job's decision.
          DEPLOY_LAUNCH: "0"
        run: |
          set -euo pipefail
          echo "deploying $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
          bash scripts/deploy_skybot.sh "${MAIN_SSH_PORT:-22}"

  connect:
    needs: [preflight, stop, deploy]
    # `stop` must not have FAILED. Without this, a stop that times out
    # skips deploy, and "deploy skipped" reads as permission to carry on —
    # so connect/launch would proceed against a pod still running the OLD
    # code. A failed stop must stop the whole chain, not just one edge.
    if: >
      !cancelled() && inputs.connect &&
      needs.preflight.result == 'success' &&
      needs.stop.result != 'failure' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bridge to the Paper server
        run: |
          set -euo pipefail
          : "${MC_SERVER_TS_IP:?set MC_SERVER_TS_IP in ~/actions-runner/.env}"
          bash scripts/host_exec.sh \
            "cd /workspace/devai && bash scripts/connect_server.sh bridge ${MC_SERVER_TS_IP}"

  launch:
    needs: [preflight, stop, deploy, connect]
    if: >
      !cancelled() && inputs.launch &&
      needs.preflight.result == 'success' &&
      needs.stop.result != 'failure' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (needs.connect.result == 'success' || needs.connect.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to restart a live run
        # RE-PROBED, not read from preflight (2026-09-04). preflight runs
        # BEFORE the stop stage, so its `training_live` is stale by the time
        # we get here: after a successful stop -> deploy, the stale `true`
        # would refuse the launch and break the very stop->deploy->launch
        # chain this pipeline exists to provide. Ask the pod now.
        run: |
          set -euo pipefail
          if bash scripts/host_exec.sh 'R="run_min""ecraft"; pgrep -f "$R[.]py" >/dev/null' 2>/dev/null; then
            echo "::error::training is already LIVE. Relaunching would cost the run's continuity. Re-run with stop=true, which waits for a real exit."
            exit 1
          fi
          echo "pod is idle — safe to launch"

      - name: Start training
        env:
          TS_STEPS: ${{ inputs.timesteps }}
        run: |
          set -euo pipefail
          # launch_skybot.sh owns the pre-flight and REFUSES if the bridge or
          # server is down — a run started against a dead bridge strands the
          # primary stream in a connect-fail rebuild loop.
          bash scripts/host_exec.sh "
            cd /workspace/devai
            rm -f runlogs/STOP
            setsid nohup bash scripts/supervise_skybot.sh ${TS_STEPS} \
              > runlogs/supervisor.log 2>&1 < /dev/null &
            sleep 25
            tail -5 runlogs/supervisor.log
            echo \"run pid: \$(cat runlogs/skybot_run.pid 2>/dev/null || echo none)\""

      - name: Verify it is ACTUALLY running
        run: |
          set -euo pipefail
          # A pid existing is not evidence of progress — this project has a
          # long history of things that look started and produce nothing.
          # Wait, then require the run log to exist AND be growing.
          sleep 60
          bash scripts/host_exec.sh '
            cd /workspace/devai
            R="run_min""ecraft"
            pgrep -f "$R[.]py" >/dev/null || { echo "process died within 60s"; exit 1; }
            L=runlogs/minecraft_skybot_run.log
            [ -f "$L" ] || { echo "no run log after 60s"; exit 1; }
            A=$(wc -c < "$L"); sleep 30; B=$(wc -c < "$L")
            echo "log grew $A -> $B bytes"
            [ "$B" -gt "$A" ] || { echo "log is NOT growing — started but stalled"; exit 1; }
            tail -5 "$L"'

  report:
    needs: [preflight, stop, deploy, connect, launch]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Final pod state
        run: |
          {
            echo "### Result"
            echo "| stage | result |"
            echo "|---|---|"
            echo "| preflight | ${{ needs.preflight.result }} |"
            echo "| deploy | ${{ needs.deploy.result }} |"
            echo "| connect | ${{ needs.connect.result }} |"
            echo "| launch | ${{ needs.launch.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/host_exec.sh '
            cd /workspace/devai 2>/dev/null || exit 0
            R="run_min""ecraft"
            pgrep -f "$R[.]py" >/dev/null && echo "training LIVE" || echo "training not running"
            echo "STOP: $(test -f runlogs/STOP && echo present || echo absent)"
            ss -tln 2>/dev/null | grep -q "127.0.0.1:25565" && echo "bridge UP" || echo "bridge DOWN"
            tail -8 runlogs/minecraft_skybot_run.log 2>/dev/null || echo "no run log"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
