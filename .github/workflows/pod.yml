# Manual pod operations. Nothing here is triggered by a push.
#
# NO BRANCH PROTECTION, NO GITHUB SECRETS, NO TAILNET REQUIRED.
# Every action runs through scripts/pod_exec.sh, which defaults to plain SSH
# using the key already on the runner host. Set DEPLOY_TRANSPORT=tailscale in
# the runner .env to switch to Tailscale SSH (needs a tailnet ACL rule —
# optional, see docs/CI_SETUP.md).
#
#   status     read-only health report. Safe. Start here.
#   connect    tailscale + socat bridge to the Paper server.
#   launch     start training under the supervisor.
#   stop       GRACEFUL stop via podlogs/STOP.
#   provision  bootstrap a BARE box (40-60 min). Destructive — guarded.
#
# WHY `stop` WRITES A FILE INSTEAD OF KILLING: the supervisor treats a killed
# process as a crash and relaunches it. `touch podlogs/STOP` is the only stop
# that stays stopped (CLAUDE.md §2).
#
# SAFETY PRECONDITION: a self-hosted runner must only ever serve a PRIVATE
# repo. On a public repo any fork could run arbitrary code as the runner user.
name: pod

# The run list showed five identical rows called "pod" with no way to tell a
# read-only `status` from a `launch` or a destructive `provision`. run-name is
# evaluated per run, so the action (and the timestep budget, which is the only
# other thing that changes what a launch DOES) goes in the title.
run-name: >-
  pod · ${{ inputs.action }}${{ inputs.action == 'launch' && format(' · {0} steps', inputs.timesteps) || '' }} · by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "what to do"
        type: choice
        options: [status, connect, launch, stop, provision]
        default: status
      timesteps:
        description: "launch only: total timesteps"
        default: "4000000"
      confirm_provision:
        description: "type PROVISION to allow the destructive provision action"
        default: ""

jobs:
  pod:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # NOT branch protection — this guards YOUR POD. `provision` does
      # `rm -rf mc-build` and rebuilds MineRL from scratch (40-60 min). Run by
      # accident against a working box it destroys an hour of build for
      # nothing. Delete this step if you would rather have the footgun.
      - name: Guard the destructive action
        if: ${{ github.event.inputs.action == 'provision' }}
        run: |
          if [ "${{ github.event.inputs.confirm_provision }}" != "PROVISION" ]; then
            echo "::error::action=provision requires confirm_provision=PROVISION. It wipes mc-build and rebuilds MineRL (40-60 min)."
            exit 1
          fi

      - name: Preflight — pod reachable
        run: |
          set -euo pipefail
          bash scripts/pod_exec.sh 'echo "pod: $(hostname)"' \
            || { echo "::error::cannot reach the pod. If using the default ssh transport, POD_SSH_PORT rotates on every pod restart — update the runner .env."; exit 1; }

      # ---------------------------------------------------------------- #
      - name: status
        if: ${{ github.event.inputs.action == 'status' }}
        run: |
          # Patterns are SPLIT so this command line cannot match itself:
          # `pgrep -f run_minecraft` matches the shell running the pgrep.
          bash scripts/pod_exec.sh '
            cd /workspace/devai 2>/dev/null || { echo "no /workspace/devai"; exit 0; }
            R="run_min""ecraft"; S="supervise""_skybot"
            echo "== run =="
            pgrep -f "$R[.]py" >/dev/null && echo "training LIVE (pid $(cat podlogs/skybot_run.pid 2>/dev/null))" || echo "training not running"
            echo "supervisor: $(pgrep -f "$S" | wc -l) proc"
            echo "STOP file:  $(test -f podlogs/STOP && echo PRESENT || echo absent)"
            echo "== bridge =="
            ss -tln 2>/dev/null | grep -q "127.0.0.1:25565" && echo "socat bridge UP" || echo "socat bridge DOWN"
            pgrep -x tailscaled >/dev/null && echo "tailscaled up" || echo "tailscaled DOWN"
            echo "== gpu =="
            nvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu --format=csv,noheader 2>/dev/null || echo "no nvidia-smi"
            echo "== last log =="
            tail -15 podlogs/minecraft_skybot_run.log 2>/dev/null || echo "no run log yet"'

      - name: connect
        if: ${{ github.event.inputs.action == 'connect' }}
        run: |
          set -euo pipefail
          : "${MC_SERVER_TS_IP:?set MC_SERVER_TS_IP in the runner .env (Paper server tailnet IP)}"
          bash scripts/pod_exec.sh \
            "cd /workspace/devai && bash scripts/connect_server.sh bridge ${MC_SERVER_TS_IP}"

      - name: launch
        if: ${{ github.event.inputs.action == 'launch' }}
        env:
          TS_STEPS: ${{ github.event.inputs.timesteps }}
        run: |
          set -euo pipefail
          # launch_skybot.sh owns the pre-flight and REFUSES if the bridge or
          # the server is down — a run started against a dead bridge strands
          # the primary stream in a connect-fail rebuild loop.
          bash scripts/pod_exec.sh "
            cd /workspace/devai
            rm -f podlogs/STOP
            setsid nohup bash scripts/supervise_skybot.sh ${TS_STEPS} \
              > podlogs/supervisor.log 2>&1 < /dev/null &
            sleep 25
            tail -5 podlogs/supervisor.log
            echo \"run pid: \$(cat podlogs/skybot_run.pid 2>/dev/null || echo none)\""

      - name: stop
        if: ${{ github.event.inputs.action == 'stop' }}
        # Graceful only. Never kill: the supervisor reads a kill as a crash
        # and relaunches, which has stranded runs before.
        #
        # This used to inline a 5-minute wait that ended in a bare `echo`, so
        # a timeout — with training STILL LIVE — exited 0 and showed a green
        # check. Five minutes was also less than a normal shutdown (segment
        # ~5 min + replay-buffer save ~8.5 min, both measured), so it timed
        # out on healthy stops and lied about it every time. See
        # scripts/pod_stop_wait.sh for the full account.
        run: |
          set -euo pipefail
          bash scripts/pod_stop_wait.sh 1200

      # ---------------------------------------------------------------- #
      # provision needs rsync as well as exec, so it builds its own ssh line
      # rather than going through pod_exec.sh. Same env vars.
      # ---------------------------------------------------------------- #
      - name: provision
        if: ${{ github.event.inputs.action == 'provision' }}
        run: |
          set -euo pipefail
          : "${POD_HOST:?set POD_HOST in the runner .env}"
          : "${POD_SSH_PORT:?set POD_SSH_PORT in the runner .env}"
          KEY="${POD_SSH_KEYFILE:-$HOME/.ssh/skybot_ed25519}"
          [ -f "$KEY" ] || { echo "::error::no SSH key at $KEY"; exit 1; }
          SSH="ssh -p $POD_SSH_PORT -i $KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          $SSH "root@$POD_HOST" 'mkdir -p /workspace/devai/podlogs'
          rsync -rlptz -e "$SSH" \
            developmental_ai configs scripts tests run_minecraft.py requirements.txt \
            "root@$POD_HOST:/workspace/devai/"
          # TS_AUTHKEY (optional, runner .env) lets stage 1c join the tailnet
          # non-interactively so the pod comes out already reachable.
          $SSH "root@$POD_HOST" "cd /workspace/devai && TS_AUTHKEY='${TS_AUTHKEY:-}' \
            nohup bash scripts/provision_pod.sh > podlogs/provision.log 2>&1 < /dev/null &
            echo started"
          echo "provisioning started; polling stage markers"
          for i in $(seq 1 110); do
            sleep 60
            OUT=$($SSH "root@$POD_HOST" 'grep -E "^=== STAGE|PROVISION-" /workspace/devai/podlogs/provision.log | tail -2' 2>/dev/null || true)
            echo "[$i min] $OUT"
            case "$OUT" in
              *PROVISION-COMPLETE*) echo "provisioning finished"; exit 0 ;;
              *PROVISION-FAILED*)   echo "::error::provisioning failed: $OUT"; exit 1 ;;
            esac
          done
          echo "::error::provisioning did not finish within the budget"; exit 1
